    function renderContent() {
      applyLanguageDirection();
      if (state.sessionExpired) {
        roots.content.innerHTML = `
          <section class="session-screen">
            <div class="stack">
              <div class="page-title">Session expired.</div>
              <div class="page-subtitle">Please reopen the WebApp from Telegram to continue.</div>
            </div>
          </section>
        `;
        return;
      }

      if (state.subscriptionGate.active) {
        roots.content.innerHTML = renderSubscriptionGate();
        return;
      }

      if (!state.groups.length && !state.isOwner) {
        roots.content.innerHTML = emptyState("No managed groups are available for this account.");
        return;
      }

      const renderers = {
        "#/home": renderHomeView,
        "#/accounts": renderAccountsView,
        "#/groups": renderGroupsView,
        "#/scraper": renderScraperView,
        "#/leads": renderLeadsView,
        "#/replies": renderRepliesView,
        "#/campaigns": renderCampaignsView,
        "#/automation": renderAutomationView,
        "#/analytics": renderAnalyticsView,
        "#/subscription": renderSubscriptionView,
        "#/settings": renderSettingsView,
        "#/owner": renderOwnerView,
      };
      const renderer = renderers[state.route] || renderHomeView;

    async function rerenderDrawerPreservingInput(target) {
      if (!state.ui.drawerContext || typeof state.ui.drawerContext.rerender !== "function") {
        return;
      }
      const action = String(target?.dataset?.action || "");
      if (!action) {
        await state.ui.drawerContext.rerender();
        return;
      }
      const selectorParts = [`[data-action="${action}"]`];
      if (target.dataset.agentId) {
        selectorParts.push(`[data-agent-id="${target.dataset.agentId}"]`);
      }
      const selector = selectorParts.join("");
      const selectionStart = typeof target.selectionStart === "number" ? target.selectionStart : null;
      const selectionEnd = typeof target.selectionEnd === "number" ? target.selectionEnd : null;
      await state.ui.drawerContext.rerender();
      requestAnimationFrame(() => {
        const replacement = roots.drawer.querySelector(selector);
        if (!replacement) return;
        replacement.focus();
        if (selectionStart !== null && selectionEnd !== null && typeof replacement.setSelectionRange === "function") {
          replacement.setSelectionRange(selectionStart, selectionEnd);
        }
      });
    }

    const settingTimers = new Map();
    const settingStatusTimers = new Map();

    function settingStatusKey(key, scope = "") {
      return scope ? `${scope}:${key}` : key;
    }

    function rerenderSettingsSurfaces() {
      renderContent();
      if (state.ui.moderationSettingsDraft) {
        renderModerationSettingsModal();
      }
    }

    function setSettingStatus(key, status, duration = 0, scope = "") {
      const statusKey = settingStatusKey(key, scope);
      state.ui.settingsStatus[statusKey] = status;
      rerenderSettingsSurfaces();
      if (settingStatusTimers.has(statusKey)) {
        clearTimeout(settingStatusTimers.get(statusKey));
        settingStatusTimers.delete(statusKey);
      }
      if (duration > 0) {
        const timer = window.setTimeout(() => {
          state.ui.settingsStatus[statusKey] = "";
          settingStatusTimers.delete(statusKey);
          rerenderSettingsSurfaces();
        }, duration);
        settingStatusTimers.set(statusKey, timer);
      }
    }

    function settingsStatusLabel(status) {
      if (status === "dirty") return "* Save changes";
      if (status === "error") return "Failed";
      if (status === "saved") return "Saved";
      return "";
    }

    function settingsStatusClass(status) {
      if (status === "dirty" || status === "error" || status === "saved") {
        return `saved-chip ${status} visible`;
      }
      return "saved-chip";
    }

    async function initializeModerationSettingsDraft(groupIds = []) {
      const normalizedGroupIds = Array.from(new Set(
        (Array.isArray(groupIds) && groupIds.length ? groupIds : [state.activeGroupId || state.groups[0]?.id || 0])
          .map((value) => Number(value))
          .filter((value) => value > 0)
      ));
      if (!normalizedGroupIds.length) {
        state.ui.moderationSettingsDraft = { group_ids: [], values: {}, error: "" };
        return;
      }
      await Promise.all(normalizedGroupIds.map((groupId) => loadSettingsForGroup(groupId)));
      const baseGroupId = normalizedGroupIds[0];
      const baseValues = { ...(state.cache.settings[baseGroupId] || {}) };
      const entries = Object.values(state.cache.settingsSchema || {})
        .flat()
        .filter((entry) => (entry.category || "general") === "moderation");
      const values = {};
      for (const entry of entries) {
        values[entry.key] = baseValues[entry.key] ?? entry.default ?? (entry.type === "toggle" ? false : "");
      }
      state.ui.moderationSettingsDraft = {
        group_ids: normalizedGroupIds,
        active_group_id: baseGroupId,
        group_query: "",
        values,
        error: "",
      };
    }

    function moderationDraftValuesForGroup(groupId) {
      const normalizedGroupId = Number(groupId || 0);
      const groupValues = normalizedGroupId ? { ...(state.cache.settings[normalizedGroupId] || {}) } : {};
      const entries = Object.values(state.cache.settingsSchema || {})
        .flat()
        .filter((entry) => (entry.category || "general") === "moderation");
      const values = {};
      for (const entry of entries) {
        values[entry.key] = groupValues[entry.key] ?? entry.default ?? (entry.type === "toggle" ? false : "");
      }
      return values;
    }

    function updateModerationSettingsDraftValue(key, value) {
      if (!state.ui.moderationSettingsDraft) return;
      const draft = state.ui.moderationSettingsDraft;
      draft.values = draft.values || {};
      draft.values[key] = value;
      draft.error = "";
      setSettingStatus(key, "dirty", 0, "moderation-settings-draft");
    }

    async function addModerationSettingsGroup(groupId) {
      const normalizedGroupId = Number(groupId || 0);
      if (!normalizedGroupId || !state.ui.moderationSettingsDraft) return;
      const draft = state.ui.moderationSettingsDraft;
      const current = new Set((draft.group_ids || []).map((value) => Number(value)).filter((value) => value > 0));
      if (current.has(normalizedGroupId)) return;
      await loadSettingsForGroup(normalizedGroupId);
      current.add(normalizedGroupId);
      draft.group_ids = Array.from(current);
      draft.active_group_id = normalizedGroupId;
      draft.values = moderationDraftValuesForGroup(normalizedGroupId);
      draft.group_query = "";
      draft.error = "";
    }

    function removeModerationSettingsGroup(groupId) {
      const normalizedGroupId = Number(groupId || 0);
      if (!normalizedGroupId || !state.ui.moderationSettingsDraft) return;
      const draft = state.ui.moderationSettingsDraft;
      draft.group_ids = (draft.group_ids || []).map((value) => Number(value)).filter((value) => value > 0 && value !== normalizedGroupId);
      if (Number(draft.active_group_id || 0) === normalizedGroupId) {
        const nextActiveGroupId = Number((draft.group_ids || [])[0] || 0);
        draft.active_group_id = nextActiveGroupId || null;
        draft.values = nextActiveGroupId ? moderationDraftValuesForGroup(nextActiveGroupId) : {};
      }
      draft.error = "";
    }

    async function selectModerationSettingsGroup(groupId) {
      const normalizedGroupId = Number(groupId || 0);
      if (!normalizedGroupId || !state.ui.moderationSettingsDraft) return;
      await loadSettingsForGroup(normalizedGroupId, true);
      const draft = state.ui.moderationSettingsDraft;
      draft.active_group_id = normalizedGroupId;
      draft.values = moderationDraftValuesForGroup(normalizedGroupId);
      draft.error = "";
    }

    async function saveModerationSettingsDraft() {
      const draft = state.ui.moderationSettingsDraft;
      if (!draft) return;
      const activeGroupId = Number(draft.active_group_id || 0);
      if (!activeGroupId) {
        draft.error = "Select a group.";
        renderModerationSettingsModal();
        return;
      }
      const payload = { ...(draft.values || {}) };
      const keys = Object.keys(payload);
      if (!keys.length) {
        closeModal();
        state.ui.moderationSettingsDraft = null;
        return;
      }
      draft.error = "";
      renderModerationSettingsModal();
      try {
        await apiRequest(`/webapp/groups/${activeGroupId}/settings`, {
          method: "PATCH",
          body: JSON.stringify({ settings: payload }),
        });
        state.cache.settings[activeGroupId] = {
          ...(state.cache.settings[activeGroupId] || {}),
          ...payload,
        };
        for (const key of keys) {
          setSettingStatus(key, "saved", 1500, "moderation-settings-draft");
        }
        state.ui.moderationSettingsDraft = null;
        closeModal();
        renderContent();
        pushToast("Moderation settings saved.", "success");
      } catch (error) {
        draft.error = error instanceof Error ? error.message : "Failed to save moderation settings.";
        for (const key of keys) {
          setSettingStatus(key, "error", 2500, "moderation-settings-draft");
        }
        renderModerationSettingsModal();
      }
    }

    function scheduleSettingSave(key, value, options = {}) {
      const groupId = Number(options.groupId || state.activeGroupId || 0);
      const scope = String(options.statusScope || "");
      const timerKey = settingStatusKey(key, `${groupId}:${scope}`);
      setSettingStatus(key, "dirty", 0, scope);
      if (settingTimers.has(timerKey)) {
        clearTimeout(settingTimers.get(timerKey));
      }
      settingTimers.set(timerKey, window.setTimeout(async () => {
        try {
          await apiRequest(`/webapp/groups/${groupId}/settings`, {
            method: "PATCH",
            body: JSON.stringify({ settings: { [key]: value } }),
          });
          state.cache.settings[groupId] = state.cache.settings[groupId] || {};
          state.cache.settings[groupId][key] = value;
          setSettingStatus(key, "saved", 2000, scope);
        } catch (_error) {
          setSettingStatus(key, "error", 3000, scope);
        }
      }, 600));
    }

                          : "",
                      ])}
                    </td>
                  </tr>
                `).join("") || `<tr><td colspan="7">${emptyState(t("bulkAddMemberJobsEmpty"))}</td></tr>`}
              </tbody>
            </table>
          </div>
          ${paginationControls({ ...rowsPage, renderTarget: "drawer" })}
        `,
      });
    }

    async function showAgentGroups(agentId, useCache = false) {

      const searchValue = String(state.ui.agentGroupsSearch[agentId] || "").trim().toLowerCase();

          group.title,
          group.managed_title,
          group.tg_group_id,
          group.id,

      });
      const groupsPage = paginateItems(`drawer-agent-groups-${agentId}`, filteredGroups, 10);
      state.ui.drawerContext = {
        scope: `drawer-agent-groups-${agentId}`,
        rerender: () => showAgentGroups(agentId, true),

      openDrawer({
        title: `Agent ${agentId} Groups`,
        subtitle: "Live groups fetched from the selected agent account",
        body: `
          <div class="stack">

            </div>
            <div class="table-wrap row-actions-safe">
              <table>
                <thead><tr><th>Group</th><th>Telegram ID</th><th>Managed Group</th><th>Members</th><th class="row-actions-cell">${escapeHtml(t("actions"))}</th></tr></thead>
                <tbody>
                  ${groupsPage.items.map((group) => `

                      <td class="mono">${escapeHtml(String(group.tg_group_id || ""))}</td>
                      <td>${escapeHtml(group.managed_title || (group.id ? `#${group.id}` : "Not managed"))}</td>
                      <td>${escapeHtml(String(group.member_count || 0))}</td>
                      <td class="row-actions-cell">

                      </td>

              </table>

          ${paginationControls({ ...groupsPage, renderTarget: "drawer" })}

    async function showAgentGroupMembers(agentId, tgGroupId, groupTitle = "", useCache = false) {
      const normalizedAgentId = Number(agentId || 0);
      const normalizedGroupId = Number(tgGroupId || 0);
      if (!normalizedAgentId || !normalizedGroupId) return;
      openDrawer({
        title: groupTitle ? `${groupTitle} Members` : `Group ${normalizedGroupId} Members`,
        subtitle: "Persisted members discovered from messages and refreshed from the selected agent account",
        body: agentGroupMembersDrawerBody({ stateName: "loading" }),
      });

      try {
        const cacheKey = `drawer:${normalizedAgentId}:${normalizedGroupId}`;
        let members = useCache && state.cache.liveMemberSearch[cacheKey]
          ? state.cache.liveMemberSearch[cacheKey]
          : null;
        if (!members) {
          const scrapedGroups = await apiRequest(`/webapp/scraper/groups?tg_group_id=${encodeURIComponent(String(normalizedGroupId))}`);
          const latestScrapedGroup = Array.isArray(scrapedGroups) ? scrapedGroups[0] : null;
          if (latestScrapedGroup && latestScrapedGroup.id) {
            const scrapedPayload = await apiRequest(
              `/webapp/scraper/groups/${latestScrapedGroup.id}/members?page=1&page_size=1000`
            );
            members = (scrapedPayload.members || []).map((member) => ({
              user_id: member.tg_user_id,
              username: member.username,
              full_name: member.full_name || [member.first_name, member.last_name].filter(Boolean).join(" ").trim() || null,
              role: member.role || "member",
              created_at: member.joined_date || member.scraped_at || null,
            }));
          }
        }
        if (!members) {
          const relatedGroups = state.cache.agentGroups[normalizedAgentId] || [];
          const managedGroup = relatedGroups.find((group) => Number(group.tg_group_id || 0) === normalizedGroupId);
          if (managedGroup && managedGroup.id) {
            const storedParams = new URLSearchParams();
            storedParams.set("limit", "200");
            members = await apiRequest(`/webapp/groups/${managedGroup.id}/stored-members?${storedParams.toString()}`);
          }
        }
        if (!members) {
          const params = new URLSearchParams();
          params.set("tg_group_id", String(normalizedGroupId));
          params.set("limit", "50");
          members = await apiRequest(`/webapp/agents/${normalizedAgentId}/member-search?${params.toString()}`);
        }
        state.cache.liveMemberSearch[cacheKey] = members;
        mergeLiveMembers(normalizedGroupId, members);
        const searchValue = String(state.ui.agentGroupMembersSearch[cacheKey] || "").trim().toLowerCase();
        const filteredMembers = members.filter((member) => {
          if (!searchValue) return true;
          return [
            member.user_id,
            member.username,
            member.full_name,
            member.first_name,
            member.role,
          ].some((value) => String(value || "").toLowerCase().includes(searchValue));
        });
        const membersPage = paginateItems(`drawer-agent-members-${normalizedAgentId}-${normalizedGroupId}`, filteredMembers, 10);
        state.ui.drawerContext = {
          scope: `drawer-agent-members-${normalizedAgentId}-${normalizedGroupId}`,
          rerender: () => showAgentGroupMembers(normalizedAgentId, normalizedGroupId, groupTitle, true),
        };
        openDrawer({
          title: groupTitle ? `${groupTitle} Members` : `Group ${normalizedGroupId} Members`,
          subtitle: "Persisted members discovered from messages and refreshed from the selected agent account",
          body: `${agentGroupMembersDrawerBody({ members: membersPage.items, stateName: filteredMembers.length ? "ready" : "empty", searchValue: String(state.ui.agentGroupMembersSearch[cacheKey] || "") })}${paginationControls({ ...membersPage, renderTarget: "drawer" })}`,
        });
      } catch (_error) {
        openDrawer({
          title: groupTitle ? `${groupTitle} Members` : `Group ${normalizedGroupId} Members`,
          subtitle: "Persisted members discovered from messages and refreshed from the selected agent account",
          body: agentGroupMembersDrawerBody({ stateName: "error" }),
        });
      }
    }

    document.addEventListener("click", async (event) => {
      const target = event.target.closest("[data-action],[data-route]");
      const rowActionsRoot = event.target.closest("[data-row-actions]");
      const clickInsideDrawer = Boolean(event.target.closest(".drawer"));
      if (!rowActionsRoot && state.ui.rowActionsOpenKey) {
        state.ui.rowActionsOpenKey = "";
        if (clickInsideDrawer && state.ui.drawerContext && typeof state.ui.drawerContext.rerender === "function") {
          await state.ui.drawerContext.rerender();
        } else {
          renderContent();
        }
        if (!target) return;
      }
      if (!target) return;

      if (target.dataset.route) {
        const route = target.dataset.route;
        if (route === "#/owner" && !state.isOwner) return;
        setRoute(route);
        await ensureRouteData();
        renderSidebar();
        renderTopbar();
        renderContent();
        return;
      }

      const action = target.dataset.action;
      if (action === "toggle-group-popover") {
        if (document.querySelector(".modal.active")) {
          return;
        }
        state.ui.groupPopoverOpen = !state.ui.groupPopoverOpen;
        renderGroupPopover();
      } else if (action === "toggle-row-actions") {
        const key = String(target.dataset.rowActionsKey || "");
        if (!key) return;
        state.ui.rowActionsOpenKey = state.ui.rowActionsOpenKey === key ? "" : key;
        if (clickInsideDrawer && state.ui.drawerContext && typeof state.ui.drawerContext.rerender === "function") {
          await state.ui.drawerContext.rerender();
        } else {
          renderContent();
        }
      } else if (action === "select-group") {
        const groupId = Number(target.dataset.groupId);
        persistActiveGroup(groupId);
        state.ui.scraperDraft = {
          ...(state.ui.scraperDraft || {}),
          tg_group_id: String((state.groups.find((group) => Number(group.id) === groupId) || {}).tg_group_id || ""),
          agent_id: "",
        };
        state.ui.bulkMessageDraft.source_group_id = String(groupId);
        state.ui.bulkMessageDraft.source_managed_group_id = String(groupId);
        state.ui.bulkMessageDraft.selected_user_ids = [];
        state.ui.bulkMessageDraft.user_query = "";
        state.ui.bulkMessageDraft.error = "";
        state.ui.bulkMessageDraft.loading = false;
        state.ui.bulkAddMembersDraft.source_group_id = "";
        state.ui.bulkAddMembersDraft.target_group_id = "";
        state.ui.bulkAddMembersDraft.selected_user_ids = [];
        state.ui.bulkAddMembersDraft.user_query = "";
        state.ui.bulkAddMembersDraft.error = "";
        state.ui.bulkAddMembersDraft.loading = false;
        await ensureRouteData();
        renderSidebar();
      } else if (action === "refresh-scraper") {
        const draft = syncScraperDraftFromInputs();
        const targetTgGroupId = Number(draft.tg_group_id || 0);
        const agentId = Number(draft.agent_id || 0);
        state.ui.scraperListFilters.agent_id = String(agentId || "");
        if (targetTgGroupId) {
          state.cache.scraper[targetTgGroupId] = null;
          delete state.cache.scraperMembers[targetTgGroupId];
          delete state.cache.scraperMessages[targetTgGroupId];
        }
        try {
          await loadAgents(state.activeGroupId, true);
          if (agentId) {
            await loadAgentGroups(agentId, true);
          }
          await loadScraper(true);
          await loadScraperList(true);
          renderContent();
          pushToast(t("scraperRefreshed"), "success");
        } catch (error) {
          renderContent();
          pushToast(error instanceof Error ? error.message : t("scraperQueueFailed"), "danger");
        }
      } else if (action === "run-scrape-job") {
        const draft = syncScraperDraftFromInputs();
        const executorType = String(draft.executor_type || "agent");
        const agentId = Number(draft.agent_id || 0);
        const tgGroupId = Number(draft.tg_group_id || 0);
        if (executorType === "bot") {
          pushToast(t("scraperBotUnsupported"), "warning");
          return;
        }
        if (!agentId) {
          pushToast(t("scraperAgentRequired"), "warning");
          return;
        }
        if (!tgGroupId) {
          pushToast(t("scraperQueueFailed"), "warning");
          return;
        }
        const jobType = String(target.dataset.jobType || "");
        const payload = {
          agent_id: agentId,
          tg_group_id: tgGroupId,
          member_limit: Math.max(1, Number(draft.member_limit || 100)),
          message_limit: Math.max(1, Number(draft.message_limit || 50)),
          scrape_members: true,
          scrape_messages: true,
        };
        const pathByJobType = {
          "group-info": "/webapp/scraper/scrape/group-info",
          members: "/webapp/scraper/scrape/members",
          messages: "/webapp/scraper/scrape/messages",
          "full-group": "/webapp/scraper/scrape/full-group",
        };
        const path = pathByJobType[jobType];
        if (!path) {
          pushToast(t("scraperQueueFailed"), "warning");
          return;
        }
        try {
          await apiRequest(path, {
            method: "POST",
            body: JSON.stringify(
              jobType === "group-info"
                ? { agent_id: payload.agent_id, tg_group_id: payload.tg_group_id }
                : jobType === "members"
                  ? { agent_id: payload.agent_id, tg_group_id: payload.tg_group_id, member_limit: payload.member_limit }
                  : jobType === "messages"
                    ? { agent_id: payload.agent_id, tg_group_id: payload.tg_group_id, message_limit: payload.message_limit }
                    : payload
            ),
          });
          state.ui.scraperListFilters.agent_id = String(agentId || "");
          state.cache.scraper[tgGroupId] = null;
          await loadScraper(true);
          await loadScraperList(true);
          renderContent();
          pushToast(t("scraperQueued"), "success");
        } catch (error) {
          pushToast(error instanceof Error ? error.message : t("scraperQueueFailed"), "danger");
        }
      } else if (action === "select-settings-category") {
        state.ui.settingsCategory = target.dataset.category;
        if (state.ui.settingsCategory === "join_request") {
          await Promise.all([loadJoinRequestSettings(state.activeGroupId), loadJoinRequests(state.activeGroupId)]);
        }
        renderContent();
      } else if (action === "select-moderation-tab") {
        state.ui.moderationTab = target.dataset.tab;
        renderContent();
      } else if (action === "select-owner-tab") {
        state.ui.ownerTab = target.dataset.tab;
        renderContent();
      } else if (action === "paginate-prev" || action === "paginate-next" || action === "paginate-page") {
        const key = String(target.dataset.paginationKey || "");
        if (!key) return;
        if (action === "paginate-page") {
          state.ui.pagination[key] = Math.max(0, Number(target.dataset.paginationPage || 0));
        } else {
          const delta = action === "paginate-prev" ? -1 : 1;
          state.ui.pagination[key] = Math.max(0, Number(state.ui.pagination[key] || 0) + delta);
        }
        if (target.dataset.paginationRender === "drawer" && state.ui.drawerContext && typeof state.ui.drawerContext.rerender === "function") {
          await state.ui.drawerContext.rerender();
          return;
        }
        renderContent();
      } else if (action === "open-warning-modal") {
        await warningModal("warn");
      } else if (action === "open-moderation-activity-modal") {
        const cacheKey = String(target.dataset.activityCacheKey || moderationActivityCacheKey());
        const activityId = Number(target.dataset.activityId || 0);
        const item = (state.cache.moderationActivity[cacheKey] || []).find((entry) => Number(entry.id) === activityId);
        if (!item) return;
        renderModerationActivityModal(item);
      } else if (action === "open-moderation-settings") {
        const groupId = Number(state.activeGroupId || state.groups[0]?.id || 0);
        if (!groupId) return;
        await initializeModerationSettingsDraft([groupId]);
        renderModerationSettingsModal();
      } else if (action === "open-action-modal") {
        await warningModal(target.dataset.moderationAction);
      } else if (action === "set-language") {
        const languageCode = target.dataset.language;
        if (!state.user || !languageCode || state.user.language_code === languageCode) {
          return;
        }
        await apiRequest("/webapp/auth/language", {
          method: "PATCH",
          body: JSON.stringify({ language_code: languageCode }),
        });
        state.user.language_code = languageCode;
        applyLanguageDirection();
        renderSidebar();
        renderTopbar();
        renderContent();
        renderBottomNav();
        renderGroupPopover();
        renderModal();
        renderDrawer();
        renderToasts();
        pushToast(`Language set to ${languageCode.toUpperCase()}.`, "success");
      } else if (action === "quick-action-group-select") {
        if (state.ui.quickActionDraft) {
          state.ui.quickActionDraft.group_id = Number(target.value || 0);
          state.ui.quickActionDraft.selected_user_id = "";
          state.ui.quickActionDraft.query = "";
          state.ui.quickActionDraft.results = [];
          await refreshQuickActionLookup(true);
        }
      } else if (action === "close-modal") {
        closeModal();
      } else if (action === "close-moderation-settings") {
        state.ui.moderationSettingsDraft = null;
        closeModal();
      } else if (action === "save-moderation-settings") {
        await saveModerationSettingsDraft();
      } else if (action === "close-drawer") {
        closeDrawer();
      } else if (action === "open-bot-install-drawer") {
        state.ui.botInstallResult = null;
        await loadBotInstallGroups(true);
        openDrawer({
          title: t("botInstallTitle"),
          subtitle: t("botInstallHint"),
          body: botInstallDrawerBody(),
        });
      } else if (action === "open-bot-install-link") {
        const url = String(target.dataset.url || "");
        if (tg && typeof tg.openTelegramLink === "function") {
          tg.openTelegramLink(url);
        } else if (url) {
          window.open(url, "_blank", "noopener,noreferrer");
        }
      } else if (action === "bot-install-select-all") {
        const checkboxes = Array.from(document.querySelectorAll('#bot-install-form input[name="tg_group_id"]'));
        checkboxes.forEach((checkbox) => {
          checkbox.checked = true;
        });
      } else if (action === "bot-install-clear") {
        const checkboxes = Array.from(document.querySelectorAll('#bot-install-form input[name="tg_group_id"]'));
        checkboxes.forEach((checkbox) => {
          checkbox.checked = false;
        });
      } else if (action === "toggle-setting") {
        const key = target.dataset.settingKey;
        const settingMode = String(target.dataset.settingMode || "live");
        const groupId = Number(target.dataset.settingGroupId || state.activeGroupId || 0);
        const statusScope = String(target.dataset.settingStatusScope || "");
        if (settingMode === "draft") {
          const current = state.ui.moderationSettingsDraft && state.ui.moderationSettingsDraft.values
            ? state.ui.moderationSettingsDraft.values[key]
            : false;
          updateModerationSettingsDraftValue(key, !Boolean(current));
          renderModerationSettingsModal();
          return;
        }
        state.cache.settings[groupId] = state.cache.settings[groupId] || {};
        const nextValue = !(state.cache.settings[groupId][key] ?? false);
        state.cache.settings[groupId][key] = nextValue;
        scheduleSettingSave(key, nextValue, { groupId, statusScope });
      } else if (action === "toggle-access-gate") {
        const tgId = Number(target.dataset.tgGroupId);
        const current = new Set(state.cache.accessGate[state.activeGroupId].required_group_tg_ids || []);
        if (current.has(tgId)) current.delete(tgId);
        else current.add(tgId);
        await saveAccessGate(Array.from(current));
      } else if (action === "add-access-gate") {
        const select = document.getElementById("access-gate-candidate");
        const tgId = Number(select && select.value ? select.value : 0);
        if (!tgId) return;
        const current = new Set(state.cache.accessGate[state.activeGroupId].required_group_tg_ids || []);
        current.add(tgId);
        await saveAccessGate(Array.from(current));
      } else if (action === "remove-access-gate") {
        const tgId = Number(target.dataset.tgGroupId || 0);
        const nextIds = (state.cache.accessGate[state.activeGroupId].required_group_tg_ids || [])
          .filter((value) => Number(value) !== tgId);
        await saveAccessGate(nextIds);
        if (state.cache.joinRequestSettings[state.activeGroupId]) {
          state.cache.joinRequestSettings[state.activeGroupId].required_group_tg_ids = nextIds;
        }
      } else if (action === "toggle-join-request-verification") {
        const current = Boolean((state.cache.joinRequestSettings[state.activeGroupId] || {}).enabled);
        await saveJoinRequestSettings(!current);
        renderContent();
      } else if (action === "refresh-join-requests") {
        await Promise.all([loadJoinRequestSettings(state.activeGroupId, true), loadJoinRequests(state.activeGroupId, true)]);
        renderContent();
        pushToast(t("joinRequestRefreshSaved"), "success");
      } else if (action === "join-request-action") {
        const approvalId = Number(target.dataset.approvalId || 0);
        const decision = String(target.dataset.joinRequestAction || "");
        if (!approvalId || !["approve", "decline"].includes(decision)) return;
        try {
          await apiRequest(`/webapp/join-requests/${approvalId}/action`, {
            method: "POST",
            body: JSON.stringify({ action: decision }),
          });
          await loadJoinRequests(state.activeGroupId, true);
          renderContent();
          pushToast(t(decision === "approve" ? "joinRequestApproveSaved" : "joinRequestDeclineSaved"), "success");
        } catch (_error) {
          pushToast(t("joinRequestActionFailed"), "danger");
        }
      } else if (action === "remove-warning") {
        await apiRequest(`/webapp/groups/${state.activeGroupId}/moderation/warnings/${target.dataset.userId}`, { method: "DELETE" });
        await loadWarnings(true);
        await loadLogs(true);
        await loadModerationActivity(true);
        renderSidebar();
        renderContent();
        pushToast("Warning removed.", "success");
      } else if (action === "create-task") {
        state.ui.automationSelection = null;
        state.ui.automationBindingGroupId = state.activeGroupId;
        state.ui.automationDraft = buildAutomationTaskDraft({
          task_key: (state.cache.taskCatalog && state.cache.taskCatalog[0] && state.cache.taskCatalog[0].key) || "",
          group_id: state.activeGroupId,
        });
        state.ui.automationEditorOpen = true;
        renderAutomationTaskModal();

        state.ui.bulkMessageOpen = true;

          state.ui.bulkMessageDraft.loading = true;

            await loadAgentGroups(agentId, true);

              state.ui.bulkMessageDraft.source_managed_group_id = selectedBulkMessageManagedGroupId();

            if (Number(state.ui.bulkMessageDraft.source_managed_group_id || 0)) {
              await searchBulkMembers(true);
            }
            state.ui.bulkMessageDraft.error = "";
          } catch (error) {
            state.ui.bulkMessageDraft.error = error.message || t("linkedAgentRequired");
          } finally {
            state.ui.bulkMessageDraft.loading = false;
          }
        }
        renderBulkMessageModal();

        state.ui.bulkAddMembersOpen = true;
        const agentId = Number(state.ui.bulkAddMembersDraft.agent_id || 0);
        if (agentId) {
          state.ui.bulkAddMembersDraft.loading = true;
          renderBulkAddMembersModal();
          try {
            await loadAgentGroups(agentId, true);
            if (Number(state.ui.bulkAddMembersDraft.source_group_id || 0)) {
              await searchMembersToAdd(true);
            }
            state.ui.bulkAddMembersDraft.error = "";
          } catch (error) {
            state.ui.bulkAddMembersDraft.error = error.message || t("linkedAgentRequired");
          } finally {
            state.ui.bulkAddMembersDraft.loading = false;
          }

        renderBulkAddMembersModal();

        state.ui.bulkAddMembersOpen = false;
        closeModal();

        const tasks = state.cache.tasks[state.activeGroupId] || [];
        const selectedTask = tasks.find((item) => item.assignment_id === target.dataset.assignmentId) || null;
        const agentId = Number(selectedTask && selectedTask.agent_id ? selectedTask.agent_id : 0);
        if (agentId) {
          const relatedGroups = await loadAgentGroups(agentId, true);
          for (const group of relatedGroups) {
            if (!group.id && group.tg_group_id) {
              const resolvedId = await resolveAgentTaskGroup(group.tg_group_id, group.title);
              if (resolvedId) {
                group.id = resolvedId;
              }
            }
          }
          state.cache.agentGroups[agentId] = relatedGroups;
        }
        state.ui.automationSelection = target.dataset.assignmentId;
        state.ui.automationBindingGroupId = state.activeGroupId;
        state.ui.automationDraft = null;
        state.ui.automationEditorOpen = true;
        renderAutomationTaskModal();
      } else if (action === "close-task-editor") {
        state.ui.automationSelection = null;
        state.ui.automationBindingGroupId = null;
        state.ui.automationDraft = null;
        state.ui.automationEditorOpen = false;
        closeModal();

        groupIds.splice(index, 1);

        const titles = draft.group_titles || [];

        titles.splice(index, 1);
        draft.group_ids = groupIds;

        if (Number(draft.group_id) === groupId) {
          draft.group_id = groupIds[0] || "";

          draft.group_tg_id = draft.group_tg_ids[0];

    document.addEventListener("click", (event) => {
      const toggle = event.target.closest("[data-searchable-select-toggle]");
      if (!toggle) return;
      const root = toggle.closest("[data-searchable-select]");
      if (!(root instanceof HTMLElement)) return;
      const panel = searchableSelectPanel(root);
      if (!panel) return;
      const isHidden = panel.classList.contains("hidden");
      closeAllSearchableSelects(root);
      if (isHidden) {
        openSearchableSelect(root);
        const input = root.querySelector("[data-searchable-select-input]");
        if (input instanceof HTMLInputElement) {
          input.value = "";
          filterSearchableSelect(root, "");
          input.focus();
        }
      } else {
        closeSearchableSelect(root);
      }
    });

    document.addEventListener("mousedown", (event) => {
      const option = event.target.closest("[data-searchable-select-option]");
      if (option) {
        const root = option.closest("[data-searchable-select]");
        if (!(root instanceof HTMLElement)) return;
        const nativeSelect = root.querySelector(".searchable-select-native");
        if (!(nativeSelect instanceof HTMLSelectElement)) return;
        event.preventDefault();
        nativeSelect.value = String(option.dataset.value || "");
        syncSearchableSelect(root);
        nativeSelect.dispatchEvent(new Event("change", { bubbles: true }));
        nativeSelect.dispatchEvent(new Event("input", { bubbles: true }));
        closeSearchableSelect(root);
        return;
      }

      document.querySelectorAll("[data-searchable-select]").forEach((root) => {
        if (!(root instanceof HTMLElement) || root.dataset.inline === "true") return;
        if (!root.contains(event.target)) {
          closeSearchableSelect(root);
        }
      });
    });

    document.addEventListener("focusin", (event) => {
      const target = event.target;
      if (target instanceof HTMLInputElement && target.hasAttribute("data-searchable-select-input")) {
        const root = target.closest("[data-searchable-select]");
        if (!(root instanceof HTMLElement)) return;
        closeAllSearchableSelects(root);
        openSearchableSelect(root);
        filterSearchableSelect(root, target.value);
        return;
      }

      document.querySelectorAll("[data-searchable-select]").forEach((root) => {
        if (!(root instanceof HTMLElement) || root.dataset.inline === "true") return;
        if (!root.contains(target)) {
          closeSearchableSelect(root);
        }
      });
    });

    document.addEventListener("keydown", (event) => {
      const target = event.target;
      if (!(target instanceof HTMLInputElement) || !target.hasAttribute("data-searchable-select-input")) return;
      if (event.key !== "Escape") return;
      const root = target.closest("[data-searchable-select]");
      if (!(root instanceof HTMLElement)) return;
      event.preventDefault();
      closeSearchableSelect(root);
    });

        state.cache.settings[groupId][key] = value;
        scheduleSettingSave(key, value, { groupId, statusScope });
        if (type === "range") {

        if (taskKey === "notify_destination") {
          if (!String(config.destination || "").trim()) {
            pushToast("Select a destination group or enter a chat ID.", "warning");
            return;
          }
          if (String(config.delivery_mode || "") === "approval_request" && !String(config.suggested_reply_template || "").trim()) {
            pushToast("Suggested reply template is required for approval request tasks.", "warning");
            return;
          }
          if (String(config.delivery_mode || "") !== "approval_request" && !String(config.message_template || "").trim()) {
            pushToast("Message template is required for notify destination tasks.", "warning");
            return;
          }
        } else if (taskKey === "reply_message") {
          if (!String(config.message_template || "").trim()) {
            pushToast("Message template is required for reply tasks.", "warning");
            return;
          }
          if (String(config.reply_markup_type || "none") === "inline_buttons") {
            if (executorType !== "bot") {
              pushToast("Inline buttons are only available for bot replies.", "warning");
              return;
            }
            if (!Array.isArray(config.inline_buttons) || !config.inline_buttons.length) {
              pushToast("Add at least one inline button.", "warning");
              return;
            }
            const hasInvalidButton = config.inline_buttons.some((button) => !String(button.text || "").trim() || !String(button.url || "").trim());
            if (hasInvalidButton) {
              pushToast("Each inline button needs text and a URL.", "warning");
              return;
            }
          }
        }
        if (!targetGroupId && targetGroupTgId) {
          targetGroupId = targetGroupTgId;
        }
        if (!targetGroupId) {
          pushToast("Select a group to bind this task.", "warning");
          return;
        }
        const payloadGroupIds = String(fd.get("group_ids") || "")
          .split(",")
          .map((value) => Number(value.trim()))
          .filter(Boolean);
        if (!payloadGroupIds.length && targetGroupId) {
          payloadGroupIds.push(targetGroupId);
        }
        const payloadGroupTgIds = String(fd.get("group_tg_ids") || "")
          .split(",")
          .map((value) => Number(value.trim()))
          .filter(Boolean);
        if (!payloadGroupTgIds.length && targetGroupTgId) {
          payloadGroupTgIds.push(targetGroupTgId);
        }
        const payloadGroupTitles = String(fd.get("group_titles") || "")
          .split(",")
          .map((value) => String(value || "").trim())
          .filter(Boolean);
        if (!payloadGroupTitles.length && targetGroupTitle) {
          payloadGroupTitles.push(targetGroupTitle);
        }
        const payload = {
          assignment_id: assignmentId || null,
          task_key: taskKey,
          executor_type: executorType,
          enabled: String(fd.get("enabled") || "true") === "true",
          conditions,
          config,
          agent_id: executorType === "agent" ? agentId : null,
          group_ids: payloadGroupIds,
          group_tg_ids: payloadGroupTgIds,
          group_titles: payloadGroupTitles,
          group_id: targetGroupId,
          ...(targetGroupTgId ? { group_tg_id: targetGroupTgId } : {}),
          ...(targetGroupTitle ? { group_title: targetGroupTitle } : {}),
        };
        const requestGroupId = targetGroupId;
        const isSameAssignmentGroup = assignmentId && requestGroupId === originalGroupId;
        const url = isSameAssignmentGroup
          ? `/webapp/groups/${requestGroupId}/tasks/${assignmentId}`
          : `/webapp/groups/${requestGroupId}/tasks`;
        const response = await apiRequest(url, {
          method: isSameAssignmentGroup ? "PATCH" : "POST",
          body: JSON.stringify(payload),
        });
        if (assignmentId && requestGroupId !== originalGroupId) {
          await apiRequest(`/webapp/groups/${originalGroupId}/tasks/${assignmentId}`, { method: "DELETE" });
        }
        const savedGroupId = Number(response?.assignment?.group_id || 0) || requestGroupId;
        const savedSourceGroupTitle = String(
          (response?.assignment?.group_titles || [])[0]
          || response?.assignment?.group_title
          || targetGroupTitle
          || ""
        ).trim();
        if (savedGroupId !== state.activeGroupId) {
          state.activeGroupId = savedGroupId;
        }
        const savedGroupTitle = String(response?.assignment?.group_title || "").trim();
        const savedGroupTgId = Number(response?.assignment?.group_tg_id || 0);
        if (savedGroupId && !state.groups.some((group) => Number(group.id) === savedGroupId)) {
          state.groups.push({
            id: savedGroupId,
            title: savedGroupTitle || `Group ${savedGroupId}`,
            tg_group_id: savedGroupTgId || null,
            role: "owner",
          });
          state.groups.sort((left, right) => String(left.title || "").localeCompare(String(right.title || "")));
        }
        await Promise.all([
          loadAutomation(true),
          loadAgents(state.activeGroupId, true),
        ]);
        state.ui.automationSelection = null;
        state.ui.automationBindingGroupId = null;
        state.ui.automationDraft = null;
        state.ui.automationEditorOpen = false;
        closeModal();
        renderSidebar();
        renderTopbar();
        renderContent();
        const targetGroup = state.groups.find((group) => Number(group.id) === savedGroupId);
        const savedLabel = executorType === "agent"
          ? (savedSourceGroupTitle || "selected source group")
          : ((targetGroup && targetGroup.title) || savedSourceGroupTitle || "selected group");
        pushToast(`Task saved for ${savedLabel}.`, "success");
      } else if (form.id === "scheduled-form") {
        const fd = new FormData(form);
        const entryId = String(fd.get("entry_id") || "");
        const targetType = String(fd.get("target_type") || "group");
        const targetGroupId = Number(fd.get("group_id") || state.activeGroupId);
        const targetUserId = Number(fd.get("user_id") || 0);
        if (targetType === "user") {
          pushToast("User scheduled messages need backend support before they can be sent.", "warning");
          return;
        }
        if (!targetGroupId) {
          pushToast("Select a target group first.", "warning");
          return;
        }
        const payload = {
          text: String(fd.get("text") || ""),
          schedule: String(fd.get("schedule") || ""),
          delete_after_seconds: fd.get("delete_after_seconds") ? Number(fd.get("delete_after_seconds")) : null,
        };
        await apiRequest(
          entryId
            ? `/webapp/groups/${targetGroupId}/scheduled-messages/${entryId}`
            : `/webapp/groups/${targetGroupId}/scheduled-messages`,
          {
            method: entryId ? "PATCH" : "POST",
            body: JSON.stringify(payload),
          }
        );
        closeModal();
        if (targetGroupId === state.activeGroupId) {
          await loadAutomation(true);
          renderContent();
        } else {
          await apiRequest(`/webapp/groups/${targetGroupId}/scheduled-messages`);
        }
        pushToast(`Scheduled message saved for ${targetType === "group" ? "group" : "user"}${targetUserId ? " " + targetUserId : ""}.`, "success");
      } else if (form.id === "agent-start-form") {
        const fd = new FormData(form);
        const groupId = Number(state.activeGroupId || 0);
        const phoneNumber = String(fd.get("phone_number") || "").trim();
        if (!groupId) {
          pushToast("Choose a group before linking an agent.", "warning");
          return;
        }
        if (!phoneNumber) {
          pushToast("Enter the agent phone number.", "warning");
          return;
        }
        const result = await apiRequest("/webapp/agents/auth/start", {
          method: "POST",
          body: JSON.stringify({
            group_id: groupId,
            phone_number: phoneNumber,
          }),
        });
        agentLinkModal(2, result.agent);
      } else if (form.id === "agent-code-form") {
        const fd = new FormData(form);
        const agentId = Number(fd.get("agent_id"));
        const result = await apiRequest(`/webapp/agents/${agentId}/auth/code`, {
          method: "POST",
          body: JSON.stringify({ code: String(fd.get("code") || "") }),
        });
        if (result.agent && result.agent.auth_state === "pending_2fa") {
          agentLinkModal(3, result.agent);
        } else {
          closeModal();
          await loadAgents(state.activeGroupId, true);
          agentLinkModal(4, result.agent);
        }
      } else if (form.id === "agent-password-form") {
        const fd = new FormData(form);
        const agentId = Number(fd.get("agent_id"));
        const result = await apiRequest(`/webapp/agents/${agentId}/auth/password`, {
          method: "POST",
          body: JSON.stringify({ password: String(fd.get("password") || "") }),
        });
        await loadAgents(state.activeGroupId, true);
        agentLinkModal(4, result.agent);
      } else if (form.id === "unlink-agent-form") {
        const fd = new FormData(form);
        const agentId = Number(fd.get("agent_id") || 0);
        if (!agentId) {
          pushToast("Agent not found.", "warning");
          return;
        }
        await apiRequest(`/webapp/agents/${agentId}`, { method: "DELETE" });
        closeModal();
        await loadAgents(state.activeGroupId, true);
        renderContent();
        pushToast("Agent unlinked.", "success");
      } else if (form.id === "owner-subscription-form") {
        const fd = new FormData(form);
        await apiRequest(`/webapp/owner/subscriptions/${fd.get("request_id")}`, {
          method: "POST",
          body: JSON.stringify({
            status: String(fd.get("status")),
            response: String(fd.get("response") || ""),
          }),
        });
        closeModal();
        await loadOwner(true);
        renderContent();
        pushToast("Subscription updated.", "success");
      } else if (form.id === "subscription-request-form") {
        const fd = new FormData(form);
        const response = await apiRequest("/webapp/subscription-request", {
          method: "POST",
          body: JSON.stringify({
            message: String(fd.get("message") || ""),
          }),
        });
        state.subscriptionGate.request = response && response.request ? response.request : null;
        renderContent();
        pushToast(t("subscriptionGateSent"), "success");
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        if (state.overlays.modal) closeModal();
        if (state.overlays.drawer) closeDrawer();
        if (state.ui.groupPopoverOpen) {
          state.ui.groupPopoverOpen = false;
          renderGroupPopover();
        }
      }
    });

    window.addEventListener("hashchange", async () => {
      const nextRoute = location.hash || "#/home";
      if (nextRoute === "#/moderation") {
        location.hash = "#/home";
        return;
      }
      if (nextRoute === "#/overview") {
        location.hash = "#/home";
        return;
      }
      if (nextRoute === "#/agents") {
        location.hash = "#/accounts";
        return;
      }
      if (nextRoute === "#/owner" && !state.isOwner) {
        location.hash = "#/home";
        return;
      }
      state.route = nextRoute;
      await ensureRouteData();
      renderSidebar();
      renderTopbar();
      renderContent();
      renderBottomNav();
    });

    async function boot() {
      refreshTelegramInitData();
      await loadAuth();
      if (state.route === "#/moderation") {
        state.route = "#/home";
        location.hash = state.route;
      }
      if (state.route === "#/overview") {
        state.route = "#/home";
        location.hash = state.route;
      }
      if (state.route === "#/agents") {
        state.route = "#/accounts";
        location.hash = state.route;
      }
      if (state.route === "#/owner" && !state.isOwner) {
        state.route = "#/home";
        location.hash = state.route;
      }
      await ensureRouteData();
      renderSidebar();
      renderTopbar();
      renderContent();
      renderBottomNav();
      renderToasts();
    }


    // -- New loaders for Leads, Analytics, Subscription pages --

    async function loadAgentLeads(agentId, options) {
      options = options || {};
      var params = new URLSearchParams();
      if (options.status) params.set("status", options.status);
      if (options.lead_label) params.set("lead_label", options.lead_label);
      if (options.page) params.set("page", String(options.page));
      if (options.page_size) params.set("page_size", String(options.page_size));
      var qs = params.toString();
      return apiRequest("/webapp/agents/" + agentId + "/leads" + (qs ? "?" + qs : ""), { boundary: "agents" });
    }

    async function loadAgentLeadStats(agentId) {
      return apiRequest("/webapp/agents/" + agentId + "/leads/stats", { boundary: "agents" });
    }

    async function loadAgentAnalytics(agentId) {
      return apiRequest("/webapp/agents/" + agentId + "/analytics", { boundary: "agents" });
    }

    async function loadSubscriptionStatus() {
      return apiRequest("/webapp/agents/subscription/status");
    }

    async function createSubscriptionCheckout(plan, successUrl, cancelUrl) {
      return apiRequest("/webapp/agents/subscription/checkout/stripe", {
        method: "POST",
        boundary: "agents",
        body: JSON.stringify({ plan: plan, success_url: successUrl, cancel_url: cancelUrl }),
      });
    }

    async function redeemPromoCode(code) {
      return apiRequest("/webapp/agents/subscription/redeem", {
        method: "POST",
        boundary: "agents",
        body: JSON.stringify({ code: code }),
      });
    }

    async function cancelMySubscription() {
      return apiRequest("/webapp/agents/subscription/cancel", { method: "POST", boundary: "agents" });
    }

    async function loadMCPTokens() {
      return apiRequest("/api/mcp/tokens", { boundary: "agents" });
    }

    async function createMCPToken(name, expiresInDays) {
      return apiRequest("/api/mcp/tokens", {
        method: "POST",
        boundary: "agents",
        body: JSON.stringify({ name: name, expires_in_days: expiresInDays }),
      });
    }

    async function revokeMCPToken(tokenId) {
      return apiRequest("/api/mcp/tokens/" + tokenId, { method: "DELETE", boundary: "agents" });
    }

    async function updateAgentLead(agentId, leadId, payload) {
      return apiRequest("/webapp/agents/" + agentId + "/leads/" + leadId, {
        method: "PATCH",
        boundary: "agents",
        body: JSON.stringify(payload),
      });
    }

    async function updateAgentSafetyConfig(agentId, payload) {
      return apiRequest("/webapp/agents/" + agentId + "/safety", {
        method: "PATCH",
        boundary: "agents",
        body: JSON.stringify(payload),
      });
    }

    async function loadAgentNotifications(agentId, limit) {
      var params = limit ? "?limit=" + limit : "";
      return apiRequest("/webapp/agents/" + agentId + "/notifications" + params, { boundary: "agents" });
    }

    boot().catch((error) => {
      console.error(error);
      state.sessionExpired = error.message === "Session expired";
      renderSidebar();
      renderTopbar();
      renderContent();
      renderBottomNav();
      if (!state.sessionExpired) {
        pushToast("Failed to load dashboard.", "danger");
      }
    });

  </script>
</body>
</html>
