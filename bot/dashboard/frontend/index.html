<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  />
  <meta name="theme-color" content="#0a0a0a" />
  <title>MadarBot</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist-sans/style.css"
  />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist-mono/style.css"
  />
  <link rel="stylesheet" href="/dashboard/assets/css/dashboard.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/dashboard/assets/js/state.js"></script>
  <script src="/dashboard/assets/js/i18n.js"></script>
  <script src="/dashboard/assets/js/mock.js"></script>
</head>
<body>
<div class="app">
  <nav id="sidebar" class="sidebar"></nav>
  <div class="main">
    <header id="topbar"></header>
    <div id="content"></div>
    <div id="bottom-nav" class="bottom-nav"></div>
  </div>
</div>
<div id="group-popover-root"></div>
<div id="modal-root"></div>
<div id="drawer-root"></div>
<div id="toast-root"></div>
<script>


    const roots = {
      sidebar: document.getElementById("sidebar"),
      topbar: document.getElementById("topbar"),
      content: document.getElementById("content"),
      bottomNav: document.getElementById("bottom-nav"),
      groupPopover: document.getElementById("group-popover-root"),
      modal: document.getElementById("modal-root"),
      drawer: document.getElementById("drawer-root"),
      toast: document.getElementById("toast-root"),
    };
    let bulkMemberSearchTimer = null;
    let bulkSearchSeq = 0;
    let bulkSearchController = null;

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function renderSearchableSelect({
      id = "",
      name = "",
      value = "",
      options = [],
      placeholder = "Select",
      searchPlaceholder = "Search",
      emptyLabel = "No matching results.",
      disabled = false,
      inline = false,
      selectAction = "",
      mode = "single",
      searchName = "",
      searchValue = "",
      searchAction = "",
      selectedItems = [],
      emptySelectedLabel = "No items selected.",
      hint = "",
    } = {}) {
      if (mode === "multi") {
        return `
          <div class="searchable-select searchable-select-multi" data-searchable-select="${escapeHtml(id || name || "multi")}">
            <div class="searchable-select-panel">
              <div class="searchable-select-search-wrap">
                <input
                  id="${escapeHtml(id)}"
                  class="searchable-select-search"
                  ${searchName ? `name="${escapeHtml(searchName)}"` : ""}
                  type="search"
                  value="${escapeHtml(searchValue)}"
                  placeholder="${escapeHtml(searchPlaceholder)}"
                  ${searchAction ? `data-action="${escapeHtml(searchAction)}"` : ""}
                />
              </div>
              <div class="multi-select-chips">
                ${selectedItems.length
                  ? selectedItems.map((item) => `
                    <span class="multi-select-chip">
                      <span>${escapeHtml(item.label)}</span>
                      <button class="chip-remove" type="button" data-action="remove-task-group" data-group-id="${item.groupId}" aria-label="${escapeHtml(t("close"))}">×</button>
                    </span>
                  `).join("")
                  : `<div class="multi-select-empty">${escapeHtml(emptySelectedLabel)}</div>`}
              </div>
              <div class="searchable-select-options">
                ${options.length
                  ? options.map((option) => `
                    <button
                      class="searchable-select-option"
                      type="button"
                      data-action="add-task-group"
                      ${option.groupId ? `data-group-id="${option.groupId}"` : ""}
                      data-group-tg-id="${option.groupTgId}"
                      data-group-title="${escapeHtml(option.groupTitle)}"
                    >
                      <span class="searchable-select-option-copy">
                        <span class="searchable-select-option-title">${escapeHtml(option.label)}</span>
                        ${option.meta ? `<span class="searchable-select-option-meta">${escapeHtml(option.meta)}</span>` : ""}
                      </span>
                      <span class="badge">${escapeHtml(option.actionLabel || "Add")}</span>
                    </button>
                  `).join("")
                  : `<div class="searchable-select-empty">${escapeHtml(emptyLabel)}</div>`}
              </div>
            </div>
            ${hint ? `<div class="field-hint">${escapeHtml(hint)}</div>` : ""}
          </div>
        `;
      }

      const normalizedValue = String(value ?? "");
      const selectedOption = options.find((option) => String(option.value) === normalizedValue) || null;
      const selectedLabel = selectedOption ? selectedOption.label : placeholder;

      return `
        <div class="searchable-select ${inline ? "searchable-select-inline" : ""}" data-searchable-select="${escapeHtml(id || name || "select")}" ${inline ? 'data-inline="true"' : ""}>
          <select
            class="searchable-select-native"
            ${id ? `id="${escapeHtml(id)}"` : ""}
            ${name ? `name="${escapeHtml(name)}"` : ""}
            ${selectAction ? `data-action="${escapeHtml(selectAction)}"` : ""}
            ${disabled ? "disabled" : ""}
          >
            ${options.map((option) => `
              <option value="${escapeHtml(option.value)}" ${String(option.value) === normalizedValue ? "selected" : ""}>
                ${escapeHtml(option.label)}
              </option>
            `).join("")}
          </select>
          ${inline ? "" : `
            <button class="searchable-select-trigger" type="button" data-searchable-select-toggle ${disabled ? "disabled" : ""}>
              <span class="searchable-select-trigger-text">${escapeHtml(selectedLabel)}</span>
              <span class="searchable-select-trigger-icon">▾</span>
            </button>
          `}
          <div class="searchable-select-panel ${inline ? "" : "hidden"}">
            <div class="searchable-select-search-wrap">
              <input class="searchable-select-search" type="search" placeholder="${escapeHtml(searchPlaceholder)}" data-searchable-select-input ${disabled ? "disabled" : ""} />
            </div>
            <div class="searchable-select-options">
              ${options.length
                ? options.map((option) => `
                  <button
                    class="searchable-select-option ${String(option.value) === normalizedValue ? "active" : ""}"
                    type="button"
                    data-searchable-select-option
                    data-value="${escapeHtml(option.value)}"
                    data-search-text="${escapeHtml(`${option.label} ${option.meta || ""}`.toLowerCase())}"
                  >
                    <span class="searchable-select-option-copy">
                      <span class="searchable-select-option-title">${escapeHtml(option.label)}</span>
                      ${option.meta ? `<span class="searchable-select-option-meta">${escapeHtml(option.meta)}</span>` : ""}
                    </span>
                  </button>
                `).join("")
                : ""}
              <div class="searchable-select-empty ${options.length ? "hidden" : ""}">${escapeHtml(emptyLabel)}</div>
            </div>
          </div>
        </div>
      `;
    }

    function renderSearchableMultiPicker({
      id = "",
      searchPlaceholder = "Search",
      emptyLabel = "No matching results.",
      searchAction = "",
      searchValue = "",
      selectedItems = [],
      selectedAction = "",
      activeItemId = "",
      emptySelectedLabel = "No items selected.",
      options = [],
      addAction = "",
      removeAction = "",
      addLabel = "Add",
    } = {}) {
      return `
        <div class="searchable-select searchable-select-multi" data-searchable-select="${escapeHtml(id || "multi-picker")}">
          <div class="searchable-select-panel">
            <div class="searchable-select-search-wrap">
              <input
                id="${escapeHtml(id)}"
                class="searchable-select-search"
                type="search"
                value="${escapeHtml(searchValue)}"
                placeholder="${escapeHtml(searchPlaceholder)}"
                ${searchAction ? `data-action="${escapeHtml(searchAction)}"` : ""}
              />
            </div>
            <div class="multi-select-chips">
              ${selectedItems.length
                ? selectedItems.map((item) => `
                  <span class="multi-select-chip ${String(activeItemId) === String(item.id) ? "active" : ""}">
                    ${selectedAction
                      ? `<button class="multi-select-chip-label" type="button" data-action="${escapeHtml(selectedAction)}" data-item-id="${escapeHtml(String(item.id))}">${escapeHtml(item.label)}</button>`
                      : `<span>${escapeHtml(item.label)}</span>`}
                    <button class="chip-remove" type="button" data-action="${escapeHtml(removeAction)}" data-item-id="${escapeHtml(String(item.id))}" aria-label="${escapeHtml(t("close"))}">×</button>
                  </span>
                `).join("")
                : `<div class="multi-select-empty">${escapeHtml(emptySelectedLabel)}</div>`}
            </div>
            <div class="searchable-select-options">
              ${options.length
                ? options.map((option) => `
                  <button
                    class="searchable-select-option"
                    type="button"
                    data-action="${escapeHtml(addAction)}"
                    data-item-id="${escapeHtml(String(option.id))}"
                  >
                    <span class="searchable-select-option-copy">
                      <span class="searchable-select-option-title">${escapeHtml(option.label)}</span>
                      ${option.meta ? `<span class="searchable-select-option-meta">${escapeHtml(option.meta)}</span>` : ""}
                    </span>
                    <span class="badge">${escapeHtml(option.actionLabel || addLabel)}</span>
                  </button>
                `).join("")
                : `<div class="searchable-select-empty">${escapeHtml(emptyLabel)}</div>`}
            </div>
          </div>
        </div>
      `;
    }

    function syncSearchableSelect(root) {
      if (!(root instanceof HTMLElement)) return;
      const nativeSelect = root.querySelector(".searchable-select-native");
      if (!(nativeSelect instanceof HTMLSelectElement)) return;
      const triggerText = root.querySelector(".searchable-select-trigger-text");
      const selectedValue = String(nativeSelect.value || "");
      const selectedOption = nativeSelect.options[nativeSelect.selectedIndex] || null;
      if (triggerText) {
        triggerText.textContent = selectedOption ? selectedOption.textContent : "";
      }
      root.querySelectorAll("[data-searchable-select-option]").forEach((node) => {
        node.classList.toggle("active", String(node.dataset.value || "") === selectedValue);
      });
    }

    function filterSearchableSelect(root, query) {
      if (!(root instanceof HTMLElement)) return;
      const normalizedQuery = String(query || "").trim().toLowerCase();
      let visibleCount = 0;
      root.querySelectorAll("[data-searchable-select-option]").forEach((node) => {
        const haystack = String(node.dataset.searchText || "").toLowerCase();
        const visible = !normalizedQuery || haystack.includes(normalizedQuery);
        node.classList.toggle("hidden", !visible);
        if (visible) visibleCount += 1;
      });
      const emptyNode = root.querySelector(".searchable-select-empty");
      if (emptyNode) {
        emptyNode.classList.toggle("hidden", visibleCount > 0);
      }
    }

    function searchableSelectPanel(root) {
      if (!(root instanceof HTMLElement) || root.dataset.inline === "true") return null;
      const panel = root.querySelector(".searchable-select-panel");
      return panel instanceof HTMLElement ? panel : null;
    }

    function openSearchableSelect(root) {
      const panel = searchableSelectPanel(root);
      if (!panel) return;
      panel.classList.remove("hidden");
    }

    function closeSearchableSelect(root) {
      const panel = searchableSelectPanel(root);
      if (!panel) return;
      panel.classList.add("hidden");
    }

    function closeAllSearchableSelects(exceptRoot = null) {
      document.querySelectorAll("[data-searchable-select]").forEach((root) => {
        if (!(root instanceof HTMLElement) || root === exceptRoot) return;
        closeSearchableSelect(root);
      });
    }


    function applyLanguageDirection() {
      const lang = currentLanguage();
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
      document.body.dir = lang === "ar" ? "rtl" : "ltr";
      document.title = t("appTitle");
    }

    function truncate(value, length = 24) {
      const text = String(value ?? "");
      return text.length > length ? text.slice(0, length - 1) + "…" : text;
    }

    function formatNumber(value) {
      return new Intl.NumberFormat().format(Number(value || 0));
    }

    function formatDateTime(value) {
      if (!value) return "Unknown";
      return new Intl.DateTimeFormat(undefined, {
        month: "short",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
      }).format(new Date(value));
    }

    function relativeTime(value) {
      if (!value) return "unknown";
      const diffMs = Date.now() - new Date(value).getTime();
      const diffMin = Math.round(diffMs / 60000);
      if (diffMin < 1) return "now";
      if (diffMin < 60) return diffMin + "m ago";
      const diffHours = Math.round(diffMin / 60);
      if (diffHours < 24) return diffHours + "h ago";
      const diffDays = Math.round(diffHours / 24);
      return diffDays + "d ago";
    }

    function icon(name) {
      const icons = {
        grid: '<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="2" width="4" height="4"/><rect x="10" y="2" width="4" height="4"/><rect x="2" y="10" width="4" height="4"/><rect x="10" y="10" width="4" height="4"/></svg>',
        sliders: '<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 4h10"/><path d="M3 8h10"/><path d="M3 12h10"/><circle cx="6" cy="4" r="1.6" fill="currentColor"/><circle cx="10" cy="8" r="1.6" fill="currentColor"/><circle cx="5" cy="12" r="1.6" fill="currentColor"/></svg>',
        shield: '<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M8 1.8 13 3.7v3.8c0 3.3-2 5.7-5 6.7-3-1-5-3.4-5-6.7V3.7L8 1.8Z"/></svg>',
        zap: '<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M9.5 1.5 4.5 8h3L6.5 14.5l5-6.5h-3l1-6.5Z"/></svg>',
        user: '<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="5" r="3"/><path d="M2.5 14c.9-2.6 3-4 5.5-4s4.6 1.4 5.5 4"/></svg>',
        crown: '<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 12.5h12L12.5 4 8 8 3.5 4 2 12.5Z"/><path d="M4 12.5V14h8v-1.5"/></svg>',
        chevron: '<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="m4 6 4 4 4-4"/></svg>',
        chevronUp: '<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="m4 10 4-4 4 4"/></svg>',
        chevronDown: '<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="m4 6 4 4 4-4"/></svg>',
        more: '<svg class="icon" viewBox="0 0 16 16" fill="currentColor"><circle cx="3.5" cy="8" r="1.2"/><circle cx="8" cy="8" r="1.2"/><circle cx="12.5" cy="8" r="1.2"/></svg>',
        close: '<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 3 13 13"/><path d="M13 3 3 13"/></svg>',
        plus: '<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M8 3v10"/><path d="M3 8h10"/></svg>',
        trash: '<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3.5 4.5h9"/><path d="M6.5 2.5h3"/><path d="M5 4.5v8h6v-8"/><path d="M6.5 6.5v4"/><path d="M9.5 6.5v4"/></svg>',
        home: '<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2.5 6 8 1.5 13.5 6v8.5h-3v-5h-5v5h-3V6Z"/></svg>',
        layers: '<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M8 2 2 5l6 3 6-3-6-3Z"/><path d="M2 8l6 3 6-3"/><path d="M2 11l6 3 6-3"/></svg>',
        download: '<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M8 1.5v9"/><path d="M4 6.5l4 4 4-4"/><path d="M2.5 13v1.5h11V13"/></svg>',
        target: '<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="6"/><circle cx="8" cy="8" r="3"/><circle cx="8" cy="8" r="0.5" fill="currentColor"/></svg>',
        "message-circle": '<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M14 7.5a5.5 5.5 0 0 1-7.45 5.18L3.5 13.5l1.18-2.82A5.5 5.5 0 1 1 14 7.5Z"/></svg>',
        send: '<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M14 2 2 7l5 1.5L14 2Z"/><path d="M7 8.5 14 2"/><path d="M7 13.5V8.5"/><path d="M2 7l5 6.5"/></svg>',
        "settings-2": '<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="2.5"/><path d="M1.5 8H5m6 0h3.5"/><path d="M8 1.5V5m0 6v3.5"/><path d="M3.4 3.4l2.5 2.5m4.2 4.2 2.5 2.5"/><path d="M12.6 3.4l-2.5 2.5M5.9 10.1l-2.5 2.5"/></svg>',
        "bar-chart-2": '<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1.5 14.5h13"/><path d="M2.5 10.5v4"/><path d="M5.5 7.5v7"/><path d="M8.5 4.5v10"/><path d="M11.5 1.5v13"/></svg>',
        "credit-card": '<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1.5" y="4" width="13" height="9" rx="1.5"/><path d="M1.5 7h13"/><path d="M4 10.5h3"/></svg>',
      };
      return icons[name] || "";
    }

    function activeGroup() {
      return state.groups.find((group) => group.id === state.activeGroupId) || null;
    }

    function ensureScraperDraft() {
      const group = activeGroup();
      if (!state.ui.scraperDraft) {
        state.ui.scraperDraft = {};
      }
      if (!state.ui.scraperDraft.executor_type) {
        state.ui.scraperDraft.executor_type = "agent";
      }
      if (!("tg_group_id" in state.ui.scraperDraft) && group && group.tg_group_id != null) {
        state.ui.scraperDraft.tg_group_id = String(group.tg_group_id);
      }
      if (!state.ui.scraperDraft.member_limit) {
        state.ui.scraperDraft.member_limit = "100";
      }
      if (!state.ui.scraperDraft.message_limit) {
        state.ui.scraperDraft.message_limit = "50";
      }
      if (!("agent_id" in state.ui.scraperDraft)) {
        state.ui.scraperDraft.agent_id = "";
      }
      return state.ui.scraperDraft;
    }

    function currentScraperTargetGroupId() {
      const draft = ensureScraperDraft();
      if (draft.tg_group_id != null && String(draft.tg_group_id).trim() !== "") {
        return Number(draft.tg_group_id || 0);
      }
      return 0;
    }

    function currentScraperAgentGroups() {
      const draft = ensureScraperDraft();
      const agentId = Number(draft.agent_id || 0);
      return agentId ? (state.cache.agentGroups[agentId] || []) : [];
    }

    function scraperGroupOptions() {
      const options = currentScraperAgentGroups().map((group) => ({
        value: String(group.tg_group_id || ""),
        label: group.title || `Group ${group.tg_group_id || ""}`,
        meta: [
          group.tg_group_id != null ? String(group.tg_group_id) : "",
          group.member_count != null ? `${group.member_count} members` : "",
        ].filter(Boolean).join(" · "),
      })).filter((option) => option.value);
      const draft = ensureScraperDraft();
      const selectedValue = String(draft.tg_group_id || "").trim();
      if (selectedValue && !options.some((option) => option.value === selectedValue)) {
        const scrapedGroup = currentScrapedGroup();
        options.unshift({
          value: selectedValue,
          label: scrapedGroup?.title || `Group ${selectedValue}`,
          meta: scrapedGroup?.group_type ? `${selectedValue} · ${scrapedGroup.group_type}` : selectedValue,
        });
      }
      return options;
    }

    function currentScrapedGroup() {
      const targetTgGroupId = currentScraperTargetGroupId();
      const groups = state.cache.scraper[targetTgGroupId] || [];
      return groups[0] || null;
    }

    function currentScraperListFilterKey() {
      const filters = state.ui.scraperListFilters || {};
      return JSON.stringify({
        agent_id: String(filters.agent_id || ""),
      });
    }

    function currentScraperListAgentGroups() {
      const filters = state.ui.scraperListFilters || {};
      const agentId = Number(filters.agent_id || 0);
      return agentId ? (state.cache.agentGroups[agentId] || []) : [];
    }

    function scraperListGroupOptions() {
      return currentScraperListAgentGroups().map((group) => ({
        value: String(group.tg_group_id || ""),
        label: group.title || `Group ${group.tg_group_id || ""}`,
        meta: [
          group.tg_group_id != null ? String(group.tg_group_id) : "",
          group.member_count != null ? `${group.member_count} members` : "",
        ].filter(Boolean).join(" · "),
      })).filter((option) => option.value);
    }

    function syncScraperDraftFromInputs() {
      const draft = ensureScraperDraft();
      const executorInput = document.getElementById("scraper-executor-type");
      const agentInput = document.getElementById("scraper-agent-id");
      const targetInput = document.getElementById("scraper-target-group-id");
      const memberLimitInput = document.getElementById("scraper-member-limit");
      const messageLimitInput = document.getElementById("scraper-message-limit");
      draft.executor_type = executorInput && "value" in executorInput ? String(executorInput.value || "agent") : draft.executor_type;
      draft.agent_id = agentInput && "value" in agentInput ? String(agentInput.value || "") : draft.agent_id;
      draft.tg_group_id = targetInput && "value" in targetInput ? String(targetInput.value || "") : draft.tg_group_id;
      draft.member_limit = memberLimitInput && "value" in memberLimitInput ? String(memberLimitInput.value || "100") : draft.member_limit;
      draft.message_limit = messageLimitInput && "value" in messageLimitInput ? String(messageLimitInput.value || "50") : draft.message_limit;
      return draft;
    }

    function accessGateGroupId() {
      return Number(state.ui.accessGateProtectedGroupId || state.activeGroupId || 0) || null;
    }

    function setRoute(route) {
      state.route = route;
      if (location.hash !== route) {
        location.hash = route;
      }
      renderTopbar();
      renderContent();
      renderBottomNav();
    }

    function persistActiveGroup(groupId) {
      state.activeGroupId = groupId;
      localStorage.setItem("combot.activeGroupId", String(groupId));
      state.ui.groupPopoverOpen = false;
      renderSidebar();
      renderTopbar();
      renderContent();
    }

    function pushToast(message, type = "neutral") {
      const id = "toast-" + Math.random().toString(36).slice(2, 9);
      state.toasts = [{ id, message, type }, ...state.toasts].slice(0, 5);
      renderToasts();
      window.setTimeout(() => {
        state.toasts = state.toasts.filter((toast) => toast.id !== id);
        renderToasts();
      }, 4000);
    }

    function openModal(modal) {
      if (state.ui.groupPopoverOpen) {
        state.ui.groupPopoverOpen = false;
        renderGroupPopover();
      }

    function withInitData(path) {
      refreshTelegramInitData();
      if (!telegramInitData) return path;
      const url = new URL(path, window.location.origin);
      if (!url.searchParams.has("init_data")) {
        url.searchParams.set("init_data", telegramInitData);
      }
      return url.pathname + url.search;
    }

    function formatApiErrorDetail(detail) {
      if (typeof detail === "string" && detail.trim()) {
        return detail;
      }
      if (Array.isArray(detail) && detail.length) {
        return detail.map((item) => {
          if (typeof item === "string") {
            return item;
          }
          if (item && typeof item === "object") {
            const path = Array.isArray(item.loc) ? item.loc.join(".") : "";
            const message = typeof item.msg === "string" ? item.msg : JSON.stringify(item);
            return path ? `${path}: ${message}` : message;
          }
          return String(item);
        }).join("; ");
      }
      if (detail && typeof detail === "object") {
        try {
          return JSON.stringify(detail);
        } catch (_error) {
          return "Request failed";
        }
      }
      return "Request failed";
    }

    async function apiRequest(path, options = {}) {
      if (DEV_MODE) {
        return mockRequest(path, options);
      }

      let response;
      try {
        response = await fetch(withInitData(path), {
          ...options,
          headers: {
            "Content-Type": "application/json",
            "X-Telegram-Init-Data": telegramInitData,
            ...(options.boundary ? { "X-App-Boundary": options.boundary } : {}),
            ...(options.headers || {}),
          },
        });
      } catch (error) {
        if (error && error.name === "AbortError") {
          throw error;
        }
        pushToast("Network error. Check your connection and try again.", "danger");
        throw error;
      }

      if (response.status === 401) {
        state.sessionExpired = true;
        renderContent();
        throw new Error("Session expired");
      }

      if (response.status === 403) {
        pushToast("You don't have permission for this action.", "warning");
      }

      if (!response.ok) {
        let detail = "Request failed";
        try {
          const payload = await response.json();
          detail = formatApiErrorDetail(payload.detail || detail);
        } catch (_error) {
          // ignore non-json responses
        }
        if (response.status >= 400 && response.status < 500 && response.status !== 401 && response.status !== 403) {
          pushToast(detail, "warning");
        } else if (response.status >= 500) {
          pushToast(detail, "danger");
        }
        const error = new Error(detail);
        error.status = response.status;
        throw error;
      }

      if (response.status === 204) {
        return null;
      }

      return response.json();
    }

    function paginationWindow(page, totalPages, maxVisible = 5) {
      if (totalPages <= maxVisible) {
        return Array.from({ length: totalPages }, (_, index) => index);
      }
      const half = Math.floor(maxVisible / 2);
      let start = Math.max(0, page - half);
      let end = Math.min(totalPages, start + maxVisible);
      if (end - start < maxVisible) {
        start = Math.max(0, end - maxVisible);
      }
      return Array.from({ length: end - start }, (_, index) => start + index);
    }

    function paginateItems(key, items = [], pageSize = 10) {
      const normalizedItems = Array.isArray(items) ? items : [];
      const configuredPageSize = Number(state.ui.paginationSizes[key] || pageSize || 10);
      const safePageSize = Math.max(1, configuredPageSize);
      state.ui.paginationSizes[key] = safePageSize;
      const totalPages = Math.max(1, Math.ceil(normalizedItems.length / safePageSize));
      let page = Number(state.ui.pagination[key] || 0);
      if (!Number.isFinite(page) || page < 0) page = 0;
      if (page >= totalPages) page = totalPages - 1;
      state.ui.pagination[key] = page;
      return {
        key,
        page,
        pageSize: safePageSize,
        totalItems: normalizedItems.length,
        totalPages,
        items: normalizedItems.slice(page * safePageSize, page * safePageSize + safePageSize),
      };
    }

    function paginationControls({ key, page, totalPages, totalItems, renderTarget = "content" }) {
      if (!key || totalItems <= 0) return "";
      const pageSize = Number(state.ui.paginationSizes[key] || 10);
      const pageNumbers = paginationWindow(page, totalPages, 5);
      const start = totalItems ? (page * pageSize) + 1 : 0;
      const end = Math.min(totalItems, (page + 1) * pageSize);
      return `
        <div class="toolbar" style="margin-top:12px">
          <div class="muted">${escapeHtml(`${start}-${end} of ${totalItems}`)}</div>
          <div class="toolbar-group">
            <select data-action="change-page-size" data-pagination-key="${escapeHtml(key)}" data-pagination-render="${escapeHtml(renderTarget)}">
              ${[5, 10, 20, 50].map((size) => `

            <button class="ghost-button" type="button" data-action="paginate-prev" data-pagination-key="${escapeHtml(key)}" data-pagination-render="${escapeHtml(renderTarget)}" ${page === 0 ? "disabled" : ""}>${escapeHtml(t("prev"))}</button>

    function ownerMonthChart(groups) {
      const buckets = new Map();
      for (const group of groups || []) {
        const date = group.created_at ? new Date(group.created_at) : new Date();
        const key = date.getUTCFullYear() + "-" + String(date.getUTCMonth() + 1).padStart(2, "0");
        buckets.set(key, (buckets.get(key) || 0) + 1);
      }
      const entries = Array.from(buckets.entries()).sort((a, b) => a[0].localeCompare(b[0])).slice(-6);
      const max = Math.max(1, ...entries.map((entry) => entry[1]));
      return `
        <div class="chart">
          ${entries.map(([month, count]) => `
            <div class="chart-bar">
              <div class="chart-bar-fill" style="height:${Math.max(8, Math.round((count / max) * 140))}px"></div>
              <div class="chart-label">${escapeHtml(month.slice(5))}</div>
            </div>
          `).join("")}
        </div>
      `;
    }

    function readReplyInlineButtonsFromForm(fd) {
      const texts = fd.getAll("config_inline_button_text").map((value) => String(value || "").trim());

      const size = Math.max(texts.length, urls.length);
      const buttons = [];
      for (let index = 0; index < size; index += 1) {

    function buildAutomationTaskDraft(partial = {}) {
      const resolvedGroupId =
        partial.group_id == null || partial.group_id === ""
          ? 0
          : Number(partial.group_id);
      const hasExplicitGroupIds = Object.prototype.hasOwnProperty.call(partial, "group_ids");
      const normalizedGroupIds = Array.isArray(partial.group_ids)
        ? partial.group_ids
        : String(partial.group_ids || "")
            .split(",")
            .map((value) => Number(value.trim()))
            .filter(Boolean);
      const resolvedGroupIds = hasExplicitGroupIds
        ? normalizedGroupIds
        : normalizedGroupIds.length
        ? normalizedGroupIds
        : resolvedGroupId
          ? [resolvedGroupId]
          : [];
      const normalizedGroupTgIds = String(partial.group_tg_ids || "")
        .split(",")
        .map((value) => Number(value.trim()))
        .filter(Boolean);
      const normalizedGroupTitles = String(partial.group_titles || "")
        .split(",")
        .map((value) => String(value || "").trim())
        .filter(Boolean);
      const taskKey = partial.task_key || "";
      const resolvedConfig = { ...(partial.config || {}) };
      if (taskKey === "notify_destination") {
        const resolvedDestination = String(resolvedConfig.destination || "").trim();
        const matchingGroup = state.groups.find((group) => String(group.tg_group_id) === resolvedDestination);
        const hasApprovalReply = String(resolvedConfig.suggested_reply_template || "").trim();
        resolvedConfig.delivery_mode = String(resolvedConfig.delivery_mode || (hasApprovalReply ? "approval_request" : "text")) || "text";
        resolvedConfig.destination_group_id = resolvedConfig.destination_group_id || (matchingGroup ? String(matchingGroup.tg_group_id) : "");
        resolvedConfig.destination_chat_id = resolvedConfig.destination_chat_id || (!matchingGroup ? resolvedDestination : "");
      } else if (taskKey === "reply_message") {
        resolvedConfig.reply_markup_type = String(resolvedConfig.reply_markup_type || "none") || "none";
        resolvedConfig.inline_buttons = normalizeReplyInlineButtons(resolvedConfig.inline_buttons);
      }
      const resolvedConditions = { ...(partial.conditions || {}) };
      if (taskKey === "notify_destination" && resolvedConditions.has_text === "") {
        resolvedConditions.has_text = true;
      }
      return {
        assignment_id: partial.assignment_id || "",
        task_key: taskKey,
        executor_type: partial.executor_type || "bot",
        enabled: partial.enabled !== false,
        conditions: resolvedConditions,
        config: resolvedConfig,
        agent_id: partial.agent_id == null || partial.agent_id === "" ? null : Number(partial.agent_id),
        group_id: resolvedGroupIds[0] || resolvedGroupId,
        group_ids: resolvedGroupIds,
        group_query: partial.group_query || "",
        group_tg_ids: normalizedGroupTgIds,
        group_titles: normalizedGroupTitles,
        group_tg_id: normalizedGroupTgIds[0] || "",
        group_title: normalizedGroupTitles[0] || "",
      };
    }

    function readAutomationTaskFormDraft(form) {
      const fd = new FormData(form);
      const taskKey = String(fd.get("task_key") || "");
      const definition = (state.cache.taskCatalog || []).find((item) => item.key === taskKey);
      const config = {};
      if (taskKey === "notify_destination") {
        const selectedDestinationGroupId = String(fd.get("config_destination_group_id") || "").trim();
        const destinationChatId = String(fd.get("config_destination_chat_id") || "").trim();
        config.message_template = String(fd.get("config_message_template") || "");
        config.delivery_mode = String(fd.get("config_delivery_mode") || "text") || "text";
        config.suggested_reply_template = String(fd.get("config_suggested_reply_template") || "");
        config.destination_group_id = selectedDestinationGroupId;
        config.destination_chat_id = destinationChatId;
        config.destination = selectedDestinationGroupId || destinationChatId;
      } else if (taskKey === "reply_message") {
        config.message_template = String(fd.get("config_message_template") || "");
        config.reply_markup_type = String(fd.get("config_reply_markup_type") || "none") || "none";
        config.inline_buttons = readReplyInlineButtonsFromForm(fd);
      } else {
        for (const field of normalizeTaskConfigSchema(definition)) {
          config[field.key] = String(fd.get("config_" + field.key) || "");
        }
      }
      return buildAutomationTaskDraft({
        assignment_id: String(fd.get("assignment_id") || ""),
        task_key: String(fd.get("task_key") || ""),
        executor_type: String(fd.get("executor_type") || "bot"),
        enabled: String(fd.get("enabled") || "true") === "true",
        conditions: {
          text_contains_any: String(fd.get("condition_text_contains_any") || ""),
          has_text: fd.get("condition_has_text") ? fd.get("condition_has_text") === "true" : (taskKey === "notify_destination" ? true : ""),
        },
        config,
        agent_id: fd.get("agent_id") ? Number(fd.get("agent_id")) : null,
        group_id: Number(fd.get("group_id") || 0),
        group_ids: String(fd.get("group_ids") || "")
          .split(",")
          .map((value) => Number(value.trim()))
          .filter(Boolean),
        group_query: String(fd.get("group_query") || ""),
        group_tg_ids: String(fd.get("group_tg_ids") || "")
          .split(",")
          .map((value) => Number(value.trim()))
          .filter(Boolean),
        group_titles: String(fd.get("group_titles") || "")
          .split(",")
          .map((value) => String(value || "").trim())
          .filter(Boolean),
        group_tg_id: Number(fd.get("group_tg_id") || 0) || "",
        group_title: String(fd.get("group_title") || ""),
      });
    }

      const username = String(agent?.metadata?.username || "").replace(/^@+/, "").trim();

      const base = username ? `@${username}` : `@${fallback}`;

    function automationTaskModalBody() {
      const tasks = state.cache.tasks[state.activeGroupId] || [];
      const catalog = state.cache.taskCatalog || [];
      const selectedTask = tasks.find((item) => item.assignment_id === state.ui.automationSelection) || null;
      const bindingGroupId = Number(
        state.ui.automationBindingGroupId
        || (selectedTask && selectedTask.group_id)
        || state.activeGroupId
        || 0
      );
      const agents = state.cache.agents[bindingGroupId] || [];
      const selectedAgentId = Number((currentAutomationTaskDraft() || selectedTask || {}).agent_id || 0);
      const selectedAgent =
        Object.values(state.cache.agents)
          .flat()
          .find((agent) => Number(agent.id) === selectedAgentId) || null;
      const visibleAgents = selectedAgent && !agents.some((agent) => Number(agent.id) === Number(selectedAgent.id))
        ? [selectedAgent, ...agents]
        : agents;
      const relatedAgentGroups = selectedAgentId ? (state.cache.agentGroups[selectedAgentId] || []) : [];
      const filteredBindingGroups = Array.from(
        relatedAgentGroups.reduce((acc, item) => {
          const tgGroupId = Number(item.tg_group_id || 0);
          if (!tgGroupId || acc.has(tgGroupId)) {
            return acc;
          }
          const matchedGroup =
            state.groups.find((group) => Number(group.id) === Number(item.id))
            || state.groups.find((group) => Number(group.tg_group_id) === tgGroupId);
          const resolvedGroupId = matchedGroup ? Number(matchedGroup.id) : null;
          const displayId = resolvedGroupId || -tgGroupId;
          acc.set(tgGroupId, {
            id: displayId,
            internal_id: resolvedGroupId,
            tg_group_id: tgGroupId,
            title: String(item.title || matchedGroup?.title || item.tg_group_id || ""),
            available: Boolean(resolvedGroupId),
          });
          return acc;
        }, new Map()).values()
      )
        .filter((group) => Number(group.tg_group_id));
      const draft = currentAutomationTaskDraft();
      const editTarget = draft || selectedTask || {
        assignment_id: "",
        task_key: catalog[0] ? catalog[0].key : "",
        executor_type: "bot",
        enabled: true,
        conditions: {},
        config: {},
        agent_id: null,
        group_id: "",
        group_ids: [],
        group_query: "",
        group_tg_ids: [],
        group_titles: [],
        group_tg_id: "",
        group_title: "",
      };
      const groupOptions =
        editTarget.executor_type === "agent" && selectedAgentId
          ? filteredBindingGroups
          : state.groups;
      const hasExplicitSelectedGroups = Array.isArray(editTarget.group_ids);
      const selectedGroupIds = hasExplicitSelectedGroups
        ? editTarget.group_ids.map((value) => Number(value)).filter(Boolean)
        : Number(editTarget.group_id || 0)
          ? [Number(editTarget.group_id)]
          : [];
      const selectedGroupSource = [...groupOptions, ...state.groups].reduce((acc, group) => {
        const normalizedId = Number(group.id || 0);
        if (normalizedId && !acc.has(normalizedId)) {
          acc.set(normalizedId, group);
        }
        return acc;
      }, new Map());
      const groupQuery = String(editTarget.group_query || "").trim().toLowerCase();
      const selectedGroups = [];
      const selectedGroupKeys = new Set();
      selectedGroupIds.forEach((groupId, index) => {
        const numericGroupId = Number(groupId);
        const directMatch = selectedGroupSource.get(numericGroupId) || null;
        const selectedGroupTgId = Number((editTarget.group_tg_ids || [])[index] || 0);
        const selectedGroupTitle = String((editTarget.group_titles || [])[index] || "").trim();
        const fallbackMatch = !directMatch && selectedGroupTgId
          ? groupOptions.find((group) => Number(group.tg_group_id || 0) === selectedGroupTgId) || null
          : null;
        const resolvedGroup = directMatch || fallbackMatch;
        const selectionKey = resolvedGroup
          ? `id:${Number(resolvedGroup.id || 0)}`
          : selectedGroupTgId
            ? `tg:${selectedGroupTgId}`
            : selectedGroupTitle
              ? `title:${selectedGroupTitle}`
              : "";
        if (resolvedGroup) {
          if (selectionKey && selectedGroupKeys.has(selectionKey)) {
            return;
          }
          if (selectionKey) {
            selectedGroupKeys.add(selectionKey);
          }
          selectedGroups.push(resolvedGroup);
          return;
        }
        if (!selectedGroupTgId && !selectedGroupTitle) {
          return;
        }
        if (selectionKey && selectedGroupKeys.has(selectionKey)) {
          return;
        }
        if (selectionKey) {
          selectedGroupKeys.add(selectionKey);
        }
        selectedGroups.push({
          id: numericGroupId || -selectedGroupTgId,
          tg_group_id: selectedGroupTgId || null,
          title: selectedGroupTitle || String(selectedGroupTgId || numericGroupId || "Unknown group"),
        });
      });
      const availableGroups = groupOptions.filter((group) => {
        if (selectedGroupIds.includes(Number(group.id))) {
          return false;
        }
        if (!groupQuery) {
          return true;
        }
        const haystack = `${group.title} ${group.tg_group_id}`.toLowerCase();
        return haystack.includes(groupQuery);
      });
      const definition = catalog.find((item) => item.key === editTarget.task_key) || catalog[0] || null;
      const configFields = normalizeTaskConfigSchema(definition);
      const isNotifyDestinationTask = editTarget.task_key === "notify_destination";
      return `
        <form id="task-form" class="task-editor-form">
          <input type="hidden" name="assignment_id" value="${escapeHtml(editTarget.assignment_id || "")}" />
          <input type="hidden" name="original_group_id" value="${escapeHtml(String((selectedTask && selectedTask.group_id) || state.activeGroupId || ""))}" />
          <input type="hidden" name="group_id" value="${escapeHtml(String(editTarget.group_id || selectedGroupIds[0] || ""))}" />
          <input type="hidden" name="group_ids" value="${escapeHtml(selectedGroupIds.join(","))}" />
          <input type="hidden" name="group_tg_ids" value="${escapeHtml((editTarget.group_tg_ids || []).join(","))}" />
          <input type="hidden" name="group_titles" value="${escapeHtml((editTarget.group_titles || []).join(","))}" />
          <input type="hidden" name="group_tg_id" value="${escapeHtml(String(editTarget.group_tg_id || ""))}" />
          <input type="hidden" name="group_title" value="${escapeHtml(editTarget.group_title || "")}" />
          <div class="field">
            <label class="field-label" for="task-key">Task Type</label>
            <select id="task-key" name="task_key" data-action="task-key-change">
              ${catalog.map((item) => `<option value="${escapeHtml(item.key)}" ${item.key === editTarget.task_key ? "selected" : ""}>${escapeHtml(item.title)}</option>`).join("")}
            </select>
          </div>
          <div class="field">
            <label class="field-label" for="task-executor">Executor</label>
            ${renderSearchableSelect({
              id: "task-executor",
              name: "executor_type",
              value: editTarget.executor_type,
              options: [
                { value: "bot", label: "bot", meta: "" },
                { value: "agent", label: "agent", meta: "" },
              ],
              placeholder: "Select executor",
              searchPlaceholder: "Search executors",
              emptyLabel: "No matching executors.",
              selectAction: "task-executor-change",
            })}
          </div>
          ${
            editTarget.executor_type === "agent"
              ? `
                <div class="field" data-agent-executor-field>
                  <label class="field-label" for="task-agent-id">Agent</label>
                  ${renderSearchableSelect({
                    id: "task-agent-id",
                    name: "agent_id",
                    value: editTarget.agent_id == null ? "" : String(editTarget.agent_id),
                    options: [{ value: "", label: "Select an agent", meta: "" }].concat(
                      visibleAgents.map((agent) => ({
                        value: String(agent.id),
                        label: formatAgentOptionLabel(agent),
                        meta: agent.phone_number || "",
                      }))
                    ),
                    placeholder: "Select an agent",
                    searchPlaceholder: "Search agents",
                    emptyLabel: "No matching agents.",
                    selectAction: "task-agent-change",
                  })}
                  <div class="field-hint">Agent execution requires a linked Telegram account.</div>
                </div>
              `
              : `
                <div class="field">
                  <label class="field-label" for="task-bot-name">Bot</label>
                  <input id="task-bot-name" type="text" value="Bot" disabled />
                </div>
              `
          }
          <div class="field">
            <label class="field-label" for="task-group-select">Group</label>
            ${renderSearchableSelect({
              id: "task-group-select",
              value: "",
              options: [{ value: "", label: "Select a group", meta: "" }].concat(
                availableGroups.map((group) => ({
                  value: String(group.id),
                  label: group.title,
                  meta: String(group.tg_group_id || ""),
                }))
              ),
              placeholder: "Select a group",
              searchPlaceholder: "Search groups",
              emptyLabel: groupQuery ? "No matching groups." : editTarget.executor_type === "agent" && selectedAgentId ? "No groups found for the selected agent." : "No more groups available.",
              disabled: !availableGroups.length,
              selectAction: "task-group-change",
            })}
            <div class="multi-select-shell">
              <div class="multi-select-chips">
                ${selectedGroups.length
                  ? selectedGroups.map((group) => `
                    <span class="multi-select-chip">
                      <span>${escapeHtml(`${group.title} · ${String(group.tg_group_id)}`)}</span>
                      <button class="chip-remove" type="button" data-action="remove-task-group" data-group-id="${group.id}" aria-label="${escapeHtml(t("close"))}">×</button>
                    </span>
                  `).join("")
                  : `<div class="multi-select-empty">No groups selected.</div>`}
              </div>
              <div class="field-hint">${escapeHtml(editTarget.executor_type === "agent" ? "Groups come from the selected agent account. Only managed groups can be added." : "The first selected group remains the bound task group.")}</div>
            </div>
          </div>
          <div class="field">
            <label class="field-label" for="task-enabled">Enabled</label>
            ${toggleButton(Boolean(editTarget.enabled), 'data-action="task-toggle-enabled"')}
            <input type="hidden" name="enabled" value="${editTarget.enabled ? "true" : "false"}" />
          </div>
          <div class="field">
            <label class="field-label" for="task-condition-contains">Text Contains Any</label>
            <input id="task-condition-contains" name="condition_text_contains_any" type="text" value="${escapeHtml(editTarget.conditions.text_contains_any || "")}" placeholder="pricing,demo,trial" />
          </div>
          <div class="field">
            <label class="field-label" for="task-condition-has-text">Has Text</label>
            <select id="task-condition-has-text" name="condition_has_text">
              <option value="">Unset</option>
              <option value="true" ${editTarget.conditions.has_text === true || String(editTarget.conditions.has_text) === "true" ? "selected" : ""}>true</option>
              <option value="false" ${editTarget.conditions.has_text === false || String(editTarget.conditions.has_text) === "false" ? "selected" : ""}>false</option>
            </select>
          </div>
          ${isNotifyDestinationTask ? notifyDestinationConfigMarkup(editTarget) : editTarget.task_key === "reply_message" ? replyMessageConfigMarkup(editTarget) : (configFields.length ? configFields.map((field) => `
            <div class="field">
              <label class="field-label" for="config-${escapeHtml(field.key)}">${escapeHtml(field.label || field.key)}</label>
              <input id="config-${escapeHtml(field.key)}" name="config_${escapeHtml(field.key)}" type="text" value="${escapeHtml((editTarget.config || {})[field.key] || "")}" placeholder="${escapeHtml(field.description || "")}" />
              <div class="field-hint">${escapeHtml(field.description || "")}</div>
            </div>
          `).join("") : emptyState("No configuration schema for this task."))}
        </form>
      `;
    }

    function stringifyJobResult(job) {
      try {

      } catch (_error) {
        return String(job.job_payload || "");

      state.cache.liveMemberDirectory[groupId] = bucket;

      const selectedAgentId = Number(state.ui.bulkMessageDraft.agent_id || 0);

    async function resolveAgentTaskGroup(tgGroupId, title) {
      const normalized = Number(tgGroupId || 0);
      if (!normalized) return null;
      try {
        const payload = await apiRequest("/webapp/groups/resolve", {
          method: "POST",
          body: JSON.stringify({
            tg_group_id: normalized,
            title: title || "",
          }),
        });
        return Number(payload.group_id || 0);
      } catch (error) {
        console.error("Failed to resolve agent group", error);
        pushToast("Unable to map that group for automation tasks yet.", "warning");
        return null;
      }
    }

    async function searchBulkMembers(force = false) {
      bulkSearchSeq += 1;
      const seq = bulkSearchSeq;
      if (bulkSearchController) {
        bulkSearchController.abort();
      }
      bulkSearchController = new AbortController();
      if (!state.ui.bulkMessageDraft.source_managed_group_id && state.ui.bulkMessageDraft.source_group_id) {
        state.ui.bulkMessageDraft.source_managed_group_id = selectedBulkMessageManagedGroupId();
      }
      const groupId = Number(state.ui.bulkMessageDraft.source_managed_group_id || 0);
      if (!groupId) return [];
      const normalizedQuery = String(state.ui.bulkMessageDraft.user_query || "").trim();
      const cacheKey = liveMemberSearchKey(groupId, normalizedQuery);
      if (!force && state.cache.liveMemberSearch[cacheKey]) {
        return state.cache.liveMemberSearch[cacheKey];
      }
      const params = new URLSearchParams();
      if (normalizedQuery) params.set("q", normalizedQuery);
      params.set("limit", normalizedQuery ? "100" : "200");
      const payload = await apiRequest(`/webapp/groups/${groupId}/stored-members?${params.toString()}`, {
        signal: bulkSearchController.signal,
      });
      if (seq !== bulkSearchSeq) return [];
      state.cache.liveMemberSearch[cacheKey] = payload;
      mergeLiveMembers(groupId, payload);
      return payload;
    }

    async function searchMembersToAdd(force = false) {
      bulkSearchSeq += 1;
      const seq = bulkSearchSeq;
      if (bulkSearchController) {
        bulkSearchController.abort();
      }
      bulkSearchController = new AbortController();
      const agentId = Number(state.ui.bulkAddMembersDraft.agent_id || 0);
      const groupId = Number(state.ui.bulkAddMembersDraft.source_group_id || 0);
      if (!agentId || !groupId) return [];
      const normalizedQuery = String(state.ui.bulkAddMembersDraft.user_query || "").trim();
      const cacheKey = liveMemberSearchKey(groupId, normalizedQuery);
      if (!force && state.cache.liveMemberSearch[cacheKey]) {
        return state.cache.liveMemberSearch[cacheKey];
      }
      const params = new URLSearchParams();
      params.set("tg_group_id", String(groupId));
      if (normalizedQuery) params.set("q", normalizedQuery);
      params.set("limit", normalizedQuery ? "30" : "20");
      const payload = await apiRequest(`/webapp/agents/${agentId}/member-search?${params.toString()}`, {
        signal: bulkSearchController.signal,
      });
      if (seq !== bulkSearchSeq) return [];
      state.cache.liveMemberSearch[cacheKey] = payload;
      mergeLiveMembers(groupId, payload);
      return payload;
    }

    async function loadScraper(force = false) {
      const group = activeGroup();
      const draft = ensureScraperDraft();
      if (group && !draft.tg_group_id && group.tg_group_id != null) {
        draft.tg_group_id = String(group.tg_group_id);
      }
      if (group) {
        await loadAgents(group.id, force);
      }
      await primeScraperAgentGroupCaches(force);
      const targetTgGroupId = currentScraperTargetGroupId();
      if (!targetTgGroupId) {
        state.cache.scraper[0] = [];
        return;
      }
      if (!force && state.cache.scraper[targetTgGroupId]) {
        return;
      }
      const groups = await apiRequest(`/webapp/scraper/groups?tg_group_id=${encodeURIComponent(String(targetTgGroupId))}`);
      state.cache.scraper[targetTgGroupId] = groups || [];
      const latestGroup = (groups || [])[0];
      if (!latestGroup) {
        state.cache.scraperMembers[targetTgGroupId] = { members: [], total: 0, page: 1, page_size: 20 };
        state.cache.scraperMessages[targetTgGroupId] = { messages: [], total: 0, page: 1, page_size: 20 };
        return;
      }
      const [membersPayload, messagesPayload] = await Promise.all([
        apiRequest(`/webapp/scraper/groups/${latestGroup.id}/members?page=1&page_size=20`),
        apiRequest(`/webapp/scraper/groups/${latestGroup.id}/messages?page=1&page_size=20`),
      ]);
      state.cache.scraperMembers[targetTgGroupId] = membersPayload;
      state.cache.scraperMessages[targetTgGroupId] = messagesPayload;
    }

      if (!force && state.cache.scraperList[key]) {
        return state.cache.scraperList[key];
      }
      const params = new URLSearchParams();
      if (filters.agent_id) params.set("agent_id", String(filters.agent_id));
      const path = params.size ? `/webapp/scraper/groups?${params.toString()}` : "/webapp/scraper/groups";
      const payload = await apiRequest(path);
      state.cache.scraperList[key] = payload || [];
      return state.cache.scraperList[key];
    }

      if (state.route === "#/home") {
        await Promise.all([loadOverview(), loadWarnings()]);
      } else if (state.route === "#/accounts") {
        await loadAgents();
      } else if (state.route === "#/groups") {
        await Promise.all([loadAgents(), loadScraperList()]);
      } else if (state.route === "#/scraper") {
        await Promise.all([loadAgents(), primeScraperAgentGroupCaches(), loadScraper(), loadScraperList()]);
      } else if (state.route === "#/leads") {
        await loadAgents(state.activeGroupId);
      } else if (state.route === "#/replies" || state.route === "#/campaigns" || state.route === "#/automation") {
        await Promise.all([loadAutomation(), loadAgents()]);
      } else if (state.route === "#/analytics") {
        await loadAgents();
      } else if (state.route === "#/subscription") {
        await loadAgents();
      } else if (state.route === "#/settings") {
        await loadSettings();
      } else if (state.route === "#/owner" && state.isOwner) {
        await loadOwner();
      }
    }

    function renderLeadsView() {
      var agents = state.cache.agents[state.activeGroupId] || [];
      if (agents.length === 0) {
        return '<div class="view">' + emptyState(t("noLeadsYet")) + '</div>';
      }
      
      var agent = agents[0];
      var leadsCache = state.cache.agentLeads || {};
      var leadsPage = leadsCache[agent.id];
      var items = leadsPage ? (leadsPage.items || []) : [];
      var total = leadsPage ? (leadsPage.total || 0) : 0;
      
      var statuses = ["new", "contacted", "interested", "converted"];
      var junkStatuses = ["junk", "dismissed"];
      var statusLabels = {
        "new": t("leadNew"),
        "contacted": t("leadContacted"),
        "interested": t("leadInterested"),
        "converted": t("leadConverted"),
        "junk": t("leadJunk"),
        "dismissed": t("leadDismissed"),
      };
      
      var pipelineHtml = statuses.map(function(status) {
        var statusItems = items.filter(function(l) { return l.status === status; });
        return '\
          <div class="section-card">\
            <div class="panel-title">' + escapeHtml(statusLabels[status]) + ' <span class="badge">' + statusItems.length + '</span></div>\
            ' + (statusItems.length > 0 ? statusItems.map(function(lead) {
              return '<div class="feed-row"><div class="feed-body"><strong>' + escapeHtml(lead.first_name || lead.username || "Lead") + '</strong><br/><span class="mono">' + escapeHtml(truncate(lead.message_text || "", 60)) + '</span></div><div class="feed-meta"><button class="button small" type="button" data-action="view-lead" data-lead-id="' + lead.id + '" data-agent-id="' + agent.id + '">' + escapeHtml(t("contactLead")) + '</button></div></div>';
            }).join("") : '<div class="empty-state">No ' + statusLabels[status].toLowerCase() + ' leads</div>') + '\
          </div>';
      }).join("");
      
      var junkHtml = '';
      var junkItems = items.filter(function(l) { return junkStatuses.indexOf(l.status) !== -1; });
      if (junkItems.length > 0) {
        junkHtml = '<details class="section-card"><summary>Junk & Dismissed (' + junkItems.length + ')</summary>' + junkItems.map(function(lead) {
          return '<div class="feed-row"><span>' + escapeHtml(lead.first_name || lead.username || "Lead") + '</span><span class="badge">' + escapeHtml(lead.status) + '</span></div>';
        }).join("") + '</details>';
      }
      
      var statsHtml = '';
      if (leadsCache._stats && leadsCache._stats[agent.id]) {
        var leadStats = leadsCache._stats[agent.id];
        statsHtml = '<div class="grid-4">' +
          statCard("Total", formatNumber(leadStats.total || 0), "") +
          statCard(t("conversionRate"), (leadStats.by_status && leadStats.by_status.converted ? Math.round(leadStats.by_status.converted / Math.max(leadStats.total, 1) * 100) : 0) + "%", "") +
          statCard("Interested", formatNumber(leadStats.by_status ? (leadStats.by_status.interested || 0) : 0), "") +
          statCard("New", formatNumber(leadStats.by_status ? (leadStats.by_status["new"] || 0) : 0), "") +
        '</div>';
      }
      
      if (items.length === 0) {
        return '<div class="view">' + statsHtml + '<div class="section-card"><div class="panel-title">' + escapeHtml(t("leadsTitle")) + '</div>' + emptyState(t("noLeadsYet")) + '</div></div>';
      }
      
      return '<div class="view">' + statsHtml + pipelineHtml + junkHtml + '</div>';
    }

        state.ui.settingsCategory = categories[0] ? categories[0].key : "general";
      }
      if (!state.ui.accessGateProtectedGroupId && state.activeGroupId) {
        state.ui.accessGateProtectedGroupId = state.activeGroupId;

                  entries: entries.filter((entry) => (entry.category || "general") === activeCategory),
                  values,
                  groupId: state.activeGroupId,
                }),
                "",
                "Settings"
              )).join("");
          content = rows || emptyState("No settings found for this category.");
        }
      }

      return `
        <div class="view">
          <div class="split-layout">
            <div class="category-list panel">
              ${categories.map((category) => `
                <button class="category-button ${category.key === activeCategory ? "active" : ""} ${category.key === "moderation" ? "collapsed-section" : ""}" type="button" data-action="select-settings-category" data-category="${escapeHtml(category.key)}">
                  <span>${escapeHtml(category.label.replaceAll("_", " "))}</span>
                  ${category.key === "access_gate" ? `<span class="badge accent">gate</span>` : ""}
                </button>
              `).join("")}
            </div>
            <div class="stack">${content}</div>
          </div>
        </div>
      `;
    }

    function renderSettingsEntriesMarkup({ entries = [], values = {}, groupId = 0, statusScope = "", settingMode = "live" } = {}) {
      return entries.map((entry) => {
        const value = values[entry.key] ?? entry.default ?? (entry.type === "toggle" ? false : "");
        const status = state.ui.settingsStatus[settingStatusKey(entry.key, statusScope)];
        const settingAttrs = `data-setting-key="${escapeHtml(entry.key)}" data-setting-group-id="${escapeHtml(String(groupId || 0))}" data-setting-status-scope="${escapeHtml(statusScope)}" data-setting-mode="${escapeHtml(settingMode)}"`;
        let control = "";
        if (entry.type === "toggle") {
          control = `
            <div class="settings-control-inline">
              ${toggleButton(Boolean(value), `data-action="toggle-setting" ${settingAttrs}`)}
              <span class="${settingsStatusClass(status)}">${escapeHtml(settingsStatusLabel(status))}</span>
            </div>
          `;
        } else if (entry.type === "number") {
          if (typeof entry.min === "number" && typeof entry.max === "number") {
            control = `
              <div class="slider-row">
                <input type="range" min="${entry.min}" max="${entry.max}" value="${escapeHtml(value)}" ${settingAttrs} data-setting-type="range" />
                <input class="number-input" type="number" min="${entry.min}" max="${entry.max}" value="${escapeHtml(value)}" ${settingAttrs} data-setting-type="number" />
              </div>
            `;
          } else {
            control = `<input class="number-input" type="number" value="${escapeHtml(value)}" ${settingAttrs} data-setting-type="number" />`;
          }
        } else {
          control = `<input type="text" value="${escapeHtml(value)}" ${settingAttrs} data-setting-type="text" />`;
        }
        return `
          <div class="settings-row">
            <div>
              <div>${escapeHtml(entry.label_key || entry.key)}</div>
              <div class="field-hint mono">${escapeHtml(entry.key)}</div>
            </div>
            <div class="stack">
              ${control}
              ${entry.type === "toggle" ? "" : `<span class="${settingsStatusClass(status)}">${escapeHtml(settingsStatusLabel(status))}</span>`}
            </div>
          </div>
        `;
      }).join("");
    }

    function moderationSettingsModalBody() {
      const draft = state.ui.moderationSettingsDraft || {};
      const selectedGroupIds = Array.isArray(draft.group_ids) && draft.group_ids.length
        ? draft.group_ids.map((value) => Number(value)).filter((value) => value > 0)
        : [Number(state.activeGroupId || state.groups[0]?.id || 0)].filter((value) => value > 0);
      const activeGroupId = Number(draft.active_group_id || selectedGroupIds[0] || 0);
      const selectedGroups = (state.groups || []).filter((group) => selectedGroupIds.includes(Number(group.id)));
      const groupQuery = String(draft.group_query || "").trim().toLowerCase();
      const availableGroups = (state.groups || []).filter((group) => {
        if (selectedGroupIds.includes(Number(group.id))) return false;
        if (!groupQuery) return true;
        const haystack = `${group.title} ${group.tg_group_id}`.toLowerCase();
        return haystack.includes(groupQuery);
      });
      const values = draft.values || {};
      const entries = Object.values(state.cache.settingsSchema || {})
        .flat()
        .filter((entry) => (entry.category || "general") === "moderation");
      const statusScope = "moderation-settings-draft";
      return `
        <div class="stack">
          <div class="field">
            <label class="field-label">Choose Groups</label>
            ${renderSearchableMultiPicker({
              id: "moderation-settings-group-picker",
              searchPlaceholder: "Search groups",
              emptyLabel: groupQuery ? "No matching groups." : "No more groups available.",
              searchAction: "moderation-settings-group-query",
              searchValue: draft.group_query || "",
              selectedItems: selectedGroups.map((group) => ({
                id: group.id,
                label: `${group.title} · ${String(group.tg_group_id || "")}`,
              })),
              selectedAction: "select-moderation-settings-group",
              activeItemId: activeGroupId,
              emptySelectedLabel: "No groups selected.",
              options: availableGroups.map((group) => ({
                id: group.id,
                label: group.title,
                meta: String(group.tg_group_id || ""),
              })),
              addAction: "add-moderation-settings-group",
              removeAction: "remove-moderation-settings-group",
            })}
            <div class="field-hint">
              ${selectedGroups.length
                ? escapeHtml(`Editing ${((state.groups || []).find((group) => Number(group.id) === activeGroupId) || selectedGroups[0] || {}).title || "selected group"} settings from the database.`)
                : "Select at least one group to edit moderation settings."}
            </div>
          </div>
          ${selectedGroupIds.length && entries.length
            ? renderSettingsEntriesMarkup({
                entries,
                values,
                groupId: activeGroupId || 0,
                statusScope,
                settingMode: "draft",
              })
            : !selectedGroupIds.length
              ? emptyState("Select at least one group to edit moderation settings.")
            : emptyState("No moderation settings found.")}
          ${draft.error ? `<div class="field-error">${escapeHtml(draft.error)}</div>` : ""}
        </div>
      `;
    }

    function renderScraperView() {

      const listCard = sectionCard(

        t("scraperListSubtitle"),

            <div class="split-fields">
              <div class="field">

      return `
        <div class="view">
          <div class="stack">
            ${controlsCard}

        </div>

    function renderOwnerView() {
      if (!state.isOwner) return emptyState("Owner access is required.");
      const tab = state.ui.ownerTab;
      const stats = state.cache.ownerStats || {};
      const groups = (state.cache.ownerGroups || []).filter((group) => !state.ui.ownerGroupSearch || group.title.toLowerCase().includes(state.ui.ownerGroupSearch.toLowerCase()));
      const subscriptions = state.cache.ownerSubscriptions || [];
      const privateGate = state.cache.ownerPrivateAccessGate || { required_group_tg_ids: [], candidates: [] };
      const audit = (state.cache.ownerAudit || []).filter((item) => !state.ui.ownerAuditFilter || item.action === state.ui.ownerAuditFilter);
      const groupsPage = paginateItems("owner-groups", groups, 8);
      const botGatePage = paginateItems("owner-bot-gate", privateGate.candidates || [], 10);
      const subscriptionsPage = paginateItems("owner-subscriptions", subscriptions, 10);
      const auditPage = paginateItems("owner-audit", audit, 20);
      let body = "";

      if (tab === "overview" || tab === "stats") {
        body = `
          <div class="stack">
            <div class="grid-4">
              ${statCard("Total Groups", formatNumber(stats.total_groups || 0), "Platform total")}
              ${statCard("Active Groups", formatNumber(stats.active_groups || 0), "Serving traffic")}
              ${statCard("Tracked Users", formatNumber(stats.tracked_admins || 0), "Admins")}
              ${statCard("Pending Subscriptions", formatNumber(subscriptions.filter((item) => item.status === "pending").length), "Needs review")}
            </div>
            ${sectionCard("Groups Registered Per Month", "Owner-level registration history.", ownerMonthChart(state.cache.ownerGroups || []), "", "Owner")}
          </div>
        `;
      } else if (tab === "groups") {
        body = sectionCard("Groups", "Managed groups across the platform.", `
          <div class="toolbar" style="margin-bottom:12px">
            <input class="search-input" type="search" value="${escapeHtml(state.ui.ownerGroupSearch)}" placeholder="Search groups" data-action="owner-group-search" />
          </div>
          <div class="table-wrap no-scroll">
            <table>
                <thead><tr><th>Group Name</th><th>Members</th><th>Status</th><th>Actions</th></tr></thead>
              <tbody>
                ${groupsPage.items.map((group) => `
                  <tr>
                    <td class="${group.is_active ? "" : "muted"}">${escapeHtml(group.title)}</td>
                    <td>${escapeHtml(group.admin_count || 0)}</td>
                    <td>${group.is_active ? `<span class="badge success">active</span>` : `<span class="badge">disabled</span>`}</td>
                    <td class="row-actions-cell">
                      ${rowActionsMarkup(`owner-group-${group.id}`, [
                        `<button class="row-action" type="button" data-action="owner-view-group" data-group-id="${group.id}">${escapeHtml(t("view"))}</button>`,
                        `<button class="row-action danger" type="button" data-action="owner-disable-group" data-group-id="${group.id}">${escapeHtml(t("disable"))}</button>`,
                        `<button class="row-action danger" type="button" data-action="owner-leave-group" data-group-id="${group.id}">${escapeHtml(t("forceLeave"))}</button>`,
                      ])}
                    </td>
                  </tr>
                `).join("") || `<tr><td colspan="4">${emptyState("No groups found.")}</td></tr>`}
              </tbody>
            </table>
          </div>
          ${paginationControls(groupsPage)}
        `, "", "Owner");
      } else if (tab === "bot_gate" || tab === "access_control") {
        body = sectionCard("Access Control", "Global bot access gate configuration.", `
          <div class="table-wrap no-scroll">
            <table>
              <thead><tr><th>${escapeHtml(t("groupName"))}</th><th>TG ID</th><th>${escapeHtml(t("status"))}</th><th>${escapeHtml(t("actions"))}</th></tr></thead>
              <tbody>
                ${botGatePage.items.map((group) => {
                  const selected = (privateGate.required_group_tg_ids || []).includes(group.tg_group_id);
                  return `
                    <tr>
                      <td>${escapeHtml(group.title)}</td>
                      <td class="mono">${escapeHtml(group.tg_group_id)}</td>
                      <td>${selected ? `<span class="badge success">${escapeHtml(t("required"))}</span>` : `<span class="badge">${escapeHtml(t("optional"))}</span>`}</td>
                      <td class="row-actions-cell">
                        ${rowActionsMarkup(`owner-bot-gate-${group.tg_group_id}`, [
                          `<button class="row-action" type="button" data-action="owner-toggle-bot-gate" data-tg-group-id="${group.tg_group_id}">${selected ? escapeHtml(t("cancel")) : escapeHtml(t("addGroup"))}</button>`,
                        ])}
                      </td>
                    </tr>
                  `;
                }).join("") || `<tr><td colspan="4">${emptyState(t("noBotGateGroups"))}</td></tr>`}
              </tbody>
            </table>
          </div>
          ${paginationControls(botGatePage)}
        `, "", "Owner");
      } else if (tab === "subscriptions" || tab === "billing") {
        body = sectionCard("Billing & Plans", "Subscription requests and plan management.", `
          <div class="table-wrap no-scroll">
            <table>
              <thead><tr><th>Requester</th><th>Group</th><th>Status</th><th>Actions</th></tr></thead>
              <tbody>
                ${subscriptionsPage.items.map((item) => `
                  <tr>
                    <td>${escapeHtml(item.full_name || item.username || item.tg_user_id)}</td>
                    <td>${escapeHtml(item.message || "General access request")}</td>
                    <td><span class="badge ${item.status === "approved" ? "success" : item.status === "pending" ? "warning" : ""}">${escapeHtml(t(item.status))}</span></td>
                    <td class="row-actions-cell">
                      ${rowActionsMarkup(`owner-subscription-${item.id}`, [
                        `<button class="row-action" type="button" data-action="owner-subscription" data-status="approved" data-request-id="${item.id}">${escapeHtml(t("approve"))}</button>`,
                        `<button class="row-action danger" type="button" data-action="owner-subscription" data-status="declined" data-request-id="${item.id}">${escapeHtml(t("decline"))}</button>`,
                        item.status === "approved" ? `<button class="row-action danger" type="button" data-action="owner-subscription" data-status="cancelled" data-request-id="${item.id}">${escapeHtml(t("cancelSubscription"))}</button>` : "",
                      ])}
                    </td>
                  </tr>
                `).join("") || `<tr><td colspan="4">${emptyState("No subscription requests.")}</td></tr>`}
              </tbody>
            </table>
          </div>
          ${paginationControls(subscriptionsPage)}
        `, "", "Owner");
      } else if (tab === "account_health") {
        var allAgents = [];
        Object.keys(state.cache.agents).forEach(function(k) { allAgents = allAgents.concat(state.cache.agents[k] || []); });
        var healthRows = allAgents.map(function(a) {
          var meta = a.metadata || {};
          return '<tr><td>@' + escapeHtml(meta.username || "Agent " + a.id) + '</td><td><span class="badge ' + (a.status === "active" ? "success" : "warning") + '">' + escapeHtml(a.status || "unknown") + '</span></td><td>' + escapeHtml(meta.last_active_at ? relativeTime(meta.last_active_at) : "never") + '</td><td>' + formatNumber(meta.jobs_count || 0) + '</td></tr>';
        }).join("");
        body = sectionCard("Account Health", "Connected agent account status overview.", '<table class="table"><thead><tr><th>Account</th><th>Status</th><th>Last Active</th><th>Jobs</th></tr></thead><tbody>' + (healthRows || '<tr><td colspan="4">' + emptyState("No connected accounts.") + '</td></tr>') + '</tbody></table>');
      } else if (tab === "scraping") {
        var scraperCount = Object.keys(state.cache.scraperList).length;
        body = sectionCard("Scraping Operations", "Scrape job overview across the platform.", '<div class="grid-4">' + statCard("Scraped Groups", formatNumber(scraperCount), "") + statCard("Active Jobs", "--", "") + statCard("Completed", "--", "") + statCard("Failed", "--", "") + '</div>');
      } else if (tab === "leads_growth") {
        body = sectionCard("Leads & Growth", "Aggregated lead generation metrics.", '<div class="grid-4">' + statCard("Total Leads", "--", "aggregate") + statCard("Converted", "--", "") + statCard("Conversion Rate", "--", "") + statCard("Active Sources", formatNumber(Object.keys(state.cache.scraperList).length), "") + '</div>');
      } else {
        body = sectionCard("Audit Log", "Chronological record of owner and system actions.", `
          <div class="toolbar" style="margin-bottom:12px">
            <select data-action="owner-audit-filter">
              <option value="">All actions</option>
              ${Array.from(new Set((state.cache.ownerAudit || []).map((item) => item.action))).map((action) => `<option value="${escapeHtml(action)}" ${state.ui.ownerAuditFilter === action ? "selected" : ""}>${escapeHtml(action)}</option>`).join("")}
            </select>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Timestamp</th><th>Actor</th><th>Action</th><th>Target</th><th>Detail</th><th class="row-actions-cell">${escapeHtml(t("actions"))}</th></tr></thead>
              <tbody>
                ${auditPage.items.map((item) => `
                  <tr>
                    <td>${escapeHtml(formatDateTime(item.created_at))}</td>
                    <td class="mono">${escapeHtml(item.actor_id)}</td>
                    <td>${escapeHtml(item.action)}</td>
                    <td>${escapeHtml(item.target_type + ":" + item.target_id)}</td>
                    <td>
                      ${state.ui.logJsonExpanded[item.id] ? `<div class="json-view">${escapeHtml(JSON.stringify(item.detail || {}, null, 2))}</div>` : ""}
                    </td>
                    <td class="row-actions-cell">
                      ${rowActionsMarkup(`owner-audit-${item.id}`, [
                        `<button class="row-action" type="button" data-action="toggle-audit-json" data-audit-id="${item.id}">${state.ui.logJsonExpanded[item.id] ? "Hide JSON" : "View JSON"}</button>`,
                      ])}
                    </td>
                  </tr>
                `).join("") || `<tr><td colspan="6">${emptyState("No audit entries.")}</td></tr>`}
              </tbody>
            </table>
          </div>
          ${paginationControls(auditPage)}
        `, "", "Owner");
      }

      return `
        <div class="view">
          <div class="tabs panel">
            ${[
              ["overview", "Platform Overview"],
              ["groups", "Groups & Sources"],
              ["account_health", "Account Health"],
              ["scraping", "Scraping Operations"],
              ["leads_growth", "Leads & Growth"],
              ["billing", "Billing & Plans"],
              ["access_control", "Access Control"],
              ["audit", "Audit Log"],
            ].map(([value, label]) => `
              <button class="tab-button ${tab === value ? "active" : ""}" type="button" data-action="select-owner-tab" data-tab="${value}">${escapeHtml(label)}</button>
            `).join("")}
          </div>
          ${body}
        </div>
      `;
