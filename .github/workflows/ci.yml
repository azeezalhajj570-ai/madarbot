name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Lint Python
        run: ruff check .

      - name: Run Python tests without Docker services
        run: pytest -m "not integration"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/miniapp-agents/package-lock.json

      - name: Install miniapp dependencies
        working-directory: apps/miniapp-agents
        run: npm ci

      - name: Build miniapp
        working-directory: apps/miniapp-agents
        run: npm run build
