name: madarbot tests

on:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: madarbot
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run ruff linter
        working-directory: madarbot
        run: ruff check bot/

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: madarbot
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run test suite
        working-directory: madarbot
        run: pytest -q

  frontend-builds:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app:
          - apps/miniapp-agents
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Install frontend dependencies
        working-directory: madarbot/${{ matrix.app }}
        run: npm ci
      - name: Build frontend
        working-directory: madarbot/${{ matrix.app }}
        run: npx vite build

  docker-builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build runtime images
        working-directory: madarbot
        run: |
          docker compose -f docker-compose.yml build
