name: madarbot tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run ruff linter
        run: ruff check .

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Check ruff formatting
        run: ruff format --check .

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run test suite
        run: pytest -q

  frontend-builds:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app:
          - apps/miniapp-agents
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Install frontend dependencies
        working-directory: ${{ matrix.app }}
        run: npm ci
      - name: Build frontend
        working-directory: ${{ matrix.app }}
        run: npx vite build

  docker-compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate docker compose config
        run: docker compose config

  docker-builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build runtime images
        run: |
          docker compose -f docker-compose.yml build
