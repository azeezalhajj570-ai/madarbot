server {
    server_name voice.dev.hamedco.com;

    location / {
        proxy_pass https://127.0.0.1:5114;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl;

    ssl_certificate /etc/letsencrypt/live/voice.dev.hamedco.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voice.dev.hamedco.com/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name voice.dev.hamedco.com;
    return 301 https://$host$request_uri;
}
