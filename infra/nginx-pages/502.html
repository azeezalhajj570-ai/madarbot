<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>Service Unavailable — MadarBot</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist-sans/style.css">
<style>
:root{--bg:#0a0a0a;--surface:#141414;--border:rgba(255,255,255,0.06);--text-primary:#f5f5f5;--text-secondary:#a0a0a0;--text-muted:#6b6b6b;--accent:#635bff;--accent-dim:rgba(99,91,255,0.1);--red:#ef4444;--red-dim:rgba(239,68,68,0.08)}*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);color:var(--text-primary);font-family:'Geist Sans',system-ui,-apple-system,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased;line-height:1.6}.container{text-align:center;max-width:520px;padding:48px 32px}.status-badge{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;background:var(--red-dim);border:1px solid rgba(239,68,68,0.15);border-radius:999px;font-size:13px;font-weight:500;color:var(--red);margin-bottom:24px}.status-badge::before{content:"";width:8px;height:8px;background:var(--red);border-radius:50%;animation:pulse 2s infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}h1{font-size:28px;font-weight:700;letter-spacing:-.5px;margin-bottom:12px}p{color:var(--text-secondary);font-size:14px;margin-bottom:8px}.sub{color:var(--text-muted);font-size:13px;margin-bottom:32px}.code{font-family:'Geist Mono',monospace;font-size:12px;color:var(--text-muted);background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:10px 16px;margin:24px auto;display:inline-block}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:500;text-decoration:none;cursor:pointer;transition:all .15s;font-family:inherit;border:none}.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{opacity:.9}.btn-secondary{background:var(--surface);border:1px solid var(--border);color:var(--text-secondary)}.btn-secondary:hover{border-color:rgba(255,255,255,0.15);color:var(--text-primary)}.footer{margin-top:48px;font-size:12px;color:var(--text-muted)}
</style>
</head>
<body>
<div class="container">
<div class="status-badge">502 Bad Gateway</div>
<h1>Service Temporarily Unavailable</h1>
<p>MadarBot is currently restarting or experiencing a brief interruption.</p>
<p class="sub">This usually resolves within a minute. The platform will be back shortly.</p>
<div class="code">Error: 502 Bad Gateway | Nginx: <span style="color:#22c55e">&#x2713; Running</span></div>
<div class="actions">
<button class="btn btn-primary" onclick="location.reload()">Try Again</button>
<a href="/docs" class="btn btn-secondary">Documentation</a>
</div>
<div class="footer"><span id="time"></span> · MadarBot</div>
</div>
<script>
document.getElementById("time").textContent=new Date().toLocaleString();
setTimeout(function(){location.reload()},15000);
</script>
</body>
</html>
