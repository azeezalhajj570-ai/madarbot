        content = memberSearchStatusMarkup("Search unavailable");
      } else if (normalizedState === "empty") {
        content = memberSearchStatusMarkup("No members found");
      }

      return `<div class="table-wrap member-search-results ${memberSearchStateClass(normalizedState)}">${content}</div>`;
    }

    function stringifyJobResult(job) {
      try {
        return JSON.stringify(job.job_payload || {}, null, 2);
      } catch (_error) {
        return String(job.job_payload || "");
      }
    }

    function agentJobsDrawerBody({ jobs = [], agentId = 0, stateName = "ready", errorMessage = "", filterValue = "", filterOptions = [] } = {}) {
      const normalizedState = String(stateName || "ready").trim().toLowerCase();
      let content = `
        <div class="stack">
          <div class="toolbar">
            <div class="toolbar-group">
              ${renderSearchableSelect({
                id: `agent-jobs-filter-${agentId}`,
                value: String(filterValue || ""),
                options: [{ value: "", label: "All task types", meta: "" }].concat(
                  filterOptions.map((jobType) => ({ value: String(jobType), label: String(jobType), meta: "job type" }))
                ),
                placeholder: "Filter by task type",
                searchPlaceholder: "Search task types",
                emptyLabel: "No matching task types.",
                selectAction: "filter-agent-jobs",
              })}
            </div>
          </div>
          <div class="table-wrap">
          <table>
            <thead><tr><th>Job ID</th><th>Type</th><th>Status</th><th>Created</th><th>Result</th><th class="row-actions-cell">${escapeHtml(t("actions"))}</th></tr></thead>
            <tbody>
              ${jobs.map((job) => `
                <tr>
                  <td class="mono">${escapeHtml(job.id)}</td>
                  <td>${escapeHtml(job.job_type)}</td>
                  <td>${escapeHtml(job.status)}</td>
                  <td>${escapeHtml(job.created_at ? relativeTime(job.created_at) : "Recent")}</td>
                  <td class="mono">${escapeHtml(truncate(stringifyJobResult(job), 140))}</td>
                  <td class="row-actions-cell">
                    ${rowActionsMarkup(`agent-job-${agentId}-${job.id}`, [
                      `<button class="row-action" type="button" data-action="view-job-result" data-agent-id="${agentId}" data-job-id="${escapeHtml(String(job.id || ""))}">View Result</button>`,
                      job.status !== "running" && job.status !== "completed"
                        ? `<button class="row-action" type="button" data-action="run-agent-job" data-agent-id="${agentId}" data-job-id="${escapeHtml(String(job.id || ""))}" data-job-type="${escapeHtml(String(job.job_type || ""))}">${escapeHtml(t("queueRunJob"))}</button>`
                        : "",
                      job.status !== "running" && job.status !== "completed" && job.status !== "aborted"
                        ? `<button class="row-action danger" type="button" data-action="abort-agent-job" data-agent-id="${agentId}" data-job-id="${escapeHtml(String(job.id || ""))}" data-job-type="${escapeHtml(String(job.job_type || ""))}">${escapeHtml(t("queueAbortJob"))}</button>`
                        : "",
                    ])}
                  </td>
                </tr>
              `).join("") || `<tr><td colspan="6">${emptyState("No jobs found.")}</td></tr>`}
            </tbody>
          </table>
        </div>
        </div>
      `;

      if (normalizedState === "loading") {
        content = memberSearchStatusMarkup("Loading jobs", true);
      } else if (normalizedState === "error") {
        content = memberSearchStatusMarkup(errorMessage || "Jobs unavailable");
      }

      return content;
    }

    async function refreshQuickActionLookup(force = false) {
      const draft = state.ui.quickActionDraft;
      if (!draft || !draft.group_id) return;
      draft.loading = true;
      draft.error = "";
      renderQuickActionModal();
      try {
        draft.results = await loadMembersForGroup(draft.group_id, force);
      } catch (error) {
        draft.results = [];
        draft.error = error.message || t("noMembersFound");
      } finally {
        draft.loading = false;
        renderQuickActionModal();
      }
    }

    async function loadOverview(force = false) {
      if (!state.activeGroupId) return null;
      if (!force && state.cache.overview[state.activeGroupId]) return state.cache.overview[state.activeGroupId];
      const payload = await apiRequest(`/webapp/groups/${state.activeGroupId}/overview`);
      state.cache.overview[state.activeGroupId] = payload;
      return payload;
    }

    async function loadWarnings(force = false) {
      if (!state.activeGroupId) return [];
      if (!force && state.cache.warnings[state.activeGroupId]) return state.cache.warnings[state.activeGroupId];
      const payload = await apiRequest(`/webapp/groups/${state.activeGroupId}/moderation/warnings`);
      state.cache.warnings[state.activeGroupId] = payload;
      return payload;
    }

    async function loadLogs(force = false) {
      if (!state.activeGroupId) return [];
      if (!force && state.cache.logs[state.activeGroupId]) return state.cache.logs[state.activeGroupId];
      const payload = await apiRequest(`/webapp/groups/${state.activeGroupId}/logs`);
      state.cache.logs[state.activeGroupId] = payload;
      return payload;
    }

    function moderationActivityCacheKey() {
      return `${state.ui.moderationActivityGroup || "all"}:${state.ui.moderationActivityFamily || ""}`;
    }

    async function loadModerationActivity(force = false) {
      const cacheKey = moderationActivityCacheKey();
      if (!force && state.cache.moderationActivity[cacheKey]) return state.cache.moderationActivity[cacheKey];
      const params = new URLSearchParams();
      const groupId = Number(state.ui.moderationActivityGroup || 0);
      if (groupId) params.set("group_id", String(groupId));
      if (state.ui.moderationActivityFamily) params.set("family", String(state.ui.moderationActivityFamily));
      params.set("limit", "200");
      const payload = await apiRequest(`/webapp/moderation/activity?${params.toString()}`);
      state.cache.moderationActivity[cacheKey] = payload;
      return payload;
    }

    async function loadMembers(force = false) {
      return loadMembersForGroup(state.activeGroupId, force);
    }

    async function loadMembersForGroup(groupId, force = false) {
      if (!groupId) return [];
      if (!force && state.cache.members[groupId]) return state.cache.members[groupId];
      const payload = await apiRequest(`/webapp/groups/${groupId}/members`);
      state.cache.members[groupId] = payload;
      return payload;
    }

    function liveMemberSearchKey(groupId, query = "") {
      return `${Number(groupId || 0)}:${String(query || "").trim().toLowerCase()}`;
    }

    function mergeLiveMembers(groupId, members) {
      const bucket = state.cache.liveMemberDirectory[groupId] || {};
      for (const member of members || []) {
        bucket[Number(member.user_id)] = member;
      }
      state.cache.liveMemberDirectory[groupId] = bucket;
    }

    function liveMemberById(groupId, userId) {
      return (state.cache.liveMemberDirectory[groupId] || {})[Number(userId)] || null;
    }

    async function searchLiveMembersForGroup(groupId, query = "", force = false) {
      if (!groupId) return [];
      const normalizedQuery = String(query || "").trim();
      const cacheKey = liveMemberSearchKey(groupId, normalizedQuery);
      if (!force && state.cache.liveMemberSearch[cacheKey]) {
        return state.cache.liveMemberSearch[cacheKey];
      }
      const params = new URLSearchParams();
      if (normalizedQuery) params.set("q", normalizedQuery);
      params.set("limit", normalizedQuery ? "30" : "20");
      const payload = await apiRequest(`/webapp/groups/${groupId}/member-search?${params.toString()}`);
      state.cache.liveMemberSearch[cacheKey] = payload;
      mergeLiveMembers(groupId, payload);
      return payload;
    }

    async function loadSettings(force = false) {
      if (!state.cache.settingsSchema || force) {
        state.cache.settingsSchema = await apiRequest("/settings/schema");
      }
      if (state.activeGroupId && (!state.cache.settings[state.activeGroupId] || force)) {
        const payload = await apiRequest(`/webapp/groups/${state.activeGroupId}/settings`);
        state.cache.settings[state.activeGroupId] = payload.settings || {};
      }
      const gateGroupId = accessGateGroupId();
      if (gateGroupId && (!state.cache.accessGate[gateGroupId] || force)) {
        state.cache.accessGate[gateGroupId] = await apiRequest(`/webapp/groups/${gateGroupId}/access-gate`);
      }
      if (state.activeGroupId && (!state.cache.joinRequestSettings[state.activeGroupId] || force)) {
        state.cache.joinRequestSettings[state.activeGroupId] = await apiRequest(`/webapp/groups/${state.activeGroupId}/join-request-settings`);
      }
      if (state.activeGroupId && (!state.cache.joinRequests[state.activeGroupId] || force)) {
        state.cache.joinRequests[state.activeGroupId] = await apiRequest(`/webapp/groups/${state.activeGroupId}/join-requests`);
      }
    }

    async function loadJoinRequestSettings(groupId = state.activeGroupId, force = false) {
      const normalizedGroupId = Number(groupId || 0);
      if (!normalizedGroupId) return { group_id: 0, enabled: false, required_group_tg_ids: [] };
      if (!force && state.cache.joinRequestSettings[normalizedGroupId]) {
        return state.cache.joinRequestSettings[normalizedGroupId];
      }
      const payload = await apiRequest(`/webapp/groups/${normalizedGroupId}/join-request-settings`);
      state.cache.joinRequestSettings[normalizedGroupId] = payload;
      return payload;
    }

    async function loadJoinRequests(groupId = state.activeGroupId, force = false) {
      const normalizedGroupId = Number(groupId || 0);
      if (!normalizedGroupId) return { group_id: 0, pending_count: 0, items: [] };
      if (!force && state.cache.joinRequests[normalizedGroupId]) {
        return state.cache.joinRequests[normalizedGroupId];
      }
      const payload = await apiRequest(`/webapp/groups/${normalizedGroupId}/join-requests`);
      state.cache.joinRequests[normalizedGroupId] = payload;
      return payload;
    }

    async function loadSettingsForGroup(groupId, force = false) {
      const normalizedGroupId = Number(groupId || 0);
      if (!normalizedGroupId) return {};
      if (!state.cache.settingsSchema || force) {
        state.cache.settingsSchema = await apiRequest("/settings/schema");
      }
      if (!state.cache.settings[normalizedGroupId] || force) {
        const payload = await apiRequest(`/webapp/groups/${normalizedGroupId}/settings`);
        state.cache.settings[normalizedGroupId] = payload.settings || {};
      }
      return state.cache.settings[normalizedGroupId];
    }

    async function loadAutomation(force = false) {
      if (!state.cache.taskCatalog || force) {
        state.cache.taskCatalog = await apiRequest("/webapp/tasks/catalog");
      }
      if (state.activeGroupId && (!state.cache.tasks[state.activeGroupId] || force)) {
        state.cache.tasks[state.activeGroupId] = await apiRequest(`/webapp/groups/${state.activeGroupId}/tasks`);
      }
      if (state.activeGroupId && (!state.cache.scheduledMessages[state.activeGroupId] || force)) {
        state.cache.scheduledMessages[state.activeGroupId] = await apiRequest(`/webapp/groups/${state.activeGroupId}/scheduled-messages`);
      }
    }

    async function loadAgents(groupId = state.activeGroupId, force = false) {
      const normalizedGroupId = Number(groupId || 0);
      if (!normalizedGroupId) return [];
      if (!force && state.cache.agents[normalizedGroupId]) return state.cache.agents[normalizedGroupId];
      const payload = await apiRequest(`/webapp/agents?group_id=${normalizedGroupId}`);
      state.cache.agents[normalizedGroupId] = payload;
      return payload;
    }

    async function loadAgentGroups(agentId, force = false) {
      const normalizedAgentId = Number(agentId || 0);
      if (!normalizedAgentId) return [];
      if (!force && state.cache.agentGroups[normalizedAgentId]) {
        return state.cache.agentGroups[normalizedAgentId];
      }
      const payload = await apiRequest(`/webapp/agents/${normalizedAgentId}/groups`);
      state.cache.agentGroups[normalizedAgentId] = payload;
      return payload;
    }

    async function primeScraperAgentGroupCaches(force = false) {
      const agentIds = new Set([
        Number(state.ui.scraperDraft?.agent_id || 0),
        Number(state.ui.scraperListFilters?.agent_id || 0),
      ]);
      await Promise.all(
        Array.from(agentIds)
          .filter((agentId) => agentId > 0)
          .map((agentId) => loadAgentGroups(agentId, force))
      );
    }

    function selectedBulkMessageManagedGroupId() {
      const selectedAgentId = Number(state.ui.bulkMessageDraft.agent_id || 0);
      const selectedSourceGroupId = String(state.ui.bulkMessageDraft.source_group_id || "");
      if (!selectedAgentId || !selectedSourceGroupId) return "";
      const relatedGroups = state.cache.agentGroups[selectedAgentId] || [];
      const selectedGroup = relatedGroups.find((group) => String(group.tg_group_id || "") === selectedSourceGroupId);
      return String(selectedGroup && selectedGroup.id ? selectedGroup.id : "");
    }

    async function resolveAgentTaskGroup(tgGroupId, title) {
      const normalized = Number(tgGroupId || 0);
      if (!normalized) return null;
      try {
        const payload = await apiRequest("/webapp/groups/resolve", {
          method: "POST",
          body: JSON.stringify({
            tg_group_id: normalized,
            title: title || "",
          }),
        });
        return Number(payload.group_id || 0);
      } catch (error) {
        console.error("Failed to resolve agent group", error);
        pushToast("Unable to map that group for automation tasks yet.", "warning");
        return null;
      }
    }

    async function searchBulkMembers(force = false) {
      bulkSearchSeq += 1;
      const seq = bulkSearchSeq;
      if (bulkSearchController) {
        bulkSearchController.abort();
      }
      bulkSearchController = new AbortController();
      if (!state.ui.bulkMessageDraft.source_managed_group_id && state.ui.bulkMessageDraft.source_group_id) {
        state.ui.bulkMessageDraft.source_managed_group_id = selectedBulkMessageManagedGroupId();
      }
      const groupId = Number(state.ui.bulkMessageDraft.source_managed_group_id || 0);
      if (!groupId) return [];
      const normalizedQuery = String(state.ui.bulkMessageDraft.user_query || "").trim();
      const cacheKey = liveMemberSearchKey(groupId, normalizedQuery);
      if (!force && state.cache.liveMemberSearch[cacheKey]) {
        return state.cache.liveMemberSearch[cacheKey];
      }
      const params = new URLSearchParams();
      if (normalizedQuery) params.set("q", normalizedQuery);
      params.set("limit", normalizedQuery ? "100" : "200");
      const payload = await apiRequest(`/webapp/groups/${groupId}/stored-members?${params.toString()}`, {
        signal: bulkSearchController.signal,
      });
      if (seq !== bulkSearchSeq) return [];
      state.cache.liveMemberSearch[cacheKey] = payload;
      mergeLiveMembers(groupId, payload);
      return payload;
    }

    async function searchMembersToAdd(force = false) {
      bulkSearchSeq += 1;
      const seq = bulkSearchSeq;
      if (bulkSearchController) {
        bulkSearchController.abort();
      }
      bulkSearchController = new AbortController();
      const agentId = Number(state.ui.bulkAddMembersDraft.agent_id || 0);
      const groupId = Number(state.ui.bulkAddMembersDraft.source_group_id || 0);
      if (!agentId || !groupId) return [];
      const normalizedQuery = String(state.ui.bulkAddMembersDraft.user_query || "").trim();
      const cacheKey = liveMemberSearchKey(groupId, normalizedQuery);
      if (!force && state.cache.liveMemberSearch[cacheKey]) {
        return state.cache.liveMemberSearch[cacheKey];
      }
      const params = new URLSearchParams();
      params.set("tg_group_id", String(groupId));
      if (normalizedQuery) params.set("q", normalizedQuery);
      params.set("limit", normalizedQuery ? "30" : "20");
      const payload = await apiRequest(`/webapp/agents/${agentId}/member-search?${params.toString()}`, {
        signal: bulkSearchController.signal,
      });
      if (seq !== bulkSearchSeq) return [];
      state.cache.liveMemberSearch[cacheKey] = payload;
      mergeLiveMembers(groupId, payload);
      return payload;
    }

    async function loadOwner(force = false) {
      if (!state.isOwner) return;
      if (!state.cache.ownerStats || force) state.cache.ownerStats = await apiRequest("/webapp/owner/stats");
      if (!state.cache.ownerGroups || force) state.cache.ownerGroups = await apiRequest("/webapp/owner/groups");
      if (!state.cache.ownerSubscriptions || force) state.cache.ownerSubscriptions = await apiRequest("/webapp/owner/subscriptions");
      if (!state.cache.ownerPrivateAccessGate || force) state.cache.ownerPrivateAccessGate = await apiRequest("/webapp/owner/private-access-gate");
      if (!state.cache.ownerAudit || force) state.cache.ownerAudit = await apiRequest(`/webapp/owner/audit-log?limit=200&offset=0`);
    }

    async function loadScraper(force = false) {
      const group = activeGroup();
      const draft = ensureScraperDraft();
      if (group && !draft.tg_group_id && group.tg_group_id != null) {
        draft.tg_group_id = String(group.tg_group_id);
      }
      if (group) {
        await loadAgents(group.id, force);
      }
      await primeScraperAgentGroupCaches(force);
      const targetTgGroupId = currentScraperTargetGroupId();
      if (!targetTgGroupId) {
        state.cache.scraper[0] = [];
        return;
      }
      if (!force && state.cache.scraper[targetTgGroupId]) {
        return;
      }
      const groups = await apiRequest(`/webapp/scraper/groups?tg_group_id=${encodeURIComponent(String(targetTgGroupId))}`);
      state.cache.scraper[targetTgGroupId] = groups || [];
      const latestGroup = (groups || [])[0];
      if (!latestGroup) {
        state.cache.scraperMembers[targetTgGroupId] = { members: [], total: 0, page: 1, page_size: 20 };
        state.cache.scraperMessages[targetTgGroupId] = { messages: [], total: 0, page: 1, page_size: 20 };
        return;
      }
      const [membersPayload, messagesPayload] = await Promise.all([
        apiRequest(`/webapp/scraper/groups/${latestGroup.id}/members?page=1&page_size=20`),
        apiRequest(`/webapp/scraper/groups/${latestGroup.id}/messages?page=1&page_size=20`),
      ]);
      state.cache.scraperMembers[targetTgGroupId] = membersPayload;
      state.cache.scraperMessages[targetTgGroupId] = messagesPayload;
    }

    async function loadScraperList(force = false) {
      const filters = state.ui.scraperListFilters || {};
      const key = currentScraperListFilterKey();
      if (!force && state.cache.scraperList[key]) {
        return state.cache.scraperList[key];
      }
      const params = new URLSearchParams();
      if (filters.agent_id) params.set("agent_id", String(filters.agent_id));
      const path = params.size ? `/webapp/scraper/groups?${params.toString()}` : "/webapp/scraper/groups";
      const payload = await apiRequest(path);
      state.cache.scraperList[key] = payload || [];
      return state.cache.scraperList[key];
    }

    async function loadBotInstallGroups(force = false) {
      if (!force && state.cache.botInstallGroups) return state.cache.botInstallGroups;
      state.cache.botInstallGroups = await apiRequest("/webapp/bot/install-groups");
      return state.cache.botInstallGroups;
    }

    async function ensureRouteData() {
      if (state.route === "#/overview") {
        await Promise.all([loadOverview(), loadWarnings()]);
      } else if (state.route === "#/settings") {
        await loadSettings();
      } else if (state.route === "#/moderation") {
        await Promise.all([loadWarnings(), loadLogs(), loadMembers(), loadModerationActivity()]);
      } else if (state.route === "#/automation") {
        await Promise.all([loadAutomation(), loadAgents()]);
      } else if (state.route === "#/agents") {
        await loadAgents();
      } else if (state.route === "#/scraper") {
        await Promise.all([loadAgents(), primeScraperAgentGroupCaches(), loadScraper(), loadScraperList()]);
      } else if (state.route === "#/owner" && state.isOwner) {
        await loadOwner();
      }
    }

    function renderSettingsEntriesMarkup({ entries = [], values = {}, groupId = 0, statusScope = "", settingMode = "live" } = {}) {
      return entries.map((entry) => {
        const value = values[entry.key] ?? entry.default ?? (entry.type === "toggle" ? false : "");
        const status = state.ui.settingsStatus[settingStatusKey(entry.key, statusScope)];
        const settingAttrs = `data-setting-key="${escapeHtml(entry.key)}" data-setting-group-id="${escapeHtml(String(groupId || 0))}" data-setting-status-scope="${escapeHtml(statusScope)}" data-setting-mode="${escapeHtml(settingMode)}"`;
        let control = "";
        if (entry.type === "toggle") {
          control = `
            <div class="settings-control-inline">
              ${toggleButton(Boolean(value), `data-action="toggle-setting" ${settingAttrs}`)}
              <span class="${settingsStatusClass(status)}">${escapeHtml(settingsStatusLabel(status))}</span>
            </div>
          `;
        } else if (entry.type === "number") {
          if (typeof entry.min === "number" && typeof entry.max === "number") {
            control = `
              <div class="slider-row">
                <input type="range" min="${entry.min}" max="${entry.max}" value="${escapeHtml(value)}" ${settingAttrs} data-setting-type="range" />
                <input class="number-input" type="number" min="${entry.min}" max="${entry.max}" value="${escapeHtml(value)}" ${settingAttrs} data-setting-type="number" />
              </div>
            `;
          } else {
            control = `<input class="number-input" type="number" value="${escapeHtml(value)}" ${settingAttrs} data-setting-type="number" />`;
          }
        } else {
          control = `<input type="text" value="${escapeHtml(value)}" ${settingAttrs} data-setting-type="text" />`;
        }
        return `
          <div class="settings-row">
            <div>
              <div>${escapeHtml(entry.label_key || entry.key)}</div>
              <div class="field-hint mono">${escapeHtml(entry.key)}</div>
            </div>
            <div class="stack">
              ${control}
              ${entry.type === "toggle" ? "" : `<span class="${settingsStatusClass(status)}">${escapeHtml(settingsStatusLabel(status))}</span>`}
            </div>
          </div>
        `;
      }).join("");
    }

    function moderationSettingsModalBody() {
      const draft = state.ui.moderationSettingsDraft || {};
      const selectedGroupIds = Array.isArray(draft.group_ids) && draft.group_ids.length
        ? draft.group_ids.map((value) => Number(value)).filter((value) => value > 0)
        : [Number(state.activeGroupId || state.groups[0]?.id || 0)].filter((value) => value > 0);
      const activeGroupId = Number(draft.active_group_id || selectedGroupIds[0] || 0);
      const selectedGroups = (state.groups || []).filter((group) => selectedGroupIds.includes(Number(group.id)));
      const groupQuery = String(draft.group_query || "").trim().toLowerCase();
      const availableGroups = (state.groups || []).filter((group) => {
        if (selectedGroupIds.includes(Number(group.id))) return false;
        if (!groupQuery) return true;
        const haystack = `${group.title} ${group.tg_group_id}`.toLowerCase();
        return haystack.includes(groupQuery);
      });
      const values = draft.values || {};
      const entries = Object.values(state.cache.settingsSchema || {})
        .flat()
        .filter((entry) => (entry.category || "general") === "moderation");
      const statusScope = "moderation-settings-draft";
      return `
        <div class="stack">
          <div class="field">
            <label class="field-label">Choose Groups</label>
            ${renderSearchableMultiPicker({
              id: "moderation-settings-group-picker",
              searchPlaceholder: "Search groups",
              emptyLabel: groupQuery ? "No matching groups." : "No more groups available.",
              searchAction: "moderation-settings-group-query",
              searchValue: draft.group_query || "",
              selectedItems: selectedGroups.map((group) => ({
                id: group.id,
                label: `${group.title} · ${String(group.tg_group_id || "")}`,
              })),
              selectedAction: "select-moderation-settings-group",
              activeItemId: activeGroupId,
              emptySelectedLabel: "No groups selected.",
              options: availableGroups.map((group) => ({
                id: group.id,
                label: group.title,
                meta: String(group.tg_group_id || ""),
              })),
              addAction: "add-moderation-settings-group",
              removeAction: "remove-moderation-settings-group",
            })}
            <div class="field-hint">
              ${selectedGroups.length
                ? escapeHtml(`Editing ${((state.groups || []).find((group) => Number(group.id) === activeGroupId) || selectedGroups[0] || {}).title || "selected group"} settings from the database.`)
                : "Select at least one group to edit moderation settings."}
            </div>
          </div>
          ${selectedGroupIds.length && entries.length
            ? renderSettingsEntriesMarkup({
                entries,
                values,
                groupId: activeGroupId || 0,
                statusScope,
                settingMode: "draft",
              })
            : !selectedGroupIds.length
              ? emptyState("Select at least one group to edit moderation settings.")
            : emptyState("No moderation settings found.")}
          ${draft.error ? `<div class="field-error">${escapeHtml(draft.error)}</div>` : ""}
        </div>
      `;
    }

    async function rerenderDrawerPreservingInput(target) {
      if (!state.ui.drawerContext || typeof state.ui.drawerContext.rerender !== "function") {
        return;
      }
      const action = String(target?.dataset?.action || "");
      if (!action) {
        await state.ui.drawerContext.rerender();
        return;
      }
      const selectorParts = [`[data-action="${action}"]`];
      if (target.dataset.agentId) {
        selectorParts.push(`[data-agent-id="${target.dataset.agentId}"]`);
      }
      const selector = selectorParts.join("");
      const selectionStart = typeof target.selectionStart === "number" ? target.selectionStart : null;
      const selectionEnd = typeof target.selectionEnd === "number" ? target.selectionEnd : null;
      await state.ui.drawerContext.rerender();
      requestAnimationFrame(() => {
        const replacement = roots.drawer.querySelector(selector);
        if (!replacement) return;
        replacement.focus();
        if (selectionStart !== null && selectionEnd !== null && typeof replacement.setSelectionRange === "function") {
          replacement.setSelectionRange(selectionStart, selectionEnd);
        }
      });
    }

    function setSettingStatus(key, status, duration = 0, scope = "") {
      const statusKey = settingStatusKey(key, scope);
      state.ui.settingsStatus[statusKey] = status;
      rerenderSettingsSurfaces();
      if (settingStatusTimers.has(statusKey)) {
        clearTimeout(settingStatusTimers.get(statusKey));
        settingStatusTimers.delete(statusKey);
      }
      if (duration > 0) {
        const timer = window.setTimeout(() => {
          state.ui.settingsStatus[statusKey] = "";
          settingStatusTimers.delete(statusKey);
          rerenderSettingsSurfaces();
        }, duration);
        settingStatusTimers.set(statusKey, timer);
      }
    }

    function settingsStatusLabel(status) {
      if (status === "dirty") return "* Save changes";
      if (status === "error") return "Failed";
      if (status === "saved") return "Saved";
      return "";
    }

    function settingsStatusClass(status) {
      if (status === "dirty" || status === "error" || status === "saved") {
        return `saved-chip ${status} visible`;
      }
      return "saved-chip";
    }

    async function initializeModerationSettingsDraft(groupIds = []) {
      const normalizedGroupIds = Array.from(new Set(
        (Array.isArray(groupIds) && groupIds.length ? groupIds : [state.activeGroupId || state.groups[0]?.id || 0])
          .map((value) => Number(value))
          .filter((value) => value > 0)
      ));
      if (!normalizedGroupIds.length) {
        state.ui.moderationSettingsDraft = { group_ids: [], values: {}, error: "" };
        return;
      }
      await Promise.all(normalizedGroupIds.map((groupId) => loadSettingsForGroup(groupId)));
      const baseGroupId = normalizedGroupIds[0];
      const baseValues = { ...(state.cache.settings[baseGroupId] || {}) };
      const entries = Object.values(state.cache.settingsSchema || {})
        .flat()
        .filter((entry) => (entry.category || "general") === "moderation");
      const values = {};
      for (const entry of entries) {
        values[entry.key] = baseValues[entry.key] ?? entry.default ?? (entry.type === "toggle" ? false : "");
      }
      state.ui.moderationSettingsDraft = {
        group_ids: normalizedGroupIds,
        active_group_id: baseGroupId,
        group_query: "",
        values,
        error: "",
      };
    }

    function moderationDraftValuesForGroup(groupId) {
      const normalizedGroupId = Number(groupId || 0);
      const groupValues = normalizedGroupId ? { ...(state.cache.settings[normalizedGroupId] || {}) } : {};
      const entries = Object.values(state.cache.settingsSchema || {})
        .flat()
        .filter((entry) => (entry.category || "general") === "moderation");
      const values = {};
      for (const entry of entries) {
        values[entry.key] = groupValues[entry.key] ?? entry.default ?? (entry.type === "toggle" ? false : "");
      }
      return values;
    }

    function updateModerationSettingsDraftValue(key, value) {
      if (!state.ui.moderationSettingsDraft) return;
      const draft = state.ui.moderationSettingsDraft;
      draft.values = draft.values || {};
      draft.values[key] = value;
      draft.error = "";
      setSettingStatus(key, "dirty", 0, "moderation-settings-draft");
    }

    async function addModerationSettingsGroup(groupId) {
      const normalizedGroupId = Number(groupId || 0);
      if (!normalizedGroupId || !state.ui.moderationSettingsDraft) return;
      const draft = state.ui.moderationSettingsDraft;
      const current = new Set((draft.group_ids || []).map((value) => Number(value)).filter((value) => value > 0));
      if (current.has(normalizedGroupId)) return;
      await loadSettingsForGroup(normalizedGroupId);
      current.add(normalizedGroupId);
      draft.group_ids = Array.from(current);
      draft.active_group_id = normalizedGroupId;
      draft.values = moderationDraftValuesForGroup(normalizedGroupId);
      draft.group_query = "";
      draft.error = "";
    }

    function removeModerationSettingsGroup(groupId) {
      const normalizedGroupId = Number(groupId || 0);
      if (!normalizedGroupId || !state.ui.moderationSettingsDraft) return;
      const draft = state.ui.moderationSettingsDraft;
      draft.group_ids = (draft.group_ids || []).map((value) => Number(value)).filter((value) => value > 0 && value !== normalizedGroupId);
      if (Number(draft.active_group_id || 0) === normalizedGroupId) {
        const nextActiveGroupId = Number((draft.group_ids || [])[0] || 0);
        draft.active_group_id = nextActiveGroupId || null;
        draft.values = nextActiveGroupId ? moderationDraftValuesForGroup(nextActiveGroupId) : {};
      }
      draft.error = "";
    }

    async function selectModerationSettingsGroup(groupId) {
      const normalizedGroupId = Number(groupId || 0);
      if (!normalizedGroupId || !state.ui.moderationSettingsDraft) return;
      await loadSettingsForGroup(normalizedGroupId, true);
      const draft = state.ui.moderationSettingsDraft;
      draft.active_group_id = normalizedGroupId;
      draft.values = moderationDraftValuesForGroup(normalizedGroupId);
      draft.error = "";
    }

    async function saveModerationSettingsDraft() {
      const draft = state.ui.moderationSettingsDraft;
      if (!draft) return;
      const activeGroupId = Number(draft.active_group_id || 0);
      if (!activeGroupId) {
        draft.error = "Select a group.";
        renderModerationSettingsModal();
        return;
      }
      const payload = { ...(draft.values || {}) };
      const keys = Object.keys(payload);
      if (!keys.length) {
        closeModal();
        state.ui.moderationSettingsDraft = null;
        return;
      }
      draft.error = "";
      renderModerationSettingsModal();
      try {
        await apiRequest(`/webapp/groups/${activeGroupId}/settings`, {
          method: "PATCH",
          body: JSON.stringify({ settings: payload }),
        });
        state.cache.settings[activeGroupId] = {
          ...(state.cache.settings[activeGroupId] || {}),
          ...payload,
        };
        for (const key of keys) {
          setSettingStatus(key, "saved", 1500, "moderation-settings-draft");
        }
        state.ui.moderationSettingsDraft = null;
        closeModal();
        renderContent();
        pushToast("Moderation settings saved.", "success");
      } catch (error) {
        draft.error = error instanceof Error ? error.message : "Failed to save moderation settings.";
        for (const key of keys) {
          setSettingStatus(key, "error", 2500, "moderation-settings-draft");
        }
        renderModerationSettingsModal();
      }
    }

    function scheduleSettingSave(key, value, options = {}) {
      const groupId = Number(options.groupId || state.activeGroupId || 0);
      const scope = String(options.statusScope || "");
      const timerKey = settingStatusKey(key, `${groupId}:${scope}`);
      setSettingStatus(key, "dirty", 0, scope);
      if (settingTimers.has(timerKey)) {
        clearTimeout(settingTimers.get(timerKey));
      }
      settingTimers.set(timerKey, window.setTimeout(async () => {
        try {
          await apiRequest(`/webapp/groups/${groupId}/settings`, {
            method: "PATCH",
            body: JSON.stringify({ settings: { [key]: value } }),
          });
          state.cache.settings[groupId] = state.cache.settings[groupId] || {};
          state.cache.settings[groupId][key] = value;
          setSettingStatus(key, "saved", 2000, scope);
        } catch (_error) {
          setSettingStatus(key, "error", 3000, scope);
        }
      }, 600));
    }

    async function showAgentGroupMembers(agentId, tgGroupId, groupTitle = "", useCache = false) {
      const normalizedAgentId = Number(agentId || 0);
      const normalizedGroupId = Number(tgGroupId || 0);
      if (!normalizedAgentId || !normalizedGroupId) return;
      openDrawer({
        title: groupTitle ? `${groupTitle} Members` : `Group ${normalizedGroupId} Members`,
        subtitle: "Persisted members discovered from messages and refreshed from the selected agent account",
        body: agentGroupMembersDrawerBody({ stateName: "loading" }),
      });

      try {
        const cacheKey = `drawer:${normalizedAgentId}:${normalizedGroupId}`;
        let members = useCache && state.cache.liveMemberSearch[cacheKey]
          ? state.cache.liveMemberSearch[cacheKey]
          : null;
        if (!members) {
          const scrapedGroups = await apiRequest(`/webapp/scraper/groups?tg_group_id=${encodeURIComponent(String(normalizedGroupId))}`);
          const latestScrapedGroup = Array.isArray(scrapedGroups) ? scrapedGroups[0] : null;
          if (latestScrapedGroup && latestScrapedGroup.id) {
            const scrapedPayload = await apiRequest(
              `/webapp/scraper/groups/${latestScrapedGroup.id}/members?page=1&page_size=1000`
            );
            members = (scrapedPayload.members || []).map((member) => ({
              user_id: member.tg_user_id,
              username: member.username,
              full_name: member.full_name || [member.first_name, member.last_name].filter(Boolean).join(" ").trim() || null,
              role: member.role || "member",
              created_at: member.joined_date || member.scraped_at || null,
            }));
          }
        }
        if (!members) {
          const relatedGroups = state.cache.agentGroups[normalizedAgentId] || [];
          const managedGroup = relatedGroups.find((group) => Number(group.tg_group_id || 0) === normalizedGroupId);
          if (managedGroup && managedGroup.id) {
            const storedParams = new URLSearchParams();
            storedParams.set("limit", "200");
            members = await apiRequest(`/webapp/groups/${managedGroup.id}/stored-members?${storedParams.toString()}`);
          }
        }
        if (!members) {
          const params = new URLSearchParams();
          params.set("tg_group_id", String(normalizedGroupId));
          params.set("limit", "50");
          members = await apiRequest(`/webapp/agents/${normalizedAgentId}/member-search?${params.toString()}`);

      if (!(root instanceof HTMLElement)) return;
      const panel = searchableSelectPanel(root);
      if (!panel) return;
      const isHidden = panel.classList.contains("hidden");
      closeAllSearchableSelects(root);
      if (isHidden) {
        openSearchableSelect(root);
        const input = root.querySelector("[data-searchable-select-input]");
        if (input instanceof HTMLInputElement) {
          input.value = "";
          filterSearchableSelect(root, "");
          input.focus();
        }
      } else {
        closeSearchableSelect(root);
      }
    });

      const option = event.target.closest("[data-searchable-select-option]");
      if (option) {
        const root = option.closest("[data-searchable-select]");
        if (!(root instanceof HTMLElement)) return;
        const nativeSelect = root.querySelector(".searchable-select-native");
        if (!(nativeSelect instanceof HTMLSelectElement)) return;
        event.preventDefault();
        nativeSelect.value = String(option.dataset.value || "");
        syncSearchableSelect(root);
        nativeSelect.dispatchEvent(new Event("change", { bubbles: true }));
        nativeSelect.dispatchEvent(new Event("input", { bubbles: true }));
        closeSearchableSelect(root);
        return;
      }

      document.querySelectorAll("[data-searchable-select]").forEach((root) => {
        if (!(root instanceof HTMLElement) || root.dataset.inline === "true") return;
        if (!root.contains(event.target)) {
          closeSearchableSelect(root);
        }
      });
    });

      if (target instanceof HTMLInputElement && target.hasAttribute("data-searchable-select-input")) {

        if (!(root instanceof HTMLElement)) return;
        closeAllSearchableSelects(root);

        }
        const payload = {
          text: String(fd.get("text") || ""),
          schedule: String(fd.get("schedule") || ""),
          delete_after_seconds: fd.get("delete_after_seconds") ? Number(fd.get("delete_after_seconds")) : null,
        };
        await apiRequest(
          entryId
            ? `/webapp/groups/${targetGroupId}/scheduled-messages/${entryId}`
            : `/webapp/groups/${targetGroupId}/scheduled-messages`,
          {
            method: entryId ? "PATCH" : "POST",
            body: JSON.stringify(payload),
          }
        );
        closeModal();
        if (targetGroupId === state.activeGroupId) {
          await loadAutomation(true);
          renderContent();
        } else {
          await apiRequest(`/webapp/groups/${targetGroupId}/scheduled-messages`);
        }
        pushToast(`Scheduled message saved for ${targetType === "group" ? "group" : "user"}${targetUserId ? " " + targetUserId : ""}.`, "success");
      } else if (form.id === "agent-start-form") {
        const fd = new FormData(form);
        const groupId = Number(state.activeGroupId || 0);
        const phoneNumber = String(fd.get("phone_number") || "").trim();
        if (!groupId) {
          pushToast("Choose a group before linking an agent.", "warning");
          return;
        }
        if (!phoneNumber) {
          pushToast("Enter the agent phone number.", "warning");
          return;
        }
        const result = await apiRequest("/webapp/agents/auth/start", {
          method: "POST",
          body: JSON.stringify({
            group_id: groupId,
            phone_number: phoneNumber,
          }),
        });
        agentLinkModal(2, result.agent);
      } else if (form.id === "agent-code-form") {
        const fd = new FormData(form);
        const agentId = Number(fd.get("agent_id"));
        const result = await apiRequest(`/webapp/agents/${agentId}/auth/code`, {
          method: "POST",
          body: JSON.stringify({ code: String(fd.get("code") || "") }),
        });
        if (result.agent && result.agent.auth_state === "pending_2fa") {
          agentLinkModal(3, result.agent);
        } else {
          closeModal();
          await loadAgents(state.activeGroupId, true);
          agentLinkModal(4, result.agent);
        }
      } else if (form.id === "agent-password-form") {
        const fd = new FormData(form);
        const agentId = Number(fd.get("agent_id"));
        const result = await apiRequest(`/webapp/agents/${agentId}/auth/password`, {
          method: "POST",
          body: JSON.stringify({ password: String(fd.get("password") || "") }),
        });
        await loadAgents(state.activeGroupId, true);
        agentLinkModal(4, result.agent);
      } else if (form.id === "unlink-agent-form") {
        const fd = new FormData(form);
        const agentId = Number(fd.get("agent_id") || 0);
        if (!agentId) {
          pushToast("Agent not found.", "warning");
          return;
        }
        await apiRequest(`/webapp/agents/${agentId}`, { method: "DELETE" });
        closeModal();
        await loadAgents(state.activeGroupId, true);
        renderContent();
        pushToast("Agent unlinked.", "success");
      } else if (form.id === "owner-subscription-form") {
        const fd = new FormData(form);
        await apiRequest(`/webapp/owner/subscriptions/${fd.get("request_id")}`, {
          method: "POST",
          body: JSON.stringify({
            status: String(fd.get("status")),
            response: String(fd.get("response") || ""),
          }),
        });
        closeModal();
        await loadOwner(true);
        renderContent();
        pushToast("Subscription updated.", "success");
      } else if (form.id === "subscription-request-form") {
        const fd = new FormData(form);
        const response = await apiRequest("/webapp/subscription-request", {
          method: "POST",
          body: JSON.stringify({
            message: String(fd.get("message") || ""),
          }),
        });
        state.subscriptionGate.request = response && response.request ? response.request : null;
        renderContent();
        pushToast(t("subscriptionGateSent"), "success");
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        if (state.overlays.modal) closeModal();
        if (state.overlays.drawer) closeDrawer();
        if (state.ui.groupPopoverOpen) {
          state.ui.groupPopoverOpen = false;
          renderGroupPopover();
        }
      }
    });

    window.addEventListener("hashchange", async () => {
      const nextRoute = location.hash || "#/overview";
      if (nextRoute === "#/moderation") {
        location.hash = "#/overview";
        return;
      }
      if (nextRoute === "#/owner" && !state.isOwner) {
        location.hash = "#/overview";
        return;
      }
      state.route = nextRoute;
      await ensureRouteData();
      renderSidebar();
      renderTopbar();
      renderContent();
      renderBottomNav();
    });

    async function boot() {
      refreshTelegramInitData();
      await loadAuth();
      if (state.route === "#/moderation") {
        state.route = "#/overview";
        location.hash = state.route;
      }
      if (state.route === "#/owner" && !state.isOwner) {
        state.route = "#/overview";
        location.hash = state.route;
      }
      await ensureRouteData();
      renderSidebar();
      renderTopbar();
      renderContent();
      renderBottomNav();
      renderToasts();
    }

    boot().catch((error) => {
      console.error(error);
      state.sessionExpired = error.message === "Session expired";
      renderSidebar();
      renderTopbar();
      renderContent();
      renderBottomNav();
      if (!state.sessionExpired) {
        pushToast("Failed to load dashboard.", "danger");
      }
    });
  </script>
</body>
</html>
