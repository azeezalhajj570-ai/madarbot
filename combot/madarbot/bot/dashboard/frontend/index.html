<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  />
  <meta name="theme-color" content="#0a0a0a" />
  <title>Combot WebApp</title>
  <link
    rel="preconnect"
    href="https://cdn.jsdelivr.net"
  />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist-sans/style.css"
  />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist-mono/style.css"
  />
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0a0a;
      --surface: #111111;
      --surface-2: #151515;
      --surface-3: #161616;
      --border: #1f1f1f;
      --text: #ededed;
      --text-secondary: #888888;
      --text-muted: #444444;
      --accent: #5865f2;
      --accent-soft: rgba(88, 101, 242, 0.12);
      --danger: #e5484d;
      --success: #46a758;
      --warning: #f76b15;
      --sidebar-width: 240px;
      --header-height: 72px;
      --radius: 6px;
      --radius-sm: 4px;
      --shadow-focus: 0 0 0 1px var(--border);
      --font-ui: "Geist", ui-monospace, monospace;
      --font-mono: "Geist Mono", ui-monospace, monospace;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    body {
      overflow: hidden;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      background: none;
      border: 0;
      padding: 0;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .app {
      display: grid;
      grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(88, 101, 242, 0.08), transparent 28%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.01), transparent 20%),
        var(--bg);
    }

    .sidebar {
      border-inline-end: 1px solid var(--border);
      background: rgba(10, 10, 10, 0.96);
      padding: 20px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-height: 100vh;
    }

    html[dir="rtl"] .sidebar {
      order: 2;
      border-inline-end: 0;
      border-inline-start: 1px solid var(--border);
    }

    html[dir="rtl"] .main {
      order: 1;
    }

    .brand {
      display: grid;
      gap: 6px;
      padding: 8px 8px 12px;
    }

    .brand-mark {
      width: 28px;
      height: 28px;
      border: 1px solid var(--border);
      border-radius: 6px;
      display: inline-grid;
      place-items: center;
      color: var(--accent);
      background: linear-gradient(135deg, rgba(88, 101, 242, 0.1), rgba(88, 101, 242, 0.02));
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 0.08em;
    }

    .brand-title {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .brand-subtitle {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-secondary);
    }

    .group-selector {
      position: relative;
    }

    .group-trigger,
    .nav-item,
    .ghost-button,
    .panel-button,
    .list-item,
    .tab-button,
    .drawer-close,
    .icon-button {
      border: 1px solid transparent;
      transition:
        background-color 150ms ease,
        border-color 150ms ease,
        color 150ms ease,
        opacity 150ms ease,
        transform 150ms ease;
    }

    .group-trigger {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      border-radius: var(--radius);
      border-color: var(--border);
      background: var(--surface);
      text-align: start;
    }

    .group-trigger:hover,
    .nav-item:hover,
    .ghost-button:hover,
    .panel-button:hover,
    .list-item:hover,
    .tab-button:hover {
      background: var(--surface-3);
      color: var(--text);
    }

    .group-trigger-title {
      display: grid;
      gap: 2px;
      min-width: 0;
    }

    .group-trigger-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    .group-trigger-name {
      font-size: 13px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sidebar-divider {
      height: 1px;
      background: var(--border);
      margin: 4px 0;
    }

    .sidebar-nav,
    .bottom-nav {
      display: grid;
      gap: 4px;
    }

    .nav-item {
      min-height: 40px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-inline-start: 2px solid transparent;
      padding: 0 12px 0 10px;
      border-radius: 6px;
      color: var(--text-secondary);
      background: transparent;
    }

    .nav-item.active {
      border-inline-start-color: var(--accent);
      color: var(--text);
      background: rgba(88, 101, 242, 0.08);
    }

    .nav-label {
      flex: 1 1 auto;
      font-size: 13px;
      font-weight: 500;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 20px;
      padding: 2px 6px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface-2);
      font-size: 11px;
      color: var(--text-secondary);
      line-height: 1;
      font-family: var(--font-mono);
    }

    .badge.accent {
      color: var(--accent);
      background: rgba(88, 101, 242, 0.1);
      border-color: rgba(88, 101, 242, 0.32);
    }

    .badge.warning {
      color: var(--warning);
      background: rgba(247, 107, 21, 0.1);
      border-color: rgba(247, 107, 21, 0.32);
    }

    .badge.success {
      color: var(--success);
      background: rgba(70, 167, 88, 0.1);
      border-color: rgba(70, 167, 88, 0.32);
    }

    .badge.danger {
      color: var(--danger);
      background: rgba(229, 72, 77, 0.1);
      border-color: rgba(229, 72, 77, 0.32);
    }

    .sidebar-user {
      margin-top: auto;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      display: grid;
      gap: 4px;
    }

    .sidebar-user-name {
      font-size: 13px;
      font-weight: 600;
    }

    .sidebar-user-meta {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .language-toggle {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding-top: 4px;
    }

    .language-toggle.compact {
      padding-top: 0;
    }

    .language-chip {
      min-width: 36px;
      height: 28px;
      padding: 0 8px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-family: var(--font-mono);
    }

    .language-chip.active {
      color: var(--text);
      border-color: rgba(88, 101, 242, 0.4);
      background: rgba(88, 101, 242, 0.12);
    }

    .main {
      min-width: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .topbar {
      min-height: var(--header-height);
      padding: 20px 28px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-end;
      justify-content: flex-start;
      gap: 16px;
      background: rgba(10, 10, 10, 0.92);
      backdrop-filter: blur(12px);
    }

    html[dir="rtl"] .topbar {
      flex-direction: row-reverse;
    }

    .page-header {
      display: grid;
      gap: 6px;
      flex: 1 1 auto;
      min-width: 0;
    }

    .eyebrow {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    .page-title {
      font-size: 22px;
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: -0.02em;
    }

    .page-subtitle {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .page-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
      flex: 0 0 auto;
      margin-inline-start: auto;
    }

    html[dir="rtl"] .page-actions {
      justify-content: flex-start;
    }

    .content {
      flex: 1 1 auto;
      overflow: auto;
      overflow-x: hidden;
      padding: 24px 28px 96px;
    }

    .view {
      display: grid;
      gap: 24px;
      min-width: 0;
    }

    .panel,
    .stat-card,
    .table-wrap,
    .feed,
    .task-item,
    .agent-card,
    .popover,
    .empty-state,
    .session-screen {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .panel {
      padding: 16px;
      min-width: 0;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    html[dir="rtl"] .panel-header,
    html[dir="rtl"] .section-head,
    html[dir="rtl"] .toolbar {
      flex-direction: row-reverse;
    }

    .panel-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .section-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      min-width: 0;
      overflow: hidden;
    }

    .section-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding: 16px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.015), transparent);
    }

    .section-meta {
      display: grid;
      gap: 6px;
      min-width: 0;
    }

    .section-kicker {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    .section-subtitle {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .section-content {
      padding: 16px;
      min-width: 0;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      min-width: 0;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: minmax(0, 1.8fr) minmax(280px, 0.9fr);
      gap: 16px;
      min-width: 0;
    }

    .grid-2-equal {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      min-width: 0;
    }

    .stat-card {
      padding: 16px;
      display: grid;
      gap: 14px;
      min-height: 132px;
    }

    .stat-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    .stat-value {
      font-family: var(--font-mono);
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.03em;
    }

    .stat-trend {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .trend-up {
      color: var(--success);
    }

    .trend-down {
      color: var(--danger);
    }

    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      min-width: 0;
    }

    .stack {
      display: grid;
      gap: 12px;
    }

    .muted {
      color: var(--text-secondary);
    }

    .mono {
      font-family: var(--font-mono);
    }

    .hidden {
      display: none !important;
    }

    .icon {
      width: 16px;
      height: 16px;
      display: inline-block;
      flex: 0 0 auto;
      pointer-events: none;
    }

    .button,
    .ghost-button,
    .danger-button,
    .success-button {
      min-height: 36px;
      padding: 0 12px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      background: var(--surface-2);
    }

    .icon-button {
      width: 32px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text-secondary);
      flex: 0 0 auto;
    }

    .task-inline-button-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr) auto;
      gap: 8px;
      align-items: end;
    }

    .task-inline-button-actions {
      display: flex;
      gap: 6px;
      align-items: center;
      padding-bottom: 1px;
    }

    .button {
      background: var(--accent);
      border-color: rgba(88, 101, 242, 0.48);
      color: #ffffff;
    }

    .danger-button {
      background: rgba(229, 72, 77, 0.12);
      color: var(--danger);
      border-color: rgba(229, 72, 77, 0.32);
    }

    .success-button {
      background: rgba(70, 167, 88, 0.12);
      color: var(--success);
      border-color: rgba(70, 167, 88, 0.32);
    }

    .button:hover {
      background: #6570f3;
    }

    .ghost-button:hover,
    .icon-button:hover,
    .danger-button:hover,
    .success-button:hover {
      background: var(--surface-3);
    }

    .button:focus-visible,
    .ghost-button:focus-visible,
    .icon-button:focus-visible,
    .danger-button:focus-visible,
    .success-button:focus-visible,
    .nav-item:focus-visible,
    .group-trigger:focus-visible,
    .field input:focus-visible,
    .field textarea:focus-visible,
    .field select:focus-visible,
    .search-input:focus-visible,
    .searchable-select-trigger:focus-visible,
    .searchable-select-search:focus-visible {
      outline: none;
      box-shadow: 0 0 0 1px var(--accent);
      border-color: var(--accent);
    }

    .search-input,
    .field input,
    .field textarea,
    .field select,
    .number-input {
      width: 100%;
      background: #0f0f0f;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      min-height: 38px;
      padding: 0 12px;
      color: var(--text);
    }

    .searchable-select {
      position: relative;
      display: grid;
      gap: 8px;
      min-width: 0;
    }

    .searchable-select-native {
      display: none !important;
    }

    .searchable-select-trigger,
    .searchable-select-search {
      width: 100%;
      min-height: 38px;
      padding: 0 12px;
      background: #0f0f0f;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 13px;
      text-align: start;
    }

    .searchable-select-trigger {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .searchable-select-search {
      padding-inline-end: 36px;
    }

    .searchable-select-trigger[disabled],
    .searchable-select-search[disabled] {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .searchable-select-trigger-text {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .searchable-select-trigger-icon {
      color: var(--text-muted);
      flex: 0 0 auto;
      font-size: 12px;
    }

    .searchable-select-panel {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      overflow: hidden;
      min-width: 0;
    }

    .searchable-select-panel.hidden {
      display: none;
    }

    .searchable-select-search-wrap {
      padding: 8px;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.01);
    }

    .searchable-select-options {
      display: grid;
      gap: 0;
      max-height: 240px;
      overflow: auto;
    }

    .searchable-select-option {
      width: 100%;
      min-height: 42px;
      padding: 10px 12px;
      border: 0;
      border-bottom: 1px solid var(--border);
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      text-align: start;
      color: var(--text);
    }

    .searchable-select-option:last-child {
      border-bottom: 0;
    }

    .searchable-select-option:hover {
      background: var(--surface-3);
    }

    .searchable-select-option.active {
      background: rgba(88, 101, 242, 0.08);
    }

    .searchable-select-option-copy {
      display: grid;
      gap: 2px;
      min-width: 0;
    }

    .searchable-select-option-title,
    .searchable-select-option-meta {
      min-width: 0;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .searchable-select-option-meta {
      font-size: 12px;
      color: var(--text-muted);
    }

    .searchable-select-empty {
      padding: 12px;
      color: var(--text-muted);
      font-size: 12px;
    }

    .field textarea {
      min-height: 96px;
      padding: 10px 12px;
      resize: vertical;
    }

    .search-input::placeholder,
    .field input::placeholder,
    .field textarea::placeholder {
      color: var(--text-muted);
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field-label {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .field-hint {
      font-size: 12px;
      color: var(--text-muted);
    }

    .field-error {
      font-size: 12px;
      color: var(--danger);
    }

    .table-wrap {
      overflow-x: auto;
      overflow-y: hidden;
      max-width: 100%;
    }

    .table-wrap.no-scroll {
      overflow: visible;
    }

    .table-wrap.no-scroll table {
      min-width: 0;
      table-layout: fixed;
    }

    .table-wrap.no-scroll th,
    .table-wrap.no-scroll td {
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .table-wrap.row-actions-safe {
      padding-bottom: 96px;
    }

    table {
      width: 100%;
      min-width: 640px;
      border-collapse: collapse;
    }

    thead th {
      background: #101010;
      border-bottom: 1px solid var(--border);
      padding: 12px 14px;
      text-align: start;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      font-weight: 600;
    }

    tbody td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      vertical-align: top;
    }

    tbody tr:last-child td {
      border-bottom: 0;
    }

    tbody tr:hover {
      background: rgba(255, 255, 255, 0.015);
    }

    .row-actions-cell {
      text-align: end;
      vertical-align: middle;
      white-space: nowrap;
    }

    .row-actions {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
      opacity: 1;
      transition: opacity 150ms ease;
    }

    .row-actions-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--text-secondary);
    }

    .row-actions-toggle:hover,
    .row-actions-toggle:focus-visible,
    .row-actions.is-open .row-actions-toggle {
      color: var(--text);
      background: var(--surface-3);
      border-color: var(--accent);
    }

    .row-actions-menu {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      z-index: 20;
      min-width: 168px;
      padding: 6px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(17, 17, 17, 0.98);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      display: grid;
      gap: 2px;
    }

    .row-action {
      min-height: 36px;
      width: 100%;
      padding: 8px 10px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      color: var(--text-secondary);
      font-size: 12px;
      line-height: 1.4;
      text-align: left;
    }

    .row-action:hover,
    .row-action:focus-visible {
      color: var(--text);
      background: var(--surface-3);
    }

    .row-action.danger {
      color: var(--danger);
    }

    @media (pointer: fine) {
      .row-actions {
        opacity: 0.4;
      }

      tr:hover .row-actions,
      tr:focus-within .row-actions {
        opacity: 1;
      }
    }

    @media (pointer: coarse) {
      .row-actions {
        opacity: 1;
      }
    }

    .feed {
      overflow: hidden;
    }

    .feed-row,
    .settings-row,
    .task-item,
    .list-item,
    .agent-card {
      border-bottom: 1px solid var(--border);
    }

    .feed-row:last-child,
    .settings-row:last-child,
    .task-item:last-child,
    .list-item:last-child,
    .agent-card:last-child {
      border-bottom: 0;
    }

    .feed-row,
    .settings-row,
    .list-item {
      padding: 14px 16px;
    }

    .feed-meta,
    .inline-meta {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .quick-actions {
      display: grid;
      gap: 10px;
    }

    .quick-action {
      width: 100%;
      justify-content: flex-start;
    }

    .split-layout {
      display: grid;
      grid-template-columns: 200px minmax(0, 1fr);
      gap: 16px;
      min-width: 0;
    }

    .category-list,
    .tabs,
    .subtabs {
      display: grid;
      gap: 4px;
    }

    .category-button,
    .tab-button {
      min-height: 40px;
      padding: 0 12px;
      border-inline-start: 2px solid transparent;
      color: var(--text-secondary);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: transparent;
      border-top: 1px solid transparent;
      border-inline-end: 1px solid transparent;
      border-bottom: 1px solid transparent;
    }

    .category-button.active,
    .tab-button.active {
      color: var(--text);
      border-inline-start-color: var(--accent);
      background: rgba(88, 101, 242, 0.08);
    }

    .settings-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(220px, 320px);
      gap: 16px;
      align-items: center;
    }

    .toggle {
      position: relative;
      width: 44px;
      height: 24px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #0d0d0d;
      display: inline-flex;
      align-items: center;
      padding: 2px;
    }

    .toggle::after {
      content: "";
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--text-muted);
      transition: transform 150ms ease, background-color 150ms ease;
    }

    .toggle.active {
      background: rgba(88, 101, 242, 0.18);
      border-color: rgba(88, 101, 242, 0.4);
    }

    .toggle.active::after {
      background: var(--accent);
      transform: translateX(20px);
    }

    .slider-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 92px;
      gap: 8px;
      align-items: center;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    .saved-chip {
      font-size: 13px;
      color: var(--success);
      opacity: 0;
      transition: opacity 180ms ease;
      white-space: nowrap;
    }

    .saved-chip.visible {
      opacity: 1;
    }

    .saved-chip.error {
      color: var(--danger);
    }

    .saved-chip.dirty {
      color: var(--text-muted);
    }

    .settings-control-inline {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .gate-form {
      display: grid;
      gap: 12px;
    }

    .gate-inline-form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: end;
    }

    .gate-list {
      display: grid;
      gap: 10px;
    }

    .gate-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #0d0d0d;
      min-width: 0;
    }

    .gate-row-copy {
      display: grid;
      gap: 4px;
      min-width: 0;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .toolbar-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      min-width: 0;
    }

    .task-item,
    .agent-card {
      padding: 16px;
      display: grid;
      gap: 10px;
      background: var(--surface);
      min-width: 0;
    }

    .agents-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
      min-width: 0;
    }

    .agent-card .mono,
    .agent-card .inline-meta,
    .agent-card .muted {
      min-width: 0;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .automation-layout {
      display: grid;
      grid-template-columns: minmax(320px, 1.1fr) minmax(340px, 0.95fr);
      gap: 16px;
      align-items: start;
      min-width: 0;
    }

    .automation-column,
    .automation-sidebar {
      display: grid;
      gap: 16px;
      min-width: 0;
    }

    .automation-sidebar {

    }

    .automation-surface {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.015), transparent 32px),

      overflow: hidden;
    }

    .automation-surface > .panel-header,
    .automation-surface > .panel,

      min-width: 0;
    }

    .automation-section {
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }

    .automation-section:last-child {
      border-bottom: 0;
    }

    .automation-surface-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 16px;
    }

    .automation-header-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    .automation-kicker {
      font-size: 11px;
      text-transform: uppercase;

      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .automation-empty {
      padding: 24px 16px;
      text-align: center;
      color: var(--text-secondary);
    }

    .task-list {
      display: grid;
      gap: 0;
    }

    .task-item {
      width: 100%;
      border: 0;
      border-radius: 0;
      text-align: start;
      padding: 14px 16px;
      background:
        linear-gradient(90deg, rgba(88, 101, 242, 0), rgba(88, 101, 242, 0)),
        var(--surface);
    }

    .task-item.active {
      background:
        linear-gradient(90deg, rgba(88, 101, 242, 0.12), rgba(88, 101, 242, 0.03)),
        var(--surface);
    }

    .task-item:hover {
      background:
        linear-gradient(90deg, rgba(255, 255, 255, 0.035), rgba(255, 255, 255, 0.01)),

    }

    .task-item-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-width: 0;
    }

    html[dir="rtl"] .task-item-title {
      flex-direction: row-reverse;
    }

    .task-item-body {
      display: grid;
      gap: 8px;
      min-width: 0;
    }

    .task-item .mono {
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .task-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      color: var(--text-secondary);
      font-size: 12px;
      min-width: 0;
    }

    .task-editor {
      padding: 0;
      min-width: 0;
    }

    .task-editor .panel-header {
      padding: 16px;
      margin: 0;
      border-bottom: 1px solid var(--border);
    }

    .task-editor-form {
      padding: 16px;
      display: grid;
      gap: 14px;
    }

    .split-fields {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .multi-select-shell {
      display: grid;
      gap: 8px;
      min-width: 0;
    }

    .multi-select-list {
      display: grid;
      gap: 8px;
      max-height: 220px;
      overflow: auto;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: rgba(17, 17, 17, 0.72);
    }

    .member-search-results.is-idle,
    .member-search-results.is-loading,

    .member-search-results.is-error {
      align-items: center;
      justify-content: center;
    }

    .member-search-status {

      display: inline-flex;

      color: var(--text-muted);
      text-align: center;
    }

    .member-search-results.is-error .member-search-status {
      color: var(--danger);
    }

    .member-search-spinner {
      width: 16px;
      height: 16px;
      border: 2px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;

      flex: 0 0 auto;
    }

    @keyframes member-search-spin {
      to {

      flex-wrap: wrap;

      align-items: center;
      gap: 6px;
      min-height: 28px;
      padding: 0 10px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: #161616;
      font-size: 12px;
      min-width: 0;
    }

    .multi-select-chip.active {
      border-color: rgba(88, 101, 242, 0.48);
      background: rgba(88, 101, 242, 0.14);
    }

    .multi-select-chip-label {
      border: 0;
      background: transparent;
      color: inherit;
      padding: 0;
      font: inherit;
      cursor: pointer;
      min-width: 0;
      text-align: start;
    }

    .chip-remove {
      border: 0;
      background: transparent;
      color: var(--text-secondary);
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .multi-select-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #141414;
      min-width: 0;
    }

    .multi-select-item-copy {
      display: grid;
      gap: 2px;
      min-width: 0;
    }

    .multi-select-empty {
      padding: 10px 12px;
      border: 1px dashed var(--border);
      border-radius: 6px;
      color: var(--text-muted);
      font-size: 12px;
    }

    @media (max-width: 767px) {
      .split-fields {
        grid-template-columns: 1fr;
      }
    }

    .scheduled-table td:last-child {
      width: 160px;
    }

    @media (max-width: 767px) {
      .scheduled-table td:last-child {
        width: auto;
      }
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      display: inline-block;
      background: var(--text-muted);
    }

    .status-dot.success {
      background: var(--success);
    }

    .status-dot.warning {
      background: var(--warning);
    }

    .status-dot.danger {
      background: var(--danger);
    }

    .status-dot.muted {
      background: #666666;
    }

    .popover {
      position: fixed;
      z-index: 40;
      width: min(360px, calc(100vw - 24px));
      padding: 12px;
      box-shadow: none;
    }

    .popover-list {
      max-height: 320px;
      overflow: auto;
      margin-top: 10px;
    }

    .modal-backdrop,
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 60;
    }

    .modal-backdrop {
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .modal {
      width: min(480px, 100%);
      max-height: calc(100vh - 48px);
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      transform: scale(1);
      opacity: 1;
      transition: opacity 150ms ease, transform 150ms ease;
      display: flex;
      flex-direction: column;
    }

    .modal.modal-wide {
      width: min(760px, 100%);
    }

    .modal-header,
    .modal-footer,
    .modal-body,
    .drawer-header,
    .drawer-body {
      padding: 16px;
    }

    .modal-header,
    .modal-footer,
    .drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--border);
    }

    .modal-header {
      min-height: 64px;
      flex: 0 0 auto;
    }

    .modal-body {
      flex: 1 1 auto;
      overflow-y: auto;
      max-height: calc(100vh - 180px);
      overscroll-behavior: contain;
      padding: 1rem;
    }

    .modal-footer {
      border-top: 1px solid var(--border);
      border-bottom: 0;
      justify-content: space-between;
      position: sticky;
      bottom: 0;
      background: var(--surface);
      flex: 0 0 auto;
    }

    html[dir="rtl"] .drawer-header {
      flex-direction: row-reverse;
    }

    .modal-footer-actions {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .modal-footer-start,
    .modal-footer-end {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .modal-footer-end {
      margin-inline-start: auto;
    }

    .drawer-backdrop {
      display: flex;
      justify-content: flex-end;
    }

    .drawer {
      width: min(720px, 100vw);
      height: 100vh;
      background: var(--surface);
      border-inline-start: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    .drawer-body {
      overflow: auto;
      flex: 1 1 auto;
    }

    .toast-stack {
      position: fixed;
      inset-inline-end: 16px;
      bottom: 16px;
      z-index: 70;
      display: grid;
      gap: 8px;
      width: min(360px, calc(100vw - 32px));
    }

    .toast {
      border: 1px solid var(--border);
      border-inline-start-width: 3px;
      border-radius: var(--radius);
      background: rgba(17, 17, 17, 0.96);
      padding: 12px 12px 12px 14px;
      font-size: 13px;
      color: var(--text);
    }

    .toast.neutral {
      border-inline-start-color: var(--text-secondary);
    }

    .toast.success {
      border-inline-start-color: var(--success);
    }

    .toast.warning {
      border-inline-start-color: var(--warning);
    }

    .toast.danger {
      border-inline-start-color: var(--danger);
    }

    .chart {
      display: flex;
      align-items: end;
      gap: 8px;
      min-height: 180px;
      padding-top: 16px;
    }

    .chart-bar {
      flex: 1 1 0;
      display: grid;
      gap: 8px;
      align-items: end;
      justify-items: center;
    }

    .chart-bar-fill {
      width: 100%;
      border: 1px solid rgba(88, 101, 242, 0.32);
      background: linear-gradient(180deg, rgba(88, 101, 242, 0.48), rgba(88, 101, 242, 0.12));
      min-height: 8px;
    }

    .chart-label {
      font-size: 11px;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }

    .json-toggle {
      color: var(--accent);
      font-size: 12px;
    }

    .json-view {
      margin-top: 8px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      background: #0d0d0d;
      border-radius: var(--radius);
      font-family: var(--font-mono);
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-word;
    }


    .session-screen {
      min-height: 320px;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 32px;
    }

    .empty-state {
      padding: 24px;
      text-align: center;
      color: var(--text-secondary);
    }

    .bottom-nav {
      position: fixed;
      inset-inline-start: 0;
      inset-inline-end: 0;
      bottom: 0;
      z-index: 20;
      grid-template-columns: repeat(var(--nav-count, 5), minmax(0, 1fr));
      gap: 0;
      border-top: 1px solid var(--border);
      background: rgba(10, 10, 10, 0.98);
      backdrop-filter: blur(12px);
      padding-bottom: env(safe-area-inset-bottom, 0);
    }

    .bottom-nav.drawer-open {
      transform: translateY(100%);
    }

    .bottom-nav .nav-item {
      min-height: 60px;
      justify-content: center;
      border-inline-start: 0;
      border-top: 2px solid transparent;
      border-radius: 0;
      padding: 0;
    }

    .bottom-nav .nav-label {
      display: none;
    }

    html[dir="rtl"] .drawer-backdrop {
      justify-content: flex-start;
    }

    @media (max-width: 1100px) {
      .grid-4,
      .grid-2-equal {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .grid-2 {
        grid-template-columns: 1fr;
      }

      .automation-layout {
        grid-template-columns: 1fr;
      }

      .automation-sidebar {
        position: static;
      }
    }

    @media (max-width: 767px) {
      body {
        overflow: auto;
      }

      .app {
        grid-template-columns: 1fr;
      }

      .sidebar {
        display: none;
      }

      .bottom-nav {
        display: grid !important;
      }

      .topbar {
        padding: 16px 16px 12px;
        min-height: auto;
        align-items: flex-start;
      }

      .content {
        padding: 16px 16px 92px;
      }

      .split-layout,
      .settings-row,
      .grid-4,
      .grid-2-equal {
        grid-template-columns: 1fr;
      }

      .table-wrap {
        margin-inline: -16px;
        padding-inline: 16px;
        border-radius: 0;
      }

      table {
        min-width: 560px;
      }

      .panel-header,
      .toolbar {
        align-items: flex-start;
      }

      .page-title {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <div id="app" class="app">
    <aside id="sidebar" class="sidebar"></aside>
    <div class="main">
      <header id="topbar" class="topbar"></header>
      <main id="content" class="content"></main>
    </div>
  </div>
  <nav id="bottom-nav" class="bottom-nav hidden"></nav>
  <div id="group-popover-root"></div>
  <div id="modal-root"></div>
  <div id="drawer-root"></div>
  <div id="toast-root"></div>
  <script>
    const APP_VERSION = "v2.0.0";
    const INIT_DATA_STORAGE_KEY = "combot.telegramInitData";
    const readLaunchParams = (source) => new URLSearchParams(String(source || "").replace(/^[?#]/, ""));
    const searchParams = readLaunchParams(window.location.search);
    const hashParams = readLaunchParams(window.location.hash);

    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    const queryInitData =
      searchParams.get("init_data") ||
      searchParams.get("tgWebAppData") ||
      hashParams.get("init_data") ||
      hashParams.get("tgWebAppData") ||
      "";
    let telegramInitData = tg
      ? (tg.initData || "")
      : (
          queryInitData ||
          window.sessionStorage.getItem(INIT_DATA_STORAGE_KEY) ||
          window.localStorage.getItem(INIT_DATA_STORAGE_KEY) ||
          ""
        );
    const DEV_MODE = searchParams.get("mock") === "1";

    function refreshTelegramInitData() {
      const nextValue = tg
        ? (
            tg.initData ||
            queryInitData ||
            window.sessionStorage.getItem(INIT_DATA_STORAGE_KEY) ||
            window.localStorage.getItem(INIT_DATA_STORAGE_KEY) ||
            ""
          )
        : (
            queryInitData ||
            window.sessionStorage.getItem(INIT_DATA_STORAGE_KEY) ||
            window.localStorage.getItem(INIT_DATA_STORAGE_KEY) ||
            ""
          );
      telegramInitData = nextValue;
      if (telegramInitData) {
        window.sessionStorage.setItem(INIT_DATA_STORAGE_KEY, telegramInitData);
        window.localStorage.setItem(INIT_DATA_STORAGE_KEY, telegramInitData);
      }
      return telegramInitData;
    }

    if (tg) {
      tg.ready();
      tg.expand();
      tg.setHeaderColor("#0a0a0a");
      tg.setBackgroundColor("#0a0a0a");
      refreshTelegramInitData();
    } else if (DEV_MODE) {
      console.warn("Telegram WebApp SDK unavailable. Running in explicit mock mode.");
    } else {
      console.warn("Telegram WebApp SDK unavailable. Using HTTP API mode with stored or query init data.");
    }

    const state = {
      user: null,
      groups: [],
      activeGroupId: Number(localStorage.getItem("combot.activeGroupId")) || null,
      route: location.hash || "#/overview",
      isOwner: false,
      sessionExpired: false,
      subscriptionGate: {
        active: false,
        request: null,
      },
      loading: {
        auth: false,
        page: false,
      },
      cache: {
        overview: {},
        settings: {},
        settingsSchema: null,
        accessGate: {},
        joinRequestSettings: {},
        joinRequests: {},
        scraper: {},
        scraperList: {},
        scraperMembers: {},
        scraperMessages: {},
        warnings: {},
        logs: {},
        moderationActivity: {},
        members: {},
        liveMemberSearch: {},
        liveMemberDirectory: {},
        taskCatalog: null,
        tasks: {},
        scheduledMessages: {},
        agents: {},
        agentGroups: {},
        agentJobs: {},
        botInstallGroups: null,
        ownerStats: null,
        ownerGroups: null,
        ownerSubscriptions: null,
        ownerPrivateAccessGate: null,
        ownerAudit: null,
      },
      ui: {
        groupPopoverOpen: false,
        groupQuery: "",
        moderationTab: "warnings",
        ownerTab: "stats",
        scraperDraft: {
          agent_id: "",
          tg_group_id: "",
          member_limit: "100",
          message_limit: "50",
        },
        scraperListFilters: {
          agent_id: "",
          tg_group_id: "",
        },
        settingsCategory: "",
        accessGateProtectedGroupId: null,
        settingsStatus: {},
        moderationSettingsDraft: null,
        automationSelection: null,
        automationFormMode: "edit",
        automationEditorOpen: false,

    function relativeTime(value) {
      if (!value) return "unknown";
      const diffMs = Date.now() - new Date(value).getTime();
      const diffMin = Math.round(diffMs / 60000);
      if (diffMin < 1) return "now";
      if (diffMin < 60) return diffMin + "m ago";
      const diffHours = Math.round(diffMin / 60);
      if (diffHours < 24) return diffHours + "h ago";
      const diffDays = Math.round(diffHours / 24);
      return diffDays + "d ago";

    function withInitData(path) {
      refreshTelegramInitData();
      if (!telegramInitData) return path;
      const url = new URL(path, window.location.origin);
      if (!url.searchParams.has("init_data")) {
        url.searchParams.set("init_data", telegramInitData);
      }
      return url.pathname + url.search;
    }

    function formatApiErrorDetail(detail) {
      if (typeof detail === "string" && detail.trim()) {
        return detail;
      }
      if (Array.isArray(detail) && detail.length) {
        return detail.map((item) => {
          if (typeof item === "string") {
            return item;
          }
          if (item && typeof item === "object") {
            const path = Array.isArray(item.loc) ? item.loc.join(".") : "";
            const message = typeof item.msg === "string" ? item.msg : JSON.stringify(item);
            return path ? `${path}: ${message}` : message;
          }
          return String(item);
        }).join("; ");
      }
      if (detail && typeof detail === "object") {
        try {
          return JSON.stringify(detail);
        } catch (_error) {
          return "Request failed";
        }
      }
      return "Request failed";
    }

    async function apiRequest(path, options = {}) {
      if (DEV_MODE) {
        return mockRequest(path, options);
      }

      let response;
      try {
        response = await fetch(withInitData(path), {
          ...options,
          headers: {
            "Content-Type": "application/json",
            "X-Telegram-Init-Data": telegramInitData,
            ...(options.headers || {}),
          },
        });
      } catch (error) {
        if (error && error.name === "AbortError") {
          throw error;
        }
        pushToast("Network error. Check your connection and try again.", "danger");
        throw error;
      }

      if (response.status === 401) {
        state.sessionExpired = true;
        renderContent();
        throw new Error("Session expired");
      }

      if (response.status === 403) {
        pushToast("You don't have permission for this action.", "warning");
      }

      if (!response.ok) {
        let detail = "Request failed";
        try {
          const payload = await response.json();
          detail = formatApiErrorDetail(payload.detail || detail);
        } catch (_error) {
          // ignore non-json responses
        }
        if (response.status >= 400 && response.status < 500 && response.status !== 401 && response.status !== 403) {
          pushToast(detail, "warning");
        } else if (response.status >= 500) {
          pushToast(detail, "danger");
        }
        const error = new Error(detail);
        error.status = response.status;
        throw error;
      }

      if (response.status === 204) {
        return null;
      }

      return response.json();
    }

        state.user = payload.user;
        state.groups = payload.groups || [];
        state.isOwner = Boolean(payload.is_bot_owner);

    function paginationWindow(page, totalPages, maxVisible = 5) {
      if (totalPages <= maxVisible) {
        return Array.from({ length: totalPages }, (_, index) => index);
      }
      const half = Math.floor(maxVisible / 2);
      let start = Math.max(0, page - half);
      let end = Math.min(totalPages, start + maxVisible);
      if (end - start < maxVisible) {
        start = Math.max(0, end - maxVisible);
      }
      return Array.from({ length: end - start }, (_, index) => start + index);
    }

    function paginateItems(key, items = [], pageSize = 10) {
      const normalizedItems = Array.isArray(items) ? items : [];
      const configuredPageSize = Number(state.ui.paginationSizes[key] || pageSize || 10);
      const safePageSize = Math.max(1, configuredPageSize);
      state.ui.paginationSizes[key] = safePageSize;
      const totalPages = Math.max(1, Math.ceil(normalizedItems.length / safePageSize));
      let page = Number(state.ui.pagination[key] || 0);
      if (!Number.isFinite(page) || page < 0) page = 0;
      if (page >= totalPages) page = totalPages - 1;
      state.ui.pagination[key] = page;
      return {
        key,
        page,
        pageSize: safePageSize,
        totalItems: normalizedItems.length,
        totalPages,
        items: normalizedItems.slice(page * safePageSize, page * safePageSize + safePageSize),
      };
    }

    function paginationControls({ key, page, totalPages, totalItems, renderTarget = "content" }) {
      if (!key || totalItems <= 0) return "";
      const pageSize = Number(state.ui.paginationSizes[key] || 10);
      const pageNumbers = paginationWindow(page, totalPages, 5);
      const start = totalItems ? (page * pageSize) + 1 : 0;
      const end = Math.min(totalItems, (page + 1) * pageSize);
      return `
        <div class="toolbar" style="margin-top:12px">
          <div class="muted">${escapeHtml(`${start}-${end} of ${totalItems}`)}</div>
          <div class="toolbar-group">
            <select data-action="change-page-size" data-pagination-key="${escapeHtml(key)}" data-pagination-render="${escapeHtml(renderTarget)}">
              ${[5, 10, 20, 50].map((size) => `
                <option value="${size}" ${size === pageSize ? "selected" : ""}>${size}/page</option>
              `).join("")}
            </select>
            <button class="ghost-button" type="button" data-action="paginate-prev" data-pagination-key="${escapeHtml(key)}" data-pagination-render="${escapeHtml(renderTarget)}" ${page === 0 ? "disabled" : ""}>${escapeHtml(t("prev"))}</button>
            ${pageNumbers.map((pageNumber) => `
              <button
                class="${pageNumber === page ? "button" : "ghost-button"}"
                type="button"
                data-action="paginate-page"
                data-pagination-key="${escapeHtml(key)}"
                data-pagination-page="${pageNumber}"
                data-pagination-render="${escapeHtml(renderTarget)}"
              >
                ${pageNumber + 1}
              </button>
            `).join("")}
            <button class="ghost-button" type="button" data-action="paginate-next" data-pagination-key="${escapeHtml(key)}" data-pagination-render="${escapeHtml(renderTarget)}" ${page >= totalPages - 1 ? "disabled" : ""}>${escapeHtml(t("next"))}</button>
          </div>
        </div>
      `;
    }

    function ownerMonthChart(groups) {
      const buckets = new Map();
      for (const group of groups || []) {
        const date = group.created_at ? new Date(group.created_at) : new Date();
        const key = date.getUTCFullYear() + "-" + String(date.getUTCMonth() + 1).padStart(2, "0");
        buckets.set(key, (buckets.get(key) || 0) + 1);
      }
      const entries = Array.from(buckets.entries()).sort((a, b) => a[0].localeCompare(b[0])).slice(-6);
      const max = Math.max(1, ...entries.map((entry) => entry[1]));
      return `
        <div class="chart">
          ${entries.map(([month, count]) => `
            <div class="chart-bar">
              <div class="chart-bar-fill" style="height:${Math.max(8, Math.round((count / max) * 140))}px"></div>
              <div class="chart-label">${escapeHtml(month.slice(5))}</div>
            </div>
          `).join("")}
        </div>
      `;
    }

    function normalizeReplyInlineButtons(value, { preserveEmpty = true } = {}) {
      if (!Array.isArray(value)) return [];
      return value
        .map((item) => ({
          text: String(item && item.text ? item.text : "").trim(),
          url: String(item && item.url ? item.url : "").trim(),
        }))
        .filter((item) => preserveEmpty || item.text || item.url);
    }

    function sanitizeReplyInlineButtons(value) {
      return normalizeReplyInlineButtons(value, { preserveEmpty: false });
    }

    function readReplyInlineButtonsFromForm(fd) {
      const texts = fd.getAll("config_inline_button_text").map((value) => String(value || "").trim());
      const urls = fd.getAll("config_inline_button_url").map((value) => String(value || "").trim());
      const size = Math.max(texts.length, urls.length);
      const buttons = [];
      for (let index = 0; index < size; index += 1) {
        const text = texts[index] || "";
        const url = urls[index] || "";
        if (!text && !url) continue;
        buttons.push({ text, url });
      }
      return buttons;
    }

    function rerenderAutomationTaskModalPreservingScroll() {
      const modalBody = roots.modal.querySelector(".modal-body");
      const scrollTop = modalBody ? modalBody.scrollTop : 0;
      renderAutomationTaskModal();
      if (scrollTop <= 0) return;
      window.requestAnimationFrame(() => {
        const nextModalBody = roots.modal.querySelector(".modal-body");
        if (nextModalBody) {
          nextModalBody.scrollTop = scrollTop;
        }
      });

    function buildAutomationTaskDraft(partial = {}) {
      const resolvedGroupId =
        partial.group_id == null || partial.group_id === ""
          ? 0
          : Number(partial.group_id);
      const hasExplicitGroupIds = Object.prototype.hasOwnProperty.call(partial, "group_ids");
      const normalizedGroupIds = Array.isArray(partial.group_ids)
        ? partial.group_ids
        : String(partial.group_ids || "")
            .split(",")
            .map((value) => Number(value.trim()))
            .filter(Boolean);
      const resolvedGroupIds = hasExplicitGroupIds
        ? normalizedGroupIds
        : normalizedGroupIds.length
        ? normalizedGroupIds
        : resolvedGroupId
          ? [resolvedGroupId]
          : [];
      const normalizedGroupTgIds = String(partial.group_tg_ids || "")
        .split(",")
        .map((value) => Number(value.trim()))
        .filter(Boolean);
      const normalizedGroupTitles = String(partial.group_titles || "")
        .split(",")
        .map((value) => String(value || "").trim())
        .filter(Boolean);
      const taskKey = partial.task_key || "";
      const resolvedConfig = { ...(partial.config || {}) };
      if (taskKey === "notify_destination") {
        const resolvedDestination = String(resolvedConfig.destination || "").trim();
        const matchingGroup = state.groups.find((group) => String(group.tg_group_id) === resolvedDestination);
        const hasApprovalReply = String(resolvedConfig.suggested_reply_template || "").trim();
        resolvedConfig.delivery_mode = String(resolvedConfig.delivery_mode || (hasApprovalReply ? "approval_request" : "text")) || "text";
        resolvedConfig.destination_group_id = resolvedConfig.destination_group_id || (matchingGroup ? String(matchingGroup.tg_group_id) : "");
        resolvedConfig.destination_chat_id = resolvedConfig.destination_chat_id || (!matchingGroup ? resolvedDestination : "");
      } else if (taskKey === "reply_message") {
        resolvedConfig.reply_markup_type = String(resolvedConfig.reply_markup_type || "none") || "none";
        resolvedConfig.inline_buttons = normalizeReplyInlineButtons(resolvedConfig.inline_buttons);
      }
      const resolvedConditions = { ...(partial.conditions || {}) };
      if (taskKey === "notify_destination" && resolvedConditions.has_text === "") {
        resolvedConditions.has_text = true;
      }
      return {
        assignment_id: partial.assignment_id || "",
        task_key: taskKey,
        executor_type: partial.executor_type || "bot",
        enabled: partial.enabled !== false,
        conditions: resolvedConditions,
        config: resolvedConfig,
        agent_id: partial.agent_id == null || partial.agent_id === "" ? null : Number(partial.agent_id),
        group_id: resolvedGroupIds[0] || resolvedGroupId,
        group_ids: resolvedGroupIds,
        group_query: partial.group_query || "",
        group_tg_ids: normalizedGroupTgIds,
        group_titles: normalizedGroupTitles,
        group_tg_id: normalizedGroupTgIds[0] || "",
        group_title: normalizedGroupTitles[0] || "",
      };
    }

    function readAutomationTaskFormDraft(form) {
      const fd = new FormData(form);
      const taskKey = String(fd.get("task_key") || "");
      const definition = (state.cache.taskCatalog || []).find((item) => item.key === taskKey);
      const config = {};
      if (taskKey === "notify_destination") {
        const selectedDestinationGroupId = String(fd.get("config_destination_group_id") || "").trim();
        const destinationChatId = String(fd.get("config_destination_chat_id") || "").trim();
        config.message_template = String(fd.get("config_message_template") || "");
        config.delivery_mode = String(fd.get("config_delivery_mode") || "text") || "text";
        config.suggested_reply_template = String(fd.get("config_suggested_reply_template") || "");
        config.destination_group_id = selectedDestinationGroupId;
        config.destination_chat_id = destinationChatId;
        config.destination = selectedDestinationGroupId || destinationChatId;
      } else if (taskKey === "reply_message") {
        config.message_template = String(fd.get("config_message_template") || "");
        config.reply_markup_type = String(fd.get("config_reply_markup_type") || "none") || "none";
        config.inline_buttons = readReplyInlineButtonsFromForm(fd);
      } else {
        for (const field of normalizeTaskConfigSchema(definition)) {
          config[field.key] = String(fd.get("config_" + field.key) || "");
        }
      }
      return buildAutomationTaskDraft({
        assignment_id: String(fd.get("assignment_id") || ""),
        task_key: String(fd.get("task_key") || ""),
        executor_type: String(fd.get("executor_type") || "bot"),
        enabled: String(fd.get("enabled") || "true") === "true",
        conditions: {
          text_contains_any: String(fd.get("condition_text_contains_any") || ""),
          has_text: fd.get("condition_has_text") ? fd.get("condition_has_text") === "true" : (taskKey === "notify_destination" ? true : ""),
        },
        config,
        agent_id: fd.get("agent_id") ? Number(fd.get("agent_id")) : null,
        group_id: Number(fd.get("group_id") || 0),
        group_ids: String(fd.get("group_ids") || "")
          .split(",")
          .map((value) => Number(value.trim()))
          .filter(Boolean),
        group_query: String(fd.get("group_query") || ""),
        group_tg_ids: String(fd.get("group_tg_ids") || "")
          .split(",")
          .map((value) => Number(value.trim()))
          .filter(Boolean),
        group_titles: String(fd.get("group_titles") || "")
          .split(",")
          .map((value) => String(value || "").trim())
          .filter(Boolean),
        group_tg_id: Number(fd.get("group_tg_id") || 0) || "",
        group_title: String(fd.get("group_title") || ""),
      });
    }

    function formatAgentOptionLabel(agent) {
      const username = String(agent?.metadata?.username || "").replace(/^@+/, "").trim();
      const fallback = agent?.external_account_id || agent?.phone_number || ("agent-" + agent?.id);
      const base = username ? `@${username}` : `@${fallback}`;
      const authState = String(agent?.auth_state || "").trim();
      const status = String(agent?.status || "").trim();
      const markers = [authState, status].filter(Boolean).join(" / ");
      return markers ? `${base} [${markers}]` : base;
    }

    function automationTaskModalBody() {
      const tasks = state.cache.tasks[state.activeGroupId] || [];
      const catalog = state.cache.taskCatalog || [];
      const selectedTask = tasks.find((item) => item.assignment_id === state.ui.automationSelection) || null;
      const bindingGroupId = Number(
        state.ui.automationBindingGroupId
        || (selectedTask && selectedTask.group_id)
        || state.activeGroupId
        || 0
      );
      const agents = state.cache.agents[bindingGroupId] || [];
      const selectedAgentId = Number((currentAutomationTaskDraft() || selectedTask || {}).agent_id || 0);
      const selectedAgent =
        Object.values(state.cache.agents)
          .flat()
          .find((agent) => Number(agent.id) === selectedAgentId) || null;
      const visibleAgents = selectedAgent && !agents.some((agent) => Number(agent.id) === Number(selectedAgent.id))
        ? [selectedAgent, ...agents]
        : agents;
      const relatedAgentGroups = selectedAgentId ? (state.cache.agentGroups[selectedAgentId] || []) : [];
      const filteredBindingGroups = Array.from(
        relatedAgentGroups.reduce((acc, item) => {
          const tgGroupId = Number(item.tg_group_id || 0);
          if (!tgGroupId || acc.has(tgGroupId)) {
            return acc;
          }
          const matchedGroup =
            state.groups.find((group) => Number(group.id) === Number(item.id))
            || state.groups.find((group) => Number(group.tg_group_id) === tgGroupId);
          const resolvedGroupId = matchedGroup ? Number(matchedGroup.id) : null;
          const displayId = resolvedGroupId || -tgGroupId;
          acc.set(tgGroupId, {
            id: displayId,
            internal_id: resolvedGroupId,
            tg_group_id: tgGroupId,
            title: String(item.title || matchedGroup?.title || item.tg_group_id || ""),
            available: Boolean(resolvedGroupId),
          });
          return acc;
        }, new Map()).values()
      )
        .filter((group) => Number(group.tg_group_id));
      const draft = currentAutomationTaskDraft();
      const editTarget = draft || selectedTask || {
        assignment_id: "",
        task_key: catalog[0] ? catalog[0].key : "",
        executor_type: "bot",
        enabled: true,
        conditions: {},
        config: {},
        agent_id: null,
        group_id: "",
        group_ids: [],
        group_query: "",
        group_tg_ids: [],
        group_titles: [],
        group_tg_id: "",
        group_title: "",
      };
      const groupOptions =
        editTarget.executor_type === "agent" && selectedAgentId
          ? filteredBindingGroups
          : state.groups;
      const hasExplicitSelectedGroups = Array.isArray(editTarget.group_ids);
      const selectedGroupIds = hasExplicitSelectedGroups
        ? editTarget.group_ids.map((value) => Number(value)).filter(Boolean)
        : Number(editTarget.group_id || 0)
          ? [Number(editTarget.group_id)]
          : [];
      const selectedGroupSource = [...groupOptions, ...state.groups].reduce((acc, group) => {
        const normalizedId = Number(group.id || 0);
        if (normalizedId && !acc.has(normalizedId)) {
          acc.set(normalizedId, group);
        }
        return acc;
      }, new Map());
      const groupQuery = String(editTarget.group_query || "").trim().toLowerCase();
      const selectedGroups = [];
      const selectedGroupKeys = new Set();
      selectedGroupIds.forEach((groupId, index) => {
        const numericGroupId = Number(groupId);
        const directMatch = selectedGroupSource.get(numericGroupId) || null;
        const selectedGroupTgId = Number((editTarget.group_tg_ids || [])[index] || 0);
        const selectedGroupTitle = String((editTarget.group_titles || [])[index] || "").trim();
        const fallbackMatch = !directMatch && selectedGroupTgId
          ? groupOptions.find((group) => Number(group.tg_group_id || 0) === selectedGroupTgId) || null
          : null;
        const resolvedGroup = directMatch || fallbackMatch;
        const selectionKey = resolvedGroup
          ? `id:${Number(resolvedGroup.id || 0)}`
          : selectedGroupTgId
            ? `tg:${selectedGroupTgId}`
            : selectedGroupTitle
              ? `title:${selectedGroupTitle}`
              : "";
        if (resolvedGroup) {
          if (selectionKey && selectedGroupKeys.has(selectionKey)) {
            return;
          }
          if (selectionKey) {
            selectedGroupKeys.add(selectionKey);
          }
          selectedGroups.push(resolvedGroup);
          return;
        }
        if (!selectedGroupTgId && !selectedGroupTitle) {
          return;
        }
        if (selectionKey && selectedGroupKeys.has(selectionKey)) {
          return;
        }
        if (selectionKey) {
          selectedGroupKeys.add(selectionKey);
        }
        selectedGroups.push({
          id: numericGroupId || -selectedGroupTgId,
          tg_group_id: selectedGroupTgId || null,
          title: selectedGroupTitle || String(selectedGroupTgId || numericGroupId || "Unknown group"),
        });
      });
      const availableGroups = groupOptions.filter((group) => {
        if (selectedGroupIds.includes(Number(group.id))) {
          return false;
        }
        if (!groupQuery) {
          return true;
        }
        const haystack = `${group.title} ${group.tg_group_id}`.toLowerCase();
        return haystack.includes(groupQuery);
      });
      const definition = catalog.find((item) => item.key === editTarget.task_key) || catalog[0] || null;
      const configFields = normalizeTaskConfigSchema(definition);
      const isNotifyDestinationTask = editTarget.task_key === "notify_destination";

          <input type="hidden" name="group_ids" value="${escapeHtml(selectedGroupIds.join(","))}" />
          <input type="hidden" name="group_tg_ids" value="${escapeHtml((editTarget.group_tg_ids || []).join(","))}" />
          <input type="hidden" name="group_titles" value="${escapeHtml((editTarget.group_titles || []).join(","))}" />
          <input type="hidden" name="group_tg_id" value="${escapeHtml(String(editTarget.group_tg_id || ""))}" />
          <input type="hidden" name="group_title" value="${escapeHtml(editTarget.group_title || "")}" />
          <div class="field">
            <label class="field-label" for="task-key">Task Type</label>
            <select id="task-key" name="task_key" data-action="task-key-change">
              ${catalog.map((item) => `<option value="${escapeHtml(item.key)}" ${item.key === editTarget.task_key ? "selected" : ""}>${escapeHtml(item.title)}</option>`).join("")}
            </select>
          </div>
          <div class="field">
            <label class="field-label" for="task-executor">Executor</label>
            ${renderSearchableSelect({
              id: "task-executor",
              name: "executor_type",
              value: editTarget.executor_type,
              options: [
                { value: "bot", label: "bot", meta: "" },
                { value: "agent", label: "agent", meta: "" },
              ],
              placeholder: "Select executor",
              searchPlaceholder: "Search executors",
              emptyLabel: "No matching executors.",
              selectAction: "task-executor-change",
            })}
          </div>
          ${
            editTarget.executor_type === "agent"
              ? `
                <div class="field" data-agent-executor-field>
                  <label class="field-label" for="task-agent-id">Agent</label>
                  ${renderSearchableSelect({
                    id: "task-agent-id",
                    name: "agent_id",
                    value: editTarget.agent_id == null ? "" : String(editTarget.agent_id),
                    options: [{ value: "", label: "Select an agent", meta: "" }].concat(
                      visibleAgents.map((agent) => ({
                        value: String(agent.id),
                        label: formatAgentOptionLabel(agent),
                        meta: agent.phone_number || "",
                      }))
                    ),
                    placeholder: "Select an agent",
                    searchPlaceholder: "Search agents",
                    emptyLabel: "No matching agents.",
                    selectAction: "task-agent-change",
                  })}
                  <div class="field-hint">Agent execution requires a linked Telegram account.</div>
                </div>
              `
              : `
                <div class="field">
                  <label class="field-label" for="task-bot-name">Bot</label>

                .replaceAll('data-action="remove-bulk-user"', 'data-action="remove-bulk-add-user"')}

        }),

      });

    function agentGroupMembersDrawerBody({ members = [], stateName = "ready", searchValue = "" } = {}) {
      const normalizedState = String(stateName || "ready").trim().toLowerCase();
      let content = `
        <div class="stack">
          <div class="toolbar">
            <input class="search-input" type="search" placeholder="${escapeHtml(t("searchMembers"))}" value="${escapeHtml(searchValue)}" data-action="agent-group-members-search" />
          </div>
          <table>
            <thead><tr><th>User ID</th><th>Username</th><th>Full Name</th><th>Role</th><th>Created At</th></tr></thead>
            <tbody>
              ${members.map((member) => `
                <tr>
                  <td class="mono">${escapeHtml(String(member.user_id || ""))}</td>
                  <td>${escapeHtml(member.username ? `@${String(member.username).replace(/^@+/, "")}` : "Unknown")}</td>
                  <td>${escapeHtml(member.full_name || member.first_name || "Unknown")}</td>
                  <td>${escapeHtml(member.role || "member")}</td>
                  <td>${escapeHtml(member.created_at ? formatDateTime(member.created_at) : "Unknown")}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>

      if (normalizedState === "loading") {
        content = memberSearchStatusMarkup("Searching", true);
